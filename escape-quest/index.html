<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 3D escape adventure for kids in English, French and Portuguese. Eleven rooms of puzzles that practice math, logic, reading and memory, alone or with friends.">
<meta name="theme-color" content="#1d1934">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Escape Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a lit 3D diorama of each room (the "stage") under a slim top bar, with the team and backpack below; puzzles open as close-up cards. */
/* Single deliberate look: a night-time storybook, marmalade orange as the one bold accent. */
:root {
  color-scheme: dark;
  --night: #1d1934;
  --night-2: #2a2450;
  --paper: #fff4e0;
  --ink: #2b2140;
  --ink-soft: #6a5c80;
  --marmalade: #f39a2b;
  --marmalade-deep: #c96a0c;
  --mint: #4fc59a;
  --berry: #e2536b;
  --muted: #b9b0d6;
  --display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, var(--night-2), var(--night));
  background-color: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--marmalade); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }

/* ---------- start screen ---------- */
.hero { display: grid; gap: 14px; padding-block: 8px; }
.hero .kicker { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--marmalade); }
.hero h1 { font-size: clamp(40px, 9vw, 72px); font-weight: 800; }
.hero h1 span { color: var(--marmalade); }
.hero p { margin: 0; color: var(--muted); font-size: 17px; max-width: 60ch; }
.panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 720px) { .panels { grid-template-columns: minmax(0, 1fr); } }
.panel { background: rgba(255,255,255,.06); border-radius: 22px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-size: 24px; }
.panel h2 small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--marmalade); font-weight: 800; margin-bottom: 4px; }
.maker { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 420px) { .maker { grid-template-columns: minmax(0, 1fr); } }
.preview { width: 170px; height: 220px; max-width: 100%; border-radius: 18px; background: radial-gradient(circle at 50% 35%, #3d356b, #1d1934 75%); justify-self: center; display: block; }
.opts { display: grid; gap: 10px; min-width: 0; }
.opt-row { display: grid; gap: 4px; }
.opt-row > span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); padding: 0; }
.sw.on { border-color: var(--paper); }
.chip-btn { border: 0; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; background: rgba(255,255,255,.1); }
.chip-btn.on { background: var(--paper); color: var(--ink); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 800; font-size: 14px; }
.field input { font: inherit; font-size: 19px; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--marmalade); background: var(--paper); color: var(--ink); width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font-family: var(--display); font-weight: 800; font-size: 19px;
  padding: 11px 20px; border-radius: 16px; border: 0;
  background: var(--marmalade); color: var(--ink);
  box-shadow: 0 5px 0 var(--marmalade-deep);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--marmalade-deep); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 3px rgba(255,255,255,.3); }
.btn.mint { background: var(--mint); box-shadow: 0 5px 0 #2f8f6b; }
.teams { display: grid; gap: 8px; }
.team-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 8px 10px; }
.team-row div { flex: 1; min-width: 0; }
.team-row b { font-family: var(--display); font-size: 17px; }
.team-row small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-line { font-size: 14px; color: var(--muted); margin: 0; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 800; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.15); }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.bar .room-name { flex: 1 1 200px; min-width: 0; }
.bar .room-name small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--marmalade); font-weight: 800; }
.bar .room-name h2 { font-size: 26px; }
.pill { background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.icon-btn { background: rgba(255,255,255,.08); border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 15px; }
.icon-btn.hint { background: var(--mint); color: var(--ink); }

/* ---------- the 3D stage ---------- */
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.35); touch-action: manipulation; }
@media (max-width: 600px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; font-size: 12px; font-weight: 800; background: rgba(29,25,52,.82); color: var(--paper); padding: 2px 9px; border-radius: 999px; white-space: nowrap; will-change: transform; }
.tag.done::after { content: " ✓"; color: var(--mint); }
.tag.person { pointer-events: none; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 13px; }
.tag.person.me { background: var(--marmalade); }
.bubble { position: absolute; left: 0; top: 0; pointer-events: none; font-size: 30px; will-change: transform; }
.stage-help { position: absolute; left: 12px; top: 12px; background: rgba(29,25,52,.82); padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; max-width: calc(100% - 24px); pointer-events: none; }
.emotes { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.emotes button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(29,25,52,.82); font-size: 22px; }
.fishes { position: absolute; left: 10px; bottom: 10px; background: rgba(29,25,52,.82); color: var(--paper); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 800; }

/* ---------- team + backpack ---------- */
.lower { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 720px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.tray { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: rgba(255,255,255,.06); border-radius: 18px; padding: 10px 14px; min-height: 60px; min-width: 0; }
.tray > strong { font-family: var(--display); font-size: 15px; color: var(--muted); margin-right: 4px; }
.tray .empty { color: var(--muted); font-size: 14px; }
.item { display: flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 5px 12px 5px 8px; font-weight: 800; font-size: 14px; }
.item span { font-size: 22px; line-height: 1; }
.item.new { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.mate { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 800; font-size: 14px; }
.mate i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }

/* ---------- close-up card ---------- */
.overlay { position: fixed; inset: 0; background: rgba(12,10,26,.72); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--paper); color: var(--ink); width: 100%; max-width: 540px; max-height: 100%; overflow: auto; border-radius: 24px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 0 rgba(0,0,0,.25); }
.card-head { display: flex; align-items: start; gap: 10px; }
.card-head h3 { flex: 1; font-size: 26px; color: var(--ink); }
.close { border: 0; background: #f0e2c6; color: var(--ink); border-radius: 999px; width: 40px; height: 40px; font-size: 20px; font-weight: 800; flex: none; }
.card p { margin: 0; }
.card .say { background: #f6e6c6; border-radius: 14px; padding: 10px 14px; color: var(--ink); }
.card .btn { justify-self: start; }
.big-emoji { font-size: 84px; text-align: center; line-height: 1.1; }
.note { background: #fffdf6; border: 2px dashed #d7bf8f; border-radius: 6px; padding: 14px; font-family: var(--display); font-size: 19px; color: var(--ink); transform: rotate(-1deg); }
.board { background: #2f5d46; border: 10px solid #a8743f; border-radius: 8px; padding: 16px; color: #f4f1de; font-family: var(--display); font-size: 26px; display: grid; gap: 6px; text-align: center; }
.board .code { margin-top: 8px; font-size: 18px; color: #ffe08a; }
.board .code b { font-size: 30px; }
.shake { animation: shake .35s ease; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.lock { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #3b3156; padding: 14px; border-radius: 18px; }
.wheel { display: grid; gap: 4px; justify-items: center; }
.wheel button { width: 48px; height: 34px; border: 0; border-radius: 10px; background: #5b4f80; color: var(--paper); font-size: 16px; font-weight: 800; }
.wheel output { width: 48px; height: 56px; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 32px; font-weight: 800; border-radius: 10px; font-variant-numeric: tabular-nums; }
.letters input { width: min(48px, 10.5vw); height: 58px; text-align: center; font-family: var(--display); font-size: 30px; font-weight: 800; text-transform: uppercase; border: 0; border-radius: 10px; background: var(--paper); color: var(--ink); }
.shelf { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 16px 8px 10px; background: linear-gradient(to bottom, transparent 82%, #a8743f 82%); border-radius: 12px; }
.bottle { width: 48px; height: 90px; border: 0; padding: 0; background: none; position: relative; }
.bottle::before { content: ""; position: absolute; left: 34%; top: 0; width: 32%; height: 24%; background: #e8e0f0; border-radius: 4px 4px 0 0; box-shadow: inset 0 3px 0 #8b6a4a; }
.bottle i { position: absolute; left: 0; right: 0; bottom: 0; height: 78%; border-radius: 20px 20px 14px 14px; background: var(--c); box-shadow: inset -6px -6px 0 rgba(0,0,0,.15), inset 6px 6px 0 rgba(255,255,255,.35); }
.bottle.poured i { opacity: .25; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: #e6d6b6; }
.dots i.on { background: var(--mint); }
.flowers svg { width: 100%; height: auto; background: linear-gradient(#d9f2ff, #eefaff); border-radius: 14px; }
.sign { background: #a8743f; color: #fff4e0; font-family: var(--display); font-size: 18px; padding: 10px 14px; border-radius: 8px; text-align: center; }
.birds { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 12px 6px 18px; background: linear-gradient(to bottom, transparent 70%, #8b5a2b 70% 74%, transparent 74%); border-radius: 12px; }
.bird { display: grid; justify-items: center; width: 60px; }
.bird .b { font-size: 40px; line-height: 1; }
.bird .letter { font-family: var(--display); font-size: 26px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 10px; width: 40px; text-align: center; margin-top: -4px; }
.bird .feet { font-size: 7px; color: #b9ad98; margin-top: 6px; letter-spacing: .1em; font-weight: 800; }
.bird .feet.big { font-size: 22px; color: var(--berry); font-family: var(--display); }
.scope { width: min(300px, 100%); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: 12px solid #3b3156; background:
  radial-gradient(2px 2px at 20% 30%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 70% 20%, #fff 50%, transparent 52%),
  radial-gradient(2px 2px at 80% 75%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 35% 80%, #fff 50%, transparent 52%),
  radial-gradient(circle, #1a1f5a, #070921);
  display: flex; justify-content: space-around; align-items: center; font-size: 46px; padding: 0 10px; }
.dials { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.dial { width: 82px; height: 82px; border-radius: 50%; border: 6px solid #5d6788; background: #1d1934; font-size: 40px; display: grid; place-items: center; }
.dial-lbl { display: flex; justify-content: center; gap: 12px; font-size: 12px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .1em; }
.dial-lbl span { width: 82px; text-align: center; }

.map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #f4e2b8; border: 4px solid #a8743f; border-radius: 10px; padding: 8px; width: 100%; max-width: 320px; margin: 0 auto; }
.map span { aspect-ratio: 1; display: grid; place-items: center; font-size: clamp(22px, 7vw, 34px); background: rgba(168,116,63,.12); border-radius: 6px; }
.pics, .bags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pics button { width: 60px; height: 60px; border: 0; border-radius: 14px; background: #f0e2c6; font-size: 32px; }
.bag { width: 72px; height: 72px; border: 3px solid transparent; border-radius: 40% 40% 30% 30%; background: #d9c49a; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; transition: transform .1s; }
.bag.on { border-color: var(--mint); background: #bfe8d4; transform: translateY(-4px); }
.total { text-align: center; font-family: var(--display); font-size: 22px; font-weight: 800; }
.lamps { display: flex; justify-content: center; gap: 14px; font-size: 44px; }
.lamp { filter: grayscale(1) brightness(.45); transition: filter .2s; }
.lamp.on { filter: drop-shadow(0 0 10px #ffd27a); }
.keys { display: flex; gap: 6px; justify-content: center; }
.pkey { width: 52px; height: 130px; border: 0; border-radius: 0 0 12px 12px; background: var(--c); box-shadow: inset 0 -10px 0 rgba(0,0,0,.2); }
.pkey.hit { transform: translateY(4px); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.notes { display: flex; gap: 10px; justify-content: center; }
.notes i { width: 34px; height: 34px; border-radius: 50%; background: #e6d6b6; }
.notes i.on { animation: pop .3s ease; }
/* adventure map */
.mapview { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column; background: #78c65a; }
.map-top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); background: var(--night); box-shadow: 0 4px 0 rgba(0,0,0,.25); position: relative; z-index: 2; }
.map-top h2 { flex: 1; min-width: 0; font-size: 21px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 440px) { .map-top h2 { visibility: hidden; } }
.map-chip { background: rgba(255,255,255,.12); border: 0; border-radius: 999px; padding: 6px 10px; font-weight: 800; font-size: 15px; white-space: nowrap; color: var(--paper); font-variant-numeric: tabular-nums; }
.map-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 230px; }
.map-canvas { position: relative; width: min(100%, 520px); margin: 0 auto; }
.map-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map-canvas .hills ellipse { fill: #9ad97a; opacity: .8; }
.map-canvas .drifts ellipse { fill: #ffffff; opacity: .55; }
.map-canvas .landmark { filter: drop-shadow(0 4px 0 rgba(0,0,0,.15)); }
.road-edge { fill: none; stroke: #c9955a; stroke-width: 46; stroke-linecap: round; }
.road { fill: none; stroke: #f6dfae; stroke-width: 36; stroke-linecap: round; }
.road-dash { fill: none; stroke: #ffffff; stroke-width: 6; stroke-dasharray: 2 18; stroke-linecap: round; }
.ribbon rect { fill: #e2536b; } .ribbon .rend { fill: #a8344a; }
.ribbon text { fill: #ffffff; font: 800 14px var(--display); }
.mnode { cursor: pointer; }
.mnode:focus-visible { outline: none; } .mnode:focus-visible .face { stroke: var(--marmalade); stroke-width: 7; }
.mnode .shadow { fill: rgba(0,0,0,.2); }
.mnode .base { fill: var(--b); } .mnode .face { fill: var(--f); stroke: #ffffff; stroke-width: 5; } .mnode .shine { fill: rgba(255,255,255,.5); }
.mnode.done { --f: #ffbe3d; --b: #d98317; } .mnode.cur { --f: #5bd15d; --b: #3a9a3e; } .mnode.lock { --f: #e0dced; --b: #aaa3c2; cursor: default; }
.mnode .st { font-size: 26px; fill: #d6d0e4; stroke: #8c84a6; stroke-width: 1.5; }
.mnode .st.on { fill: #ffd23f; stroke: #b07a10; }
.mnode .badge circle { fill: #2b2140; stroke: #ffffff; stroke-width: 3; } .mnode .badge text { fill: #ffffff; font: 800 13px var(--body); }
.mnode .ring { fill: none; stroke: #ffffff; stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
.map-avatar { position: absolute; transform: translate(-50%, -100%); width: 58px; height: 58px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; font-size: 34px; box-shadow: 0 5px 0 rgba(0,0,0,.2); animation: hop 1.2s ease-in-out infinite; pointer-events: none; }
.map-avatar::after { content: ""; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); border: 9px solid transparent; border-top-color: #ffffff; border-bottom: 0; }
.map-avatar.walking { animation: none; }
@keyframes hop { 0%, 100% { margin-top: 0; } 50% { margin-top: -9px; } }
.map-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--paper); color: var(--ink); border-radius: 26px 26px 0 0; display: grid; gap: 10px; max-height: 60vh; overflow: auto; box-shadow: 0 -6px 0 rgba(0,0,0,.15); transition: transform .4s cubic-bezier(.2,1.3,.4,1);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.map-sheet.hidden-down { transform: translateY(110%); }
.map-sheet > * { width: 100%; max-width: 560px; justify-self: center; margin: 0; }
.sheet-title { font-size: 24px; text-align: center; color: var(--ink); }
.sheet-stars { display: flex; justify-content: center; gap: 10px; font-size: 46px; }
.sheet-stars span { animation: starpop .5s ease both; }
.sheet-stars span.off { filter: grayscale(1); opacity: .3; }
@keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
.next-intro { font-size: 15px; color: var(--ink-soft); }
.go-btn { font-family: var(--display); font-weight: 800; font-size: 22px; padding: 14px; border: 0; border-radius: 18px; background: #5bd15d; color: #ffffff; box-shadow: 0 6px 0 #3a9a3e; text-transform: uppercase; letter-spacing: .05em; }
.go-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3a9a3e; }
.home-btn { justify-self: center; background: #f0e2c6; color: var(--ink); width: auto !important; }
.prize-track { display: grid; gap: 4px; }

.pbar { height: 16px; border-radius: 999px; background: #eadfc6; overflow: hidden; }

.tri { color: var(--muted); margin: 0; font-weight: 700; }

.kind-btn b { font-family: var(--display); font-size: 24px; color: var(--paper); }
.back { justify-self: start; }

.level-btn small { color: var(--muted); font-size: 12px; font-weight: 700; }
.level-btn.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 3px var(--marmalade); }
.level-btn.on small { color: var(--ink-soft); }
.icon-btn.off { opacity: .4; }
.btn.ghost-ink { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
.tag.nudge { background: var(--marmalade); color: var(--ink); animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { margin-top: 0; box-shadow: 0 0 0 0 rgba(243,154,43,.7); } 50% { margin-top: -8px; box-shadow: 0 0 0 8px rgba(243,154,43,0); } }

.stars-big { font-size: 40px; text-align: center; letter-spacing: 6px; }

.prize { background: #fff0c2; } .prize.new { background: var(--mint); font-weight: 800; }

.next-title { font-size: 22px; color: var(--ink); }

.sort { display: grid; gap: 6px; }

.sort-row button.on { background: var(--mint); }
.seagrid { border-collapse: collapse; margin: 0 auto; font-size: 24px; }
.seagrid th { font: 800 14px var(--body); color: var(--ink-soft); padding: 2px 6px; }
.seagrid td { width: 40px; height: 40px; text-align: center; border: 2px solid #d8cbb0; background: #e4f0fb; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); font-weight: 800; padding: 10px 18px; border-radius: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.25); z-index: 30; max-width: calc(100% - 32px); text-align: center; }

.cert { background: var(--paper); color: var(--ink); border-radius: 26px; padding: 26px 22px; display: grid; gap: 14px; text-align: center; justify-items: center; border: 6px double var(--marmalade); }

.cert .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cert .stats span { background: #f6e6c6; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-variant-numeric: tabular-nums; }

.cert .secret { background: #fff0c2; border: 3px dashed #e0b23a; border-radius: 16px; padding: 12px 16px; color: var(--ink); max-width: 48ch; }
canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {

tout. Recommence.", "Eca! O verde deixa tudo grudento. Comece de novo."], "Fizzle! Wrong order. The potions bubbled back up.": ["Pschitt ! Mauvais ordre. Les potions sont remontées.", "Pssst! Ordem errada. As poções borbulharam de volta."], "Clunk. The machine shakes its gears. That's not tonight's sky.": ["Clonk. La machine secoue ses engrenages. Ce n'est pas le ciel de ce soir.", "Clonc. A máquina sacode as engrenagens. Esse não é o céu de hoje."], "Team play only works when the game is open on claude.ai. You can still play alone!": ["Le jeu en équipe marche seulement quand le jeu est ouvert sur claude.ai. Tu peux quand même jouer en solo !", "Jogar em equipe só funciona com o jogo aberto no claude.ai. Você ainda pode jogar solo!"], "Couldn't reach your team right now. Keep playing, it will catch up.": ["Impossible de joindre ton équipe pour l'instant. Continue, ça va se rattraper.", "Não deu para falar com sua equipe agora. Continue jogando, já já sincroniza."], "You found: {item}!": ["Tu as trouvé : {item} !", "Você encontrou: {item}!"], "{who} found: {item}!": ["{who} a trouvé : {item} !", "{who} encontrou: {item}!"], "{who} solved a puzzle!": ["{who} a résolu une énigme !", "{who} resolveu um enigma!"], "{who} opened the way! Everyone hurries through.": ["{who} a ouvert le passage ! Tout le monde se dépêche de passer.", "{who} abriu a passagem! Todo mundo corre para passar."], "The brass key turns with a click. The door swings open!": ["La clé en laiton tourne, clic ! La porte s'ouvre.", "A chave de latão gira com um clique. A porta se abre!"], "The lock pops open and the gate creaks wide!": ["Le cadenas s'ouvre et le portail grince en s'ouvrant !", "O cadeado abre e o portão range ao se abrir!"], "Look around": ["Regarder autour", "Olhar em volta"], "Chalkboard": ["Tableau noir", "Lousa"], "Painting": ["Portrait", "Retrato"], "Potion machine": ["Machine à potions", "Máquina de poções"], "Door": ["Porte", "Porta"], "Desk drawer": ["Tiroir du bureau", "Gaveta da mesa"], "Puddle": ["Flaque", "Poça"], "Garden shed": ["Cabane de jardin", "Galpão"], "Birds on a wire": ["Oiseaux sur un fil", "Passarinhos no fio"], "Flower bed": ["Parterre de fleurs", "Canteiro de flores"], "Frog": ["Grenouille", "Sapo"], "Gate": ["Portail", "Portão"], "Scroll": ["Parchemin", "Pergaminho"], "Treasure chest": ["Coffre au trésor", "Baú do tesouro"], "Telescope": ["Télescope", "Telescópio"], "Star machine": ["Machine à étoiles", "Máquina de estrelas"], "Round door": ["Porte ronde", "Porta redonda"], "Professor Marmalade": ["Professeure Marmelade", "Professora Marmelada"], "\"Mrrrow! Hello, {name}! Here's a little clue: <b>{clue}</b>\"": ["« Miaaou ! Bonjour, {name} ! Voici un petit indice : <b>{clue}</b> »", "“Miaau! Olá, {name}! Aqui vai uma pistinha: <b>{clue}</b>”"], "Need a bigger clue? Press the Hint button at the top.": ["Besoin d'un plus gros indice ? Appuie sur le bouton Indice en haut.", "Precisa de uma pista maior? Aperte o botão Dica lá em cima."], "The chalkboard": ["Le tableau noir", "A lousa"], "Drawer code:": ["Code du tiroir :", "Código da gaveta:"], "Drawer:": ["Tiroir :", "Gaveta:"], "Professor Marmalade's handwriting! Each picture stands for a number.": ["L'écriture de la professeure Marmelade ! Chaque dessin vaut un nombre.", "A letra da Professora Marmelada! Cada desenho vale um número."], "A painting": ["Un portrait", "Um retrato"], "\"Professor Marmalade, Inventor.\" A tiny tag on the frame says: <b>Green potions make everything sticky. Never use them!</b>": ["« Professeure Marmelade, inventrice. » Une petite étiquette sur le cadre dit : <b>Les potions vertes collent partout. Ne jamais les utiliser !</b>", "“Professora Marmelada, inventora.” Uma etiquetinha na moldura diz: <b>Poções verdes deixam tudo grudento. Nunca use!</b>"], "A sticky puddle": ["Une flaque collante", "Uma poça grudenta"], "A bright <b>green</b> puddle and a broken bottle. Marmalade must have knocked over a potion. Sticky paw prints lead under the desk...": ["Une flaque <b>verte</b> toute brillante et une bouteille cassée. Marmelade a dû renverser une potion. Des traces de pattes collantes mènent sous le bureau...", "Uma poça <b>verde</b> brilhante e um frasco quebrado. A Marmelada deve ter derrubado uma poção. Pegadas grudentas levam para debaixo da mesa..."], "A chatty frog": ["Une grenouille bavarde", "Um sapo tagarela"], "\"Ribbit! Little things need big eyes. Ribbit! And I always count my flowers from the <b>smallest</b> to the <b>biggest</b>.\"": ["« Croâ ! Les petites choses demandent de grands yeux. Croâ ! Et je compte toujours mes fleurs de la plus <b>petite</b> à la plus <b>grande</b>. »", "“Croac! Coisas pequenas pedem olhos grandes. Croac! E eu sempre conto minhas flores da <b>menor</b> para a <b>maior</b>.”"], "A rolled-up scroll": ["Un parchemin roulé", "Um pergaminho enrolado"], "I have a face and two hands,<br>but no arms and no legs.<br>I tick all day and tock all night.<br><br>What am I?": ["J'ai un visage et deux aiguilles,<br>mais ni bras ni jambes.<br>Je fais tic le jour et tac la nuit.<br><br>Qui suis-je ?", "Tenho um rosto e dois ponteiros,<br>mas nem braços nem pernas.<br>Faço tique o dia todo e taque a noite toda.<br><br>Quem sou eu?"], "What am I?": ["Qui suis-je ?", "Quem sou eu?"], "At the bottom: <b>\"Say the answer to my treasure chest.\"</b>": ["En bas : <b>« Dis la réponse à mon coffre au trésor. »</b>", "Lá embaixo: <b>“Diga a resposta para o meu baú do tesouro.”</b>"], "The desk drawer": ["Le tiroir du bureau", "A gaveta da mesa"], "The note is in your backpack now.": ["La note est dans ton sac à dos maintenant.", "O bilhete está na sua mochila agora."], "The drawer has a lock with <b>3 numbers</b>.": ["Le tiroir a un cadenas à <b>3 chiffres</b>.", "A gaveta tem um cadeado de <b>3 números</b>."], "The potion machine": ["La machine à potions", "A máquina de poções"], "The machine is snoozing. It already gave out the brass key.": ["La machine fait la sieste. Elle a déjà donné la clé en laiton.", "A máquina está cochilando. Ela já deu a chave de latão."], "Six potions sit above a funnel. A label says: <b>Pour 5 potions in the right order and I'll give you a prize.</b>": ["Six potions attendent au-dessus d'un entonnoir. Une étiquette dit : <b>Verse 5 potions dans le bon ordre et je te donnerai un cadeau.</b>", "Seis poções estão em cima de um funil. Uma etiqueta diz: <b>Despeje 5 poções na ordem certa e eu te dou um prêmio.</b>"], "The door": ["La porte", "A porta"], "Locked tight! There's a tiny keyhole, just right for a little <b>brass key</b>.": ["Fermée à double tour ! Il y a une toute petite serrure, juste pour une petite <b>clé en laiton</b>.", "Bem trancada! Tem uma fechadurinha, do tamanho certo para uma pequena <b>chave de latão</b>."], "The flower bed": ["Le parterre de fleurs", "O canteiro de flores"], "Count my petals!<br>Shortest flower first, tallest flower last.": ["Compte mes pétales !<br>La plus petite fleur d'abord, la plus grande à la fin.", "Conte minhas pétalas!<br>A flor mais baixa primeiro, a mais alta por último."], "The garden shed": ["La cabane de jardin", "O galpão do jardim"], "Just some garden gloves and an empty pot now.": ["Il ne reste que des gants de jardin et un pot vide.", "Agora só sobraram luvas de jardim e um vaso vazio."], "A padlock with <b>4 numbers</b>. Someone scratched a flower 🌸 on it.": ["Un cadenas à <b>4 chiffres</b>. Quelqu'un a gravé une fleur 🌸 dessus.", "Um cadeado de <b>4 números</b>. Alguém riscou uma flor 🌸 nele."], "You look through the magnifying glass. There are <b>numbers</b> on their feet!": ["Tu regardes avec la loupe. Il y a des <b>numéros</b> sur leurs pattes !", "Você olha com a lupa. Tem <b>números</b> nos pezinhos deles!"], "Each bird is holding a letter. Something tiny is written on their feet, but it's way too small to read.": ["Chaque oiseau tient une lettre. Quelque chose de minuscule est écrit sur leurs pattes, mais c'est bien trop petit pour être lu.", "Cada passarinho segura uma letra. Tem algo minúsculo escrito nos pezinhos, mas é pequeno demais para ler."], "The garden gate": ["Le portail du jardin", "O portão do jardim"], "The gate's lock wants a <b>{n}-letter word</b>.": ["Le cadenas du portail veut un <b>mot de {n} lettres</b>.", "O cadeado do portão pede uma <b>palavra de {n} letras</b>."], "The treasure chest": ["Le coffre au trésor", "O baú do tesouro"], "Empty now. The lens is already out.": ["Vide maintenant. La lentille a déjà été prise.", "Vazio agora. A lente já foi pega."], "The chest has a lock with <b>{n} letters</b>.": ["Le coffre a un cadenas à <b>{n} lettres</b>.", "O baú tem um cadeado de <b>{n} letras</b>."], "The telescope": ["Le télescope", "O telescópio"], "You peek in... everything is blurry! The <b>lens</b> is missing.": ["Tu regardes dedans... tout est flou ! Il manque la <b>lentille</b>.", "Você espia... está tudo borrado! Falta a <b>lente</b>."], "Through the telescope": ["Dans le télescope", "Pelo telescópio"], "You click the lens into place. Three things shine in the sky, from <b>left</b> to <b>right</b>.": ["Tu mets la lentille en place. Trois choses brillent dans le ciel, de <b>gauche</b> à <b>droite</b>.", "Você encaixa a lente. Três coisas brilham no céu, da <b>esquerda</b> para a <b>direita</b>."], "The star machine": ["La machine à étoiles", "A máquina de estrelas"], "The machine is resting. It already made the star key.": ["La machine se repose. Elle a déjà fabriqué la clé étoile.", "A máquina está descansando. Ela já fez a chave-estrela."], "Three dials and a big lever. A label says: <b>Show me tonight's sky.</b> Tap a dial to turn it.": ["Trois cadrans et un gros levier. Une étiquette dit : <b>Montre-moi le ciel de ce soir.</b> Touche un cadran pour le tourner.", "Três botões giratórios e uma alavanca grande. Uma etiqueta diz: <b>Mostre o céu desta noite.</b> Toque num botão para girar."], "Left": ["Gauche", "Esquerda"], "Middle": ["Milieu", "Meio"], "Right": ["Droite", "Direita"], "Pull the lever": ["Tirer le levier", "Puxar a alavanca"], "The round door": ["La porte ronde", "A porta redonda"], "A big round door with a <b>star-shaped</b> keyhole in the middle.": ["Une grande porte ronde avec une serrure en forme d'<b>étoile</b> au milieu.", "Uma grande porta redonda com uma fechadura em forma de <b>estrela</b> no meio."], "Hint {i} of {n}": ["Indice {i} sur {n}", "Dica {i} de {n}"], "Professor Marmalade's voice echoes from somewhere: <b>\"{hint}\"</b>": ["La voix de la professeure Marmelade résonne quelque part : <b>« {hint} »</b>", "A voz da Professora Marmelada ecoa de algum lugar: <b>“{hint}”</b>"], "Still stuck? Ask again for a bigger hint.": ["Besoin de plus d'aide ? Redemande pour un plus gros indice.", "Ainda com dúvida? Peça de novo para uma dica maior."], "Step 1": ["Étape 1", "Passo 1"], "Make your detective": ["Crée ton détective", "Crie seu detetive"], "Your name": ["Ton prénom", "Seu nome"], "Type your name": ["Écris ton prénom", "Digite seu nome"], "Skin": ["Peau", "Pele"], "Hair": ["Cheveux", "Cabelo"], "Hairstyle": ["Coiffure", "Penteado"], "Shirt": ["T-shirt", "Camiseta"], "Pants": ["Pantalon", "Calça"], "Extra": ["Accessoire", "Acessório"], "Short": ["Courts", "Curto"], "Long": ["Longs", "Comprido"], "Ponytail": ["Queue de cheval", "Rabo de cavalo"], "Buns": ["Chignons", "Coques"], "None": ["Aucun", "Nenhum"], "Glasses": ["Lunettes", "Óculos"], "Bow": ["Nœud", "Laço"], "Cap": ["Casquette", "Boné"], "Surprise me": ["Surprends-moi", "Me surpreenda"], "Step 2": ["Étape 2", "Passo 2"], "Who's playing?": ["Qui joue ?", "Quem vai jogar?"], "Play alone": ["Jouer en solo", "Jogar solo"], "Keep playing ({room})": ["Continuer ({room})", "Continuar ({room})"], "or play as a team": ["ou joue en équipe", "ou jogue em equipe"], "Make a team": ["Créer une équipe", "Criar uma equipe"], "Join a friend's team": ["Rejoindre l'équipe d'un ami", "Entrar na equipe de um amigo"], "e.g. FROG-27": ["ex. FROG-27", "ex. FROG-27"], "Join": ["Rejoindre", "Entrar"], "Type the team name your friend sees, like FROG-27.": ["Écris le nom d'équipe que voit ton ami, comme FROG-27.", "Digite o nome da equipe que seu amigo vê, tipo FROG-27."], "Team play works when the game is open on claude.ai with friends it's shared with. You can still play alone here.": ["Le jeu en équipe marche quand le jeu est ouvert sur claude.ai et partagé avec tes amis. Ici, tu peux jouer en solo.", "Jogar em equipe funciona quando o jogo está aberto no claude.ai e compartilhado com seus amigos. Aqui você pode jogar solo."], "Looking for friends who are playing…": ["Recherche d'amis en train de jouer…", "Procurando amigos jogando…"], "Teams playing right now:": ["Équipes en train de jouer :", "Equipes jogando agora:"], "No teams playing right now. Make one and share the link with a friend!": ["Aucune équipe ne joue en ce moment. Crée-en une et partage le lien avec un ami !", "Nenhuma equipe jogando agora. Crie uma e mande o link para um amigo!"], "Tap the floor to walk. Tap things to look closer. Tap Marmalade the cat for a clue!": ["Touche le sol pour marcher. Touche les objets pour les voir de près. Touche Marmelade la chatte pour un indice !", "Toque no chão para andar. Toque nas coisas para ver de perto. Toque na gata Marmelada para ganhar uma pista!"], "Exit": ["Quitter", "Sair"], "Hint": ["Indice", "Dica"], "Backpack": ["Sac à dos", "Mochila"], "Empty for now. Things you find go here.": ["Vide pour l'instant. Ce que tu trouves arrive ici.", "Vazia por enquanto. O que você achar aparece aqui."], "Team": ["Équipe", "Equipe"], "Playing alone. Start a new game to make a team.": ["Tu joues en solo. Lance une nouvelle partie pour créer une équipe.", "Jogando solo. Comece um jogo novo para criar uma equipe."], "Team {code}": ["Équipe {code}", "Equipe {code}"], "(you)": ["(toi)", "(você)"], "Tell friends the team name {code} so they can join.": ["Donne le nom d'équipe {code} à tes amis pour qu'ils te rejoignent.", "Conte o nome da equipe {code} para seus amigos entrarem."], "Team play works on claude.ai.": ["Le jeu en équipe marche sur claude.ai.", "Jogar em equipe funciona no claude.ai."], "Connecting…": ["Connexion…", "Conectando…"], "You're on team <b>{code}</b>. Friends can join from the start screen, or by typing that name. Whatever anyone on your team solves, everyone gets!": ["Tu es dans l'équipe <b>{code}</b>. Tes amis peuvent la rejoindre depuis l'écran d'accueil ou en tapant ce nom. Tout ce qu'un membre de l'équipe résout compte pour tout le monde !", "Você está na equipe <b>{code}</b>. Seus amigos podem entrar pela tela inicial ou digitando esse nome. Tudo o que alguém da equipe resolver vale para todos!"], "Let's go!": ["C'est parti !", "Vamos lá!"], "This device couldn't start the 3D view. Try another browser.": ["Cet appareil n'a pas pu lancer la 3D. Essaie un autre navigateur.", "Este aparelho não conseguiu abrir o 3D. Tente outro navegador."], "You escaped!": ["Évasion réussie !", "Você escapou!"], "You never gave up, and that's what real detectives do!": ["Tu n'as jamais abandonné, et c'est ce que font les vrais détectives !", "Você nunca desistiu, e é isso que os detetives de verdade fazem!"], "Sharp thinking! You barely needed any help.": ["Bien réfléchi ! Tu n'as presque pas eu besoin d'aide.", "Que raciocínio! Você quase não precisou de ajuda."], "Wow! A master detective. Professor Marmalade is very impressed.": ["Waouh ! Un vrai pro de l'enquête. La professeure Marmelade est très impressionnée.", "Uau! Nível mestre de detetive. A Professora Marmelada ficou muito impressionada."], "Play again": ["Rejouer", "Jogar de novo"], "The 3D engine didn't load. Check your connection and reload the page.": ["Le moteur 3D n'a pas chargé. Vérifie ta connexion et recharge la page.", "O motor 3D não carregou. Confira sua conexão e recarregue a página."], "Professor Marmalade's house": ["La maison de la professeure Marmelade", "A casa da Professora Marmelada"], "Choose your language": ["Choisis ta langue", "Escolha seu idioma"], "Professor Marmalade is a very clever cat. She invited you to see her inventions, then the door clicked shut behind you! Tap the floor to walk. Tap anything that looks interesting. Psst: Marmalade also lost six golden fish somewhere in her house.": ["La professeure Marmelade est une chatte très maligne. Elle t'a montré ses inventions, puis clic ! la porte s'est fermée derrière toi. Touche le sol pour marcher. Touche tout ce qui a l'air intéressant. Psst : Marmelade a aussi perdu six poissons dorés quelque part dans sa maison.", "A Professora Marmelada é uma gata muito esperta. Ela te mostrou suas invenções e, clique! a porta se fechou atrás de você. Toque no chão para andar. Toque em tudo que parecer interessante. Psiu: a Marmelada também perdeu seis peixinhos dourados em algum lugar da casa."], "You found a golden fish! ({n} of 6)": ["Tu as trouvé un poisson doré ! ({n} sur 6)", "Você achou um peixinho dourado! ({n} de 6)"], "{who} found a golden fish! ({n} of 6)": ["{who} a trouvé un poisson doré ! ({n} sur 6)", "{who} achou um peixinho dourado! ({n} de 6)"], "Golden fish {n}/6": ["Poissons dorés {n}/6", "Peixinhos dourados {n}/6"], "Room {n} of 6": ["Salle {n} sur 6", "Sala {n} de 6"], "A 3D escape room · 6 rooms · play alone or with friends": ["Un escape game en 3D · 6 salles · en solo ou entre amis", "Um escape room em 3D · 6 salas · solo ou com amigos"], "Professor Marmalade is a very clever cat who invents all sorts of things. You came to visit, but the door locked behind you! Walk around her house, find clues, crack codes and open six locked rooms. Bring your friends and solve it together.": ["La professeure Marmelade est une chatte très maligne qui invente plein de choses. Pendant ta visite, la porte s'est fermée derrière toi ! Promène-toi dans sa maison, trouve des indices, déchiffre des codes et ouvre six salles fermées à clé. Invite tes amis pour jouer ensemble.", "A Professora Marmelada é uma gata muito esperta que inventa todo tipo de coisa. Durante a sua visita, a porta se trancou atrás de você! Ande pela casa, encontre pistas, decifre códigos e abra seis salas trancadas. Chame seus amigos para jogar junto."], "<b>Secret ending!</b> You found all 6 golden fish. Marmalade was so happy she made you a golden crown and threw a fish party. 👑🐟🎶": ["<b>Fin secrète !</b> Tu as trouvé les 6 poissons dorés. Marmelade était si contente qu'elle t'a fabriqué une couronne dorée et a organisé une fête des poissons. 👑🐟🎶", "<b>Final secreto!</b> Você achou os 6 peixinhos dourados. A Marmelada ficou tão feliz que fez uma coroa dourada para você e deu uma festa dos peixes. 👑🐟🎶"], "You found {n} of Marmalade's 6 golden fish. Play again to find them all and unlock the secret ending!": ["Tu as trouvé {n} des 6 poissons dorés de Marmelade. Rejoue pour tous les trouver et débloquer la fin secrète !", "Você achou {n} dos 6 peixinhos dourados da Marmelada. Jogue de novo para achar todos e liberar o final secreto!"], "You floated home in Marmalade's hot-air balloon. When she came back with her butterfly, she named you an Official Puzzle Detective.": ["Tu as survolé la ville dans la montgolfière de Marmelade jusqu'à chez toi. À son retour avec son papillon, elle t'a donné le titre de Détective Officiel des Énigmes.", "Você voou para casa no balão da Marmelada. Quando ela voltou com sua borboleta, te deu o título de Detetive Oficial de Enigmas."], "The whole team floated home in Marmalade's hot-air balloon. When she came back with her butterfly, she named everyone an Official Puzzle Detective.": ["Toute l'équipe a survolé la ville dans la montgolfière de Marmelade jusqu'à la maison. À son retour avec son papillon, elle a donné à chacun le titre de Détective Officiel des Énigmes.", "A equipe toda voou para casa no balão da Marmelada. Quando ela voltou com sua borboleta, deu a todos o título de Detetive Oficial de Enigmas."], "Oven mitt": ["Gant de cuisine", "Luva de cozinha"], "A thick, fluffy mitt. Perfect for hot things.": ["Un gros gant tout doux. Parfait pour les choses chaudes.", "Uma luva grossa e fofinha. Perfeita para coisas quentes."], "Fish cookies": ["Biscuits poisson", "Biscoitos de peixe"], "Warm cookies shaped like little fish. They smell amazing!": ["Des biscuits tout chauds en forme de petits poissons. Ils sentent trop bon !", "Biscoitos quentinhos em forma de peixinho. Que cheiro bom!"], "Winding key": ["Clé de remontage", "Chave de corda"], "A little key for winding up a music box.": ["Une petite clé pour remonter une boîte à musique.", "Uma chavinha para dar corda numa caixinha de música."], "Balloon fuel": ["Carburant du ballon", "Combustível do balão"], "A can of fuel for the hot-air balloon's burner.": ["Un bidon de carburant pour le brûleur de la montgolfière.", "Uma lata de combustível para o queimador do balão."], "Marmalade's Kitchen": ["La cuisine de Marmelade", "A cozinha da Marmelada"], "Down a slide and into the kitchen! Something smells like cookies. A big sleepy dog named Biscuit is snoring right in front of the pantry door.": ["Un toboggan, et te voilà dans la cuisine ! Ça sent les biscuits. Un gros chien endormi qui s'appelle Biscuit ronfle juste devant la porte du garde-manger.", "Um escorregador e pronto, você está na cozinha! Tem cheiro de biscoito. Um cachorrão sonolento chamado Biscoito está roncando bem na frente da porta da despensa."], "The Music Room": ["La salle de musique", "A sala de música"], "The pantry led to a dim room full of instruments. Everything is very quiet. Maybe music is the key?": ["Le garde-manger mène à une salle sombre pleine d'instruments. Tout est très calme. Et si la musique était la clé ?", "A despensa dá numa sala escura cheia de instrumentos. Está tudo muito quieto. Será que a música é a chave?"], "The Rooftop": ["Le toit", "O telhado"], "A secret staircase leads up to the roof. Marmalade's hot-air balloon is waiting! Get it ready to fly and you're free.": ["Un escalier secret mène au toit. La montgolfière de Marmelade t'attend ! Prépare-la pour décoller et tu seras libre.", "Uma escada secreta leva ao telhado. O balão da Marmelada está esperando! Prepare-o para voar e você estará livre."], "The star key clicks and the round door spins open!": ["La clé étoile fait clic et la porte ronde tourne pour s'ouvrir !", "A chave-estrela faz clique e a porta redonda gira e se abre!"], "Biscuit gobbles the cookies and rolls out of the way. The pantry door is free!": ["Biscuit avale les biscuits et roule sur le côté. La porte du garde-manger est libre !", "Biscoito devora os biscoitos e rola para o lado. A porta da despensa está livre!"], "The last note rings out and a bookshelf swings open like a door!": ["La dernière note résonne et une bibliothèque s'ouvre comme une porte !", "A última nota ecoa e uma estante se abre como uma porta!"], "Liftoff! The balloon floats up over the rooftops...": ["Décollage ! La montgolfière s'élève au-dessus des toits...", "Decolar! O balão sobe por cima dos telhados..."], "The cupboard lock shows a plate, a cup and a spoon. Look at the shelf on the wall.": ["Le cadenas du placard montre une assiette, une tasse et une cuillère. Regarde l'étagère au mur.", "O cadeado do armário mostra um prato, uma xícara e uma colher. Olhe a prateleira na parede."], "Count the plates, then the cups, then the spoons on the shelf.": ["Compte les assiettes, puis les tasses, puis les cuillères sur l'étagère.", "Conte os pratos, depois as xícaras, depois as colheres na prateleira."], "The cupboard code is 4 3 6.": ["Le code du placard est 4 3 6.", "O código do armário é 4 3 6."], "Read the note on the fridge. What time does the kitchen clock show?": ["Lis la note sur le frigo. Quelle heure indique l'horloge de la cuisine ?", "Leia o bilhete na geladeira. Que horas o relógio da cozinha mostra?"], "The short hand points between 4 and 5. The long hand points at the 6.": ["La petite aiguille est entre le 4 et le 5. La grande aiguille montre le 6.", "O ponteiro pequeno está entre o 4 e o 5. O ponteiro grande aponta para o 6."], "Set the oven to 4:30.": ["Règle le four sur 4:30.", "Ajuste o forno para 4:30."], "Biscuit loves cookies! Walk over to him.": ["Biscuit adore les biscuits ! Va le voir.", "Biscoito adora biscoitos! Vá até ele."], "The room is too dark. Find the light switches on the wall.": ["La pièce est trop sombre. Trouve les interrupteurs au mur.", "A sala está escura demais. Ache os interruptores na parede."], "Each switch changes two lamps. Try different switches until all four lamps are on.": ["Chaque interrupteur change deux lampes. Essaie jusqu'à ce que les quatre lampes soient allumées.", "Cada interruptor muda duas lâmpadas. Tente até as quatro lâmpadas ficarem acesas."], "From the start, press switch 2, then switch 3.": ["Au début, appuie sur l'interrupteur 2, puis sur le 3.", "No começo, aperte o interruptor 2 e depois o 3."], "Wind up the music box and listen to its song. Then play the same song on the piano.": ["Remonte la boîte à musique et écoute sa chanson. Puis joue la même chanson au piano.", "Dê corda na caixinha de música e ouça a música. Depois toque a mesma música no piano."], "The music box plays five colored notes. Copy the colors in the same order.": ["La boîte à musique joue cinq notes de couleur. Recopie les couleurs dans le même ordre.", "A caixinha toca cinco notas coloridas. Copie as cores na mesma ordem."], "Play yellow, orange, red, orange, yellow.": ["Joue jaune, orange, rouge, orange, jaune.", "Toque amarelo, laranja, vermelho, laranja, amarelo."], "The fuel tank lock needs a picture. Look at the map on the table.": ["Le cadenas du réservoir veut une image. Regarde la carte sur la table.", "O cadeado do tanque pede uma figura. Olhe o mapa na mesa."], "Start at the house. Move 2 squares up, then 3 squares right.": ["Pars de la maison. Monte de 2 cases, puis va de 3 cases à droite.", "Comece na casa. Suba 2 quadrados e depois vá 3 para a direita."], "Pick the rainbow.": ["Choisis l'arc-en-ciel.", "Escolha o arco-íris."], "The balloon basket needs exactly 10 kg of sandbags.": ["La nacelle a besoin d'exactement 10 kg de sacs de sable.", "O cesto do balão precisa de exatamente 10 kg de sacos de areia."], "Add up the numbers on the bags. Which ones make 10?": ["Additionne les nombres sur les sacs. Lesquels font 10 ?", "Some os números dos sacos. Quais dão 10?"], "Try the 3 kg bag and the 7 kg bag.": ["Essaie le sac de 3 kg et celui de 7 kg.", "Tente o saco de 3 kg e o de 7 kg."], "Everything is ready! Light the burner on the balloon.": ["Tout est prêt ! Allume le brûleur de la montgolfière.", "Está tudo pronto! Acenda o queimador do balão."], "Shelf": ["Étagère", "Prateleira"], "Cupboard": ["Placard", "Armário"], "Clock": ["Horloge", "Relógio"], "Fridge": ["Frigo", "Geladeira"], "Oven": ["Four", "Forno"], "Sleeping dog": ["Chien endormi", "Cachorro dormindo"], "Light switches": ["Interrupteurs", "Interruptores"], "Music box": ["Boîte à musique", "Caixinha de música"], "Piano": ["Piano", "Piano"], "Wardrobe": ["Armoire", "Guarda-roupa"], "Bookshelf": ["Bibliothèque", "Estante"], "Map table": ["Table de la carte", "Mesa do mapa"], "Fuel tank": ["Réservoir", "Tanque"], "Sandbags": ["Sacs de sable", "Sacos de areia"], "Hot-air balloon": ["Montgolfière", "Balão"], "The kitchen shelf": ["L'étagère de la cuisine", "A prateleira da cozinha"], "Marmalade's dishes, all lined up neatly.": ["La vaisselle de Marmelade, bien rangée.", "A louça da Marmelada, toda arrumadinha."], "The cupboard": ["Le placard", "O armário"], "Just pots and pans now.": ["Il ne reste que des casseroles.", "Agora só tem panelas."], "A lock with three wheels. Above them are pictures: 🍽️ ☕ 🥄": ["Un cadenas à trois roues. Au-dessus, des dessins : 🍽️ ☕ 🥄", "Um cadeado com três rodinhas. Em cima, desenhos: 🍽️ ☕ 🥄"], "The kitchen clock": ["L'horloge de la cuisine", "O relógio da cozinha"], "Tick, tock. What time is it?": ["Tic, tac. Quelle heure est-il ?", "Tique, taque. Que horas são?"], "The fridge": ["Le frigo", "A geladeira"], "Cookie recipe: bake at the time on the kitchen clock. Careful, the oven is HOT! Use a mitt.": ["Recette des biscuits : cuire à l'heure de l'horloge de la cuisine. Attention, le four est CHAUD ! Utilise un gant.", "Receita de biscoito: asse na hora do relógio da cozinha. Cuidado, o forno está QUENTE! Use uma luva."], "The oven": ["Le four", "O forno"], "The oven is cooling down. The cookies are in your backpack.": ["Le four refroidit. Les biscuits sont dans ton sac.", "O forno está esfriando. Os biscoitos estão na sua mochila."], "Ouch! The oven door is too hot to touch. You need something to protect your hand.": ["Aïe ! La porte du four est trop chaude. Il te faut quelque chose pour protéger ta main.", "Ai! A porta do forno está quente demais. Você precisa de algo para proteger a mão."], "Set the oven timer and press Bake.": ["Règle la minuterie du four et appuie sur Cuire.", "Ajuste o timer do forno e aperte Assar."], "Bake": ["Cuire", "Assar"], "Hmm, the cookies aren't ready at that time. Check the recipe!": ["Hum, les biscuits ne sont pas prêts à cette heure-là. Relis la recette !", "Hum, os biscoitos não ficam prontos nessa hora. Confira a receita!"], "Biscuit the dog": ["Biscuit le chien", "O cachorro Biscoito"], "Zzzz... Biscuit is snoring and won't budge. Maybe something yummy would wake him up?": ["Zzzz... Biscuit ronfle et ne bouge pas. Peut-être que quelque chose de bon le réveillerait ?", "Zzzz... Biscoito está roncando e não se mexe. Será que algo gostoso acorda ele?"], "All the lamps are on. With the lights on, you spotted a key on top of the wardrobe!": ["Toutes les lampes sont allumées. Avec la lumière, tu as repéré une clé sur l'armoire !", "Todas as lâmpadas estão acesas. Com a luz acesa, você viu uma chave em cima do guarda-roupa!"], "Three switches and four lamps. Can you turn on all the lamps?": ["Trois interrupteurs et quatre lampes. Arrives-tu à allumer toutes les lampes ?", "Três interruptores e quatro lâmpadas. Você consegue acender todas?"], "The wardrobe": ["L'armoire", "O guarda-roupa"], "A tall wardrobe full of fancy costumes: top hats, capes and a feather boa.": ["Une grande armoire pleine de beaux costumes : chapeaux haut-de-forme, capes et un boa à plumes.", "Um guarda-roupa alto cheio de fantasias chiques: cartolas, capas e um boá de penas."], "The music box": ["La boîte à musique", "A caixinha de música"], "A little music box with a keyhole on the side. It needs to be wound up.": ["Une petite boîte à musique avec un trou de serrure sur le côté. Il faut la remonter.", "Uma caixinha de música com um buraquinho de chave do lado. Precisa de corda."], "You wind it up and it plays a little song. Watch the colors!": ["Tu la remontes et elle joue une petite chanson. Regarde bien les couleurs !", "Você dá corda e ela toca uma musiquinha. Preste atenção nas cores!"], "Play it again": ["Rejouer la chanson", "Tocar de novo"], "The piano": ["Le piano", "O piano"], "Five colored keys. Play a song!": ["Cinq touches de couleur. Joue une chanson !", "Cinco teclas coloridas. Toque uma música!"], "Hmm, that's not the music box's song. Try again!": ["Hum, ce n'est pas la chanson de la boîte à musique. Réessaie !", "Hum, essa não é a música da caixinha. Tente de novo!"], "The bookshelf": ["La bibliothèque", "A estante"], "A tall bookshelf. One book sticks out a little, but it won't move. Maybe something else opens it.": ["Une grande bibliothèque. Un livre dépasse un peu, mais il ne bouge pas. Peut-être que quelque chose d'autre l'ouvre ?", "Uma estante alta. Um livro está um pouco para fora, mas não mexe. Talvez outra coisa abra a estante."], "Marmalade's map": ["La carte de Marmelade", "O mapa da Marmelada"], "Where should the balloon land? Start at the 🏠. Go <b>2 squares up</b>, then <b>3 squares right</b>.": ["Où la montgolfière doit-elle atterrir ? Pars de la 🏠. Monte de <b>2 cases</b>, puis va de <b>3 cases à droite</b>.", "Onde o balão deve pousar? Comece na 🏠. Suba <b>2 quadrados</b> e depois vá <b>3 quadrados para a direita</b>."], "The fuel tank": ["Le réservoir", "O tanque de combustível"], "The tank is empty now. The fuel is in your backpack.": ["Le réservoir est vide. Le carburant est dans ton sac.", "O tanque está vazio. O combustível está na sua mochila."], "The fuel tank has a picture lock. Which picture opens it?": ["Le réservoir a un cadenas à images. Quelle image l'ouvre ?", "O tanque tem um cadeado de figuras. Qual figura abre?"], "Clank! That's not the right picture.": ["Clonk ! Ce n'est pas la bonne image.", "Clanc! Essa não é a figura certa."], "The basket is loaded with exactly 10 kg. Perfect balance!": ["La nacelle a exactement 10 kg. Équilibre parfait !", "O cesto está com exatamente 10 kg. Equilíbrio perfeito!"], "The balloon basket needs exactly <b>10 kg</b> to fly straight. Tap bags to put them in the basket.": ["La nacelle a besoin d'exactement <b>10 kg</b> pour voler droit. Touche les sacs pour les mettre dans la nacelle.", "O cesto precisa de exatamente <b>10 kg</b> para voar reto. Toque nos sacos para colocá-los no cesto."], "In the basket: {n} kg": ["Dans la nacelle : {n} kg", "No cesto: {n} kg"], "Load the basket": ["Charger la nacelle", "Carregar o cesto"], "The balloon tips over! It needs exactly 10 kg.": ["La montgolfière penche ! Il faut exactement 10 kg.", "O balão tombou! Precisa de exatamente 10 kg."], "The burner needs fuel.": ["Le brûleur a besoin de carburant.", "O queimador precisa de combustível."], "The basket isn't balanced yet.": ["La nacelle n'est pas encore équilibrée.", "O cesto ainda não está equilibrado."], "The hot-air balloon": ["La montgolfière", "O balão"], "Everything is ready! Climb in and light the burner.": ["Tout est prêt ! Monte dedans et allume le brûleur.", "Está tudo pronto! Suba e acenda o queimador."], "Light the burner": ["Allumer le brûleur", "Acender o queimador"], "The gate opened onto a winding staircase. At the top is Marmalade's star tower, full of telescopes and machines. Can you open the round door?": ["Le portail s'ouvre sur un escalier en colimaçon. En haut se trouve la tour des étoiles de Marmelade, pleine de télescopes et de machines. Sauras-tu ouvrir la porte ronde ?", "O portão dá numa escada em caracol. Lá em cima fica a torre das estrelas da Marmelada, cheia de telescópios e máquinas. Você consegue abrir a porta redonda?"], "Team play isn't available right now. You can still play alone.": ["Le jeu en équipe n'est pas disponible pour l'instant. Tu peux quand même jouer en solo.", "Jogar em equipe não está disponível agora. Você ainda pode jogar solo."], "Make a team, then tell your friends the team name so they can join.": ["Crée une équipe, puis donne le nom d'équipe à tes amis pour qu'ils te rejoignent.", "Crie uma equipe e conte o nome dela para seus amigos entrarem."], "\"Eee-eee! In swimming, a smaller time means a faster swimmer. Who touched the wall first?\"": ["« Iii-iii ! En natation, un temps plus petit veut dire un nageur plus rapide. Qui a touché le mur en premier ? »", "“Iii-iii! Na natação, um tempo menor quer dizer um nadador mais rápido. Quem tocou a parede primeiro?”"], "\"Hi, I'm Coach Pip! Skaters draw shapes on the ice with their blades. Can you count the sides?\"": ["« Salut, je suis Coach Pip ! Les patineurs dessinent des formes sur la glace avec leurs lames. Sauras-tu compter les côtés ? »", "“Oi, eu sou o Treinador Pip! Os patinadores desenham formas no gelo com as lâminas. Você consegue contar os lados?”"], "\"Mrrrow! Expert detectives solve it on their own. You can do it! (The Hint button still works.)\"": ["« Miaaou ! Les détectives experts trouvent tout seuls. Tu peux y arriver ! (Le bouton Indice marche toujours.) »", "“Miaau! Detetives experts resolvem sozinhos. Você consegue! (O botão Dica ainda funciona.)”"], "\"Welcome! In karate, every belt color is a step on your journey. Patience and practice!\"": ["« Bienvenue ! Au karaté, chaque couleur de ceinture est une étape de ton voyage. Patience et entraînement ! »", "“Bem-vindo! No caratê, cada cor de faixa é um passo da sua jornada. Paciência e treino!”"], "7 laps a day for 8 days is 7 × 8. Then add the bonus laps.": ["7 tours par jour pendant 8 jours, c'est 7 × 8. Ensuite, ajoute les tours bonus.", "7 voltas por dia durante 8 dias é 7 × 8. Depois some as voltas extras."], "A big indoor pool sparkles in front of you. Coach Delphine the dolphin timed four swimmers. The way out is an underwater tunnel!": ["Une grande piscine brille devant toi. Coach Delphine la dauphine a chronométré quatre nageurs. La sortie est un tunnel sous l'eau !", "Uma piscina enorme brilha na sua frente. A Treinadora Delfina, a golfinha, cronometrou quatro nadadores. A saída é um túnel debaixo d'água!"], "A gold medal that is also a key!": ["Une médaille d'or qui est aussi une clé !", "Uma medalha de ouro que também é uma chave!"], "A gym full of mats, rings and a balance beam. Coach Momo the monkey loves flips, mirrors and numbers.": ["Une salle de gym pleine de tapis, d'anneaux et une poutre. Coach Momo le singe adore les saltos, les miroirs et les nombres.", "Um ginásio cheio de colchonetes, argolas e uma trave. O Treinador Momo, o macaco, adora cambalhotas, espelhos e números."], "A locker full of skates, with a lock of <b>2 numbers</b>.": ["Un casier plein de patins, avec un cadenas à <b>2 chiffres</b>.", "Um armário cheio de patins, com um cadeado de <b>2 números</b>."], "A locker with a lock of <b>4 numbers</b>.": ["Un casier avec un cadenas à <b>4 chiffres</b>.", "Um armário com um cadeado de <b>4 números</b>."], "A pentagon has 5 sides, an octagon has 8 and a heptagon has 7.": ["Un pentagone a 5 côtés, un octogone en a 8 et un heptagone en a 7.", "Um pentágono tem 5 lados, um octógono tem 8 e um heptágono tem 7."], "A piano has 88 keys: 52 white ones and 36 black ones.": ["Un piano a 88 touches : 52 blanches et 36 noires.", "Um piano tem 88 teclas: 52 brancas e 36 pretas."], "A small key with a panda on it.": ["Une petite clé avec un panda dessus.", "Uma chavinha com um panda desenhado."], "A stack of boards with a lock. Written on top:": ["Une pile de planches avec un cadenas. Écrit dessus :", "Uma pilha de tábuas com um cadeado. Escrito em cima:"], "A triangle has 3 sides, a hexagon has 6 and a square has 4.": ["Un triangle a 3 côtés, un hexagone en a 6 et un carré en a 4.", "Um triângulo tem 3 lados, um hexágono tem 6 e um quadrado tem 4."], "A tunnel at the bottom of the pool. It's too blurry to swim through without goggles!": ["Un tunnel au fond de la piscine. C'est trop flou pour nager dedans sans lunettes !", "Um túnel no fundo da piscina. Está embaçado demais para nadar sem óculos!"], "Add the three scores together. That's the door code!": ["Additionne les trois notes. C'est le code de la porte !", "Some as três notas. É o código da porta!"], "Add the two numbers together.": ["Additionne les deux nombres.", "Some os dois números."], "Adding": ["Additions", "Adição"], "Adding scores": ["Additionner des notes", "Somar notas"], "Adding weights": ["Additionner des poids", "Somar pesos"], "Ages 11 and up: harder math and memory": ["11 ans et plus : maths et mémoire plus difficiles", "11 anos ou mais: matemática e memória mais difíceis"], "Ages 6 to 10": ["De 6 à 10 ans", "De 6 a 10 anos"], "Back": ["Retour", "Voltar"], "Balance beam": ["Poutre", "Trave de equilíbrio"], "Balance on one foot and count to 10!": ["Tiens-toi sur un pied et compte jusqu'à 10 !", "Fique num pé só e conte até 10!"], "Bees carry pollen from flower to flower, which helps new flowers grow.": ["Les abeilles transportent le pollen de fleur en fleur, ce qui aide de nouvelles fleurs à pousser.", "As abelhas levam pólen de flor em flor, e isso ajuda novas flores a crescer."], "Belt chart": ["Tableau des ceintures", "Quadro de faixas"], "Belt rack": ["Porte-ceintures", "Cabide de faixas"], "Between rooms, the coaches suggest a quick movement break, like jumping jacks or balancing on one foot.": ["Entre les salles, les coachs proposent une petite pause pour bouger, comme des sauts ou tenir en équilibre sur un pied.", "Entre as salas, os treinadores sugerem uma pausa rápida para se mexer, como polichinelos ou equilíbrio num pé só."], "Blue comes after green.": ["Le bleu vient après le vert.", "A azul vem depois da verde."], "Boards": ["Planches", "Tábuas"], "Boy": ["Garçon", "Menino"], "Brown comes right before black.": ["Le marron vient juste avant le noir.", "A marrom vem logo antes da preta."], "Character": ["Personnage", "Personagem"], "Coach Delphine": ["Coach Delphine", "Treinadora Delfina"], "Coach Delphine timed four swimmers. The fastest swimmer has the smallest time.": ["Coach Delphine a chronométré quatre nageurs. Le plus rapide a le plus petit temps.", "A Treinadora Delfina cronometrou quatro nadadores. O mais rápido tem o menor tempo."], "Coach Momo the monkey made this shape on the beam. Which picture shows it in a mirror?": ["Coach Momo le singe a fait cette forme sur la poutre. Quelle image la montre dans un miroir ?", "O Treinador Momo fez esta forma na trave. Qual figura mostra ela no espelho?"], "Coach Pip": ["Coach Pip", "Treinador Pip"], "Coach Pip's training poster": ["L'affiche d'entraînement de Coach Pip", "O cartaz de treino do Treinador Pip"], "Coach's move break:": ["Pause sportive du coach :", "Pausa do treinador:"], "Colors in order": ["Les couleurs dans l'ordre", "Cores em ordem"], "Compare carefully: 30.9 is smaller than 31.06.": ["Compare bien : 30,9 est plus petit que 31,06.", "Compare com cuidado: 30,9 é menor que 31,06."], "Comparing numbers": ["Comparer des nombres", "Comparar números"], "Count the sides of each shape, in order. That's the gate code!": ["Compte les côtés de chaque forme, dans l'ordre. C'est le code du portail !", "Conte os lados de cada forma, em ordem. É o código do portão!"], "Counting": ["Compter", "Contagem"], "Counting in Japanese": ["Compter en japonais", "Contar em japonês"], "Counting scroll": ["Parchemin pour compter", "Pergaminho d r les 6 à 10 ans. Le niveau Expert a des maths plus difficiles, des nombres décimaux et des jeux de mémoire plus longs, pour les 11 ans et plus.", "O nível Júnior é para 6 a 10 anos. O nível Expert tem matemática mais difícil, decimais e desafios de memória mais longos, para 11 anos ou mais."], "Just a towel and sunscreen now.": ["Il ne reste qu'une serviette et de la crème solaire.", "Agora só tem uma toalha e protetor solar."], "Karate comes from Okinawa, in Japan. The word means \"empty hand\".": ["Le karaté vient d'Okinawa, au Japon. Le mot veut dire « main vide ».", "O caratê vem de Okinawa, no Japão. A palavra quer dizer “mão vazia”."], "Karate kick move": ["Coup de pied de karaté", "Chute de caratê"], "Lane": ["Couloir", "Raia"], "Logic": ["Logique", "Lógica"], "Look at Momo's shape on the balance beam. Which picture is its mirror image?": ["Regarde la forme de Momo sur la poutre. Quelle image est son reflet dans un miroir ?", "Olhe a forma do Momo na trave. Qual figura é o reflexo no espelho?"], "Look at the race results. The smallest time is the fastest swimmer.": ["Regarde les résultats de la course. Le plus petit temps est celui du nageur le plus rapide.", "Olhe os resultados da corrida. O menor tempo é do nadador mais rápido."], "Make up a 4-move dance!": ["Invente une danse de 4 pas !", "Invente uma dança de 4 passos!"], "Maps and directions": ["Cartes et directions", "Mapas e direções"], "Marmalade shows a dance in the mirror. Watch, then copy the moves in the same order!": ["Marmelade montre une danse dans le miroir. Regarde, puis refais les pas dans le même ordre !", "A Marmelada mostra uma dança no espelho. Olhe e depois repita os passos na mesma ordem!"], "Memory": ["Mémoire", "Memória"], "Mixing yellow and blue paint makes green. Mixing red and yellow makes orange!": ["En mélangeant du jaune et du bleu, on obtient du vert. Le rouge et le jaune donnent de l'orange !", "Misturando tinta amarela e azul dá verde. Vermelho com amarelo dá laranja!"], "Momo does a triple flip and the door swings open. Music is playing next door!": ["Momo fait un triple salto et la porte s'ouvre. On entend de la musique à côté !", "O Momo dá um salto triplo e a porta se abre. Tem música tocando na sala ao lado!"], "Momo gave you the gym key. Great eye for mirrors!": ["Momo t'a donné la clé du gymnase. Quel œil pour les miroirs !", "O Momo te deu a chave do ginásio. Que olho bom para espelhos!"], "Monkey Gym": ["Gymnase des singes", "Ginásio dos macacos"], "Multiplying": ["Multiplications", "Multiplicação"], "Music": ["Musique", "Música"], "Music memory": ["Mémoire musicale", "Memória musical"], "New prize: {prize}!": ["Nouveau prix : {prize} !", "Novo prêmio: {prize}!"], "Next prize at {n} ⭐: {prize}": ["Prochain prix à {n} ⭐ : {prize}", "Próximo prêmio com {n} ⭐: {prize}"], "Not quite! In a mirror, left and right swap.": ["Presque ! Dans un miroir, la gauche et la droite s'échangent.", "Quase! No espelho, esquerda e direita trocam."], "Not that one yet! Check the belt chart.": ["Pas encore celle-là ! Regarde le tableau des ceintures.", "Essa ainda não! Olhe o quadro de faixas."], "Oops, wrong move! Watch again and try once more.": ["Oups, mauvais pas ! Regarde encore et réessaie.", "Ops, passo errado! Olhe de novo e tente outra vez."], "Orange comes between yellow and green.": ["L'orange vient entre le jaune et le vert.", "A laranja vem entre a amarela e a verde."], "Orange comes between yellow and green. Blue comes after green.": ["L'orange vient entre le jaune et le vert. Le bleu vient après le vert.", "A laranja vem entre a amarela e a verde. A azul vem depois da verde."], "Panda Dojo": ["Dojo du panda", "Dojo do panda"], "Part of the chart is torn! Sensei Bao left clues:": ["Une partie du tableau est déchirée ! Sensei Bao a laissé des indices :", "Parte do quadro está rasgada! O Sensei Bao deixou pistas:"], "Penguin Ice Rink": ["Patinoire des pingouins", "Rinque dos pinguins"], "Penguins can't fly, but they slide across the ice ovo” quantas vezes precisar."], "Press play and count the claps!": ["Appuie sur lecture et compte les applaudissements !", "Aperte o play e conte as palmas!"], "Press play on the speaker and count the claps.": ["Appuie sur lecture sur l'enceinte et compte les applaudissements.", "Aperte o play na caixa de som e conte as palmas."], "Privacy: there are no ads, no accounts and no chat. Progress is saved only on this device. In team play, teammates see only the name and character each player chooses.": ["Confidentialité : pas de publicité, pas de compte et pas de chat. La progression est enregistrée seulement sur cet appareil. En équipe, les coéquipiers voient seulement le prénom et le personnage choisis par chaque joueur.", "Privacidade: não há anúncios, contas nem chat. O progresso fica salvo só neste aparelho. No jogo em equipe, os colegas veem apenas o nome e o personagem que cada um escolhe."], "Prizes": ["Prix", "Prêmios"], "Put the lanes in order from fastest to slowest.": ["Range les couloirs du plus rapide au plus lent.", "Coloque as raias em ordem, da mais rápida à mais lenta."], "Race results": ["Résultats de la course", "Resultados da corrida"], "Read the judges' rule: drop the lowest score.": ["Lis la règle des juges : enlève la plus petite note.", "Leia a regra dos juízes: tire a nota mais baixa."], "Read the poster about Coach Pip's laps.": ["Lis l'affiche sur les tours de Coach Pip.", "Leia o cartaz sobre as voltas do Treinador Pip."], "Reading clues": ["Lire des indices", "Ler pistas"], "Rhythm": ["Rythme", "Ritmo"], "Riddles": ["Devinettes", "Charadas"], "Rink gate": ["Portail de la patinoire", "Portão do rinque"], "Room {n} escaped!": ["Salle {n} réussie !", "Sala {n} concluída!"], "Rule: drop the lowest score, then add the other two. Type the answer without the decimal point.": ["Règle : enlève la plus petite note, puis additionne les deux autres. Écris la réponse sans la virgule.", "Regra: tire a nota mais baixa e some as outras duas. Digite a respo
