r code is 1 9 3.": ["Le code de la porte est 1 9 3.", "O código da porta é 1 9 3."], "The door code is 2 7.": ["Le code de la porte est 2 7.", "O código da porta é 2 7."], "The door has a keyhole AND a number lock. First you need the key.": ["La porte a une serrure ET un cadenas à chiffres. D'abord, il te faut la clé.", "A porta tem uma fechadura E um cadeado de números. Primeiro você precisa da chave."], "The door will open when you pass Sensei Bao's belt test.": ["La porte s'ouvrira quand tu réussiras le test des ceintures de Sensei Bao.", "A porta vai abrir quando você passar no teste de faixas do Sensei Bao."], "The first hot-air balloon passengers, in 1783, were a sheep, a duck and a rooster!": ["Les premiers passagers d'une montgolfière, en 1783, étaient un mouton, un canard et un coq !", "Os primeiros passageiros de um balão, em 1783, foram uma ovelha, um pato e um galo!"], "The gate code is 3 6 4.": ["Le code du portail est 3 6 4.", "O código do portão é 3 6 4."], "The gate code is 5 8 7.": ["Le code du portail est 5 8 7.", "O código do portão é 5 8 7."], "The gym door": ["La porte du gymnase", "A porta do ginásio"], "The judges gave Momo three scores. Add them up!": ["Les juges ont donné trois notes à Momo. Additionne-les !", "Os juízes deram três notas ao Momo. Some todas!"], "The judges' table": ["La table des juges", "A mesa dos juízes"], "The key turns! Now the number lock wants <b>{n} numbers</b>: the judges' answer.": ["La clé tourne ! Maintenant, le cadenas veut <b>{n} chiffres</b> : la réponse des juges.", "A chave gira! Agora o cadeado pede <b>{n} números</b>: a resposta dos juízes."], "The last room! Mirrors, lights and a disco ball. All the coaches are here for the big show. Dance your way out!": ["La dernière salle ! Des miroirs, des lumières et une boule disco. Tous les coachs sont là pour le grand spectacle. Sors en dansant !", "A última sala! Espelhos, luzes e um globo de discoteca. Todos os treinadores estão aqui para o grande show. Saia dançando!"], "The lights are off. You need the disco remote.": ["Les lumières sont éteintes. Il te faut la télécommande disco.", "As luzes estão apagadas. Você precisa do controle da disco."], "The locker code is 2 4 1 3.": ["Le code du casier est 2 4 1 3.", "O código do armário é 2 4 1 3."], "The locker code is 3 2 4 1.": ["Le code du casier est 3 2 4 1.", "O código do armário é 3 2 4 1."], "The locker code is the lane numbers, from fastest to slowest.": ["Le code du casier, ce sont les numéros des couloirs, du plus rapide au plus lent.", "O código do armário são os números das raias, da mais rápida à mais lenta."], "The pool locker": ["Le casier de la piscine", "O armário da piscina"], "The rink gate": ["Le portail de la patinoire", "O portão do rinque"], "The scoreboard": ["Le tableau des scores", "O placar"], "The scoreboard shows the shapes Pip skated. Count the sides of each one.": ["Le tableau montre les formes que Pip a patinées. Compte les côtés de chacune.", "O placar mostra as formas que o Pip patinou. Conte os lados de cada uma."], "The scroll on the wall shows how to count in Japanese.": ["Le parchemin au mur montre comment compter en japonais.", "O pergaminho na parede mostra como contar em japonês."], "The skate locker": ["Le casier à patins", "O armário dos patins"], "The skate locker code is 1 2.": ["Le code du casier à patins est 1 2.", "O código do armário dos patins é 1 2."], "The skate locker code is 6 0.": ["Le code du casier à patins est 6 0.", "O código do armário dos patins é 6 0."], "The sliding door": ["La porte coulissante", "A porta de correr"], "The speaker": ["L'enceinte", "A caixa de som"], "The speaker gave you the disco remote!": ["L'enceinte t'a donné la télécommande disco !", "A caixa de som te deu o controle da disco!"], "The stage": ["La scène", "O palco"], "The underwater tunnel": ["Le tunnel sous l'eau", "O túnel debaixo d'água"], "The whole team danced in the big show with all the coaches! Professor Marmalade named everyone an Official Puzzle Detective.": ["Toute l'équipe a dansé dans le grand spectacle avec tous les coachs ! La professeure Marmelade a donné à chacun le titre de Détective Officiel des Énigmes.", "A equipe toda dançou no grande show com todos os treinadores! A Professora Marmelada deu a todos o título de Detetive Oficial de Enigmas."], "There are 6 claps.": ["Il y a 6 applaudissements.", "São 6 palmas."], "Three judges scored Momo's routine:": ["Trois juges ont noté l'enchaînement de Momo :", "Três juízes deram nota à apresentação do Momo:"], "Time": ["Temps", "Tempo"], "Today Coach Pip skated these shapes on the ice:": ["Aujourd'hui, Coach Pip a dessiné ces formes sur la glace :", "Hoje o Treinador Pip desenhou estas formas no gelo:"], "Touch your toes, then reach for the sky!": ["Touche tes orteils, puis tends les bras vers le ciel !", "Toque nos pés e depois estique os braços para o céu!"], "Underwater tunnel": ["Tunnel sous l'eau", "Túnel debaixo d'água"], "Use the dojo key on the belt rack. Read Sensei Bao's clues on the chart.": ["Utilise la clé du dojo sur le porte-ceintures. Lis les indices de Sensei Bao sur le tableau.", "Use a chave do dojo no cabide de faixas. Leia as pistas do Sensei Bao no quadro."], "Use the dojo key on the belt rack. The chart shows the belt order.": ["Utilise la clé du dojo sur le porte-ceintures. Le tableau montre l'ordre des ceintures.", "Use a chave do dojo no cabide de faixas. O quadro mostra a ordem das faixas."], "Vibration": ["Vibration", "Vibração"], "Watch Marmalade's dance in the mirror, then copy the moves in the same order.": ["Regarde la danse de Marmelade dans le miroir, puis refais les pas dans le même ordre.", "Olhe a dança da Marmelada no espelho e repita os passos na mesma ordem."], "Watch the hand light up while you count.": ["Regarde la main s'allumer pendant que tu comptes.", "Olhe a mãozinha acender enquanto conta."], "Welcome to Marmalade's Animal Sports Camp! First stop: an ice rink. Coach Pip the penguin is skating in circles.": ["Bienvenue au Camp sportif des animaux de Marmelade ! Premier arrêt : une patinoire. Coach Pip le pingouin patine en rond.", "Bem-vindo ao Acampamento Esportivo dos Bichos da Marmelada! Primeira parada: um rinque de gelo. O Treinador Pip, o pinguim, está patinando em círculos."], "White is first and black is last.": ["Le blanc est en premier et le noir en dernier.", "A branca é a primeira e a preta é a última."], "White, yellow, green, brown, black.": ["Blanc, jaune, vert, marron, noir.", "Branca, amarela, verde, marrom, preta."], "White, yellow, orange, green, blue, brown, black.": ["Blanc, jaune, orange, vert, bleu, marron, noir.", "Branca, amarela, laranja, verde, azul, marrom, preta."], "Who are you?": ["Qui es-tu ?", "Quem é você?"], "Whoa! The ice is too slippery to reach the gate. You need skates.": ["Oups ! La glace est trop glissante pour arriver au portail. Il te faut des patins.", "Opa! O gelo está escorregadio demais para chegar ao portão. Você precisa de patins."], "Work out each part: ni + san, then go, then shi − ichi.": ["Calcule chaque partie : ni + san, puis go, puis shi − ichi.", "Calcule cada parte: ni + san, depois go, depois shi − ichi."], "World 1: Marmalade's House": ["Monde 1 : la maison de Marmelade", "Mundo 1: a casa da Marmelada"], "World 2: Animal Sports Camp": ["Monde 2 : le camp sportif des animaux", "Mundo 2: o acampamento esportivo dos bichos"], "World {w}": ["Monde {w}", "Mundo {w}"], "Yellow comes right after white.": ["Le jaune vient juste après le blanc.", "A amarela vem logo depois da branca."], "You danced in the big show with all the coaches! Professor Marmalade named you an Official Puzzle Detective.": ["Tu as dansé dans le grand spectacle avec tous les coachs ! La professeure Marmelade t'a donné le titre de Détective Officiel des Énigmes.", "Você dançou no grande show com todos os treinadores! A Professora Marmelada te deu o título de Detetive Oficial de Enigmas."], "You glide over on your skates. The gate has a lock with <b>3 numbers</b>.": ["Tu glisses jusque-là sur tes patins. Le portail a un cadenas à <b>3 chiffres</b>.", "Você desliza até lá de patins. O portão tem um cadeado de <b>3 números</b>."], "You glide through the gate on your skates. Next stop: the pool!": ["Tu passes le portail en patinant. Prochain arrêt : la piscine !", "Você passa pelo portão patinando. Próxima parada: a piscina!"], "You have the goggles! Swim into the tunnel at the end of the pool.": ["Tu as les lunettes ! Nage dans le tunnel au bout de la piscine.", "Você tem os óculos! Nade até o túnel no fim da piscina."], "You have the remote and the dance! Go to the stage.": ["Tu as la télécommande et la danse ! Va sur la scène.", "Você tem o controle e a dança! Vá para o palco."], "You have {n} ⭐": ["Tu as {n} ⭐", "Você tem {n} ⭐"], "You nailed the dance! Now go to the stage.": ["Tu as réussi la danse ! Maintenant, va sur la scène.", "Você arrasou na dança! Agora vá para o palco."], "You need to learn the dance first. Try the mirror!": ["Tu dois d'abord apprendre la danse. Essaie le miroir !", "Primeiro você precisa aprender a dança. Tente o espelho!"], "You pop up in a quiet karate dojo. Sensei Bao the panda bows to you. Can you pass the belt test?": ["Tu sors de l'eau dans un dojo de karaté tout calme. Sensei Bao le panda te salue. Réussiras-tu le test des ceintures ?", "Você sai num dojo de caratê bem tranquilo. O Sensei Bao, o panda, faz uma reverência. Você consegue passar no teste de faixas?"], "You practiced:": ["Tu as travaillé :", "Você praticou:"], "You swim through the tunnel and climb out, dripping wet!": ["Tu nages dans le tunnel et tu sors tout mouillé !", "Você nada pelo túnel e sai todo molhado!"], "⭐ for escaping · ⭐ for using 1 hint or fewer · ⭐ for finding the golden fish": ["⭐ pour t'échapper · ⭐ pour 1 indice ou moins · ⭐ pour trouver le poisson doré", "⭐ por escapar · ⭐ por usar 1 dica ou menos · ⭐ por achar o peixinho dourado"], "Start": ["Commencer", "Começar"], "Keep playing": ["Continuer", "Continuar"], "Close": ["Fermer", "Fechar"], "You unlocked every prize!": ["Tu as débloqué tous les prix !", "Você liberou todos os prêmios!"], "Golden fish": ["Poissons dorés", "Peixinhos dourados"], "Psst! A golden fish is hiding in this room. Look behind and under things!": ["Psst ! Un poisson doré se cache dans cette salle. Regarde derrière et sous les objets !", "Psiu! Tem um peixinho dourado escondido nesta sala. Olhe atrás e embaixo das coisas!"], "Marmalade lost a golden fish in every room. Look near the walls and corners, behind and under things. When you see one shining, tap it and your detective will grab it!": ["Marmelade a perdu un poisson doré dans chaque salle. Regarde près des murs et dans les coins, derrière et sous les objets. Quand tu en vois un qui brille, touche-le et ton détective l'attrapera !", "A Marmelada perdeu um peixinho dourado em cada sala. Procure perto das paredes e nos cantos, atrás e embaixo das coisas. Quando vir um brilhando, toque nele e seu detetive vai pegá-lo!"], "You already found the fish in this room!": ["Tu as déjà trouvé le poisson de cette salle !", "Você já achou o peixinho desta sala!"], "The fish in this room is still hiding.": ["Le poisson de cette salle se cache encore.", "O peixinho desta sala ainda está escondido."], "Clap": ["Taper", "Palma"], "Spin": ["Tourner", "Girar"], "Jump": ["Sauter", "Pular"], "Wave": ["Saluer", "Acenar"], "Watch!": ["Regarde !", "Olhe!"], "Your turn!": ["À toi !", "Sua vez!"], "Move {n} of {m}": ["Pas {n} sur {m}", "Passo {n} de {m}"], "You found a golden fish! ({n} of {t})": ["Tu as trouvé un poisson doré ! ({n} sur {t})", "Você achou um peixinho dourado! ({n} de {t})"], "{who} found a golden fish! ({n} of {t})": ["{who} a trouvé un poisson doré ! ({n} sur {t})", "{who} achou um peixinho dourado! ({n} de {t})"], "Golden fish {n}/{t}": ["Poissons dorés {n}/{t}", "Peixinhos dourados {n}/{t}"], "Room {n} of {t}": ["Salle {n} sur {t}", "Sala {n} de {t}"], "<b>Secret ending!</b> You found all {t} golden fish. Marmalade was so happy she made you a golden crown and threw a fish party. 👑🐟🎶": ["<b>Fin secrète !</b> Tu as trouvé les {t} poissons dorés. Marmelade était si contente qu'elle t'a fabriqué une couronne dorée et a organisé une fête des poissons. 👑🐟🎶", "<b>Final secreto!</b> Você achou os {t} peixinhos dourados. A Marmelada ficou tão feliz que fez uma coroa dourada para você e deu uma festa dos peixes. 👑🐟🎶"], "You found {n} of Marmalade's {t} golden fish. Play again to find them all and unlock the secret ending!": ["Tu as trouvé {n} des {t} poissons dorés de Marmelade. Rejoue pour tous les trouver et débloquer la fin secrète !", "Você achou {n} dos {t} peixinhos dourados da Marmelada. Jogue de novo para achar todos e liberar o final secreto!"], "Each fish gives you a star, and finding all {t} unlocks a secret ending.": ["Chaque poisson te donne une étoile, et les trouver tous les {t} débloque une fin secrète.", "Cada peixinho vale uma estrela, e achar todos os {t} libera um final secreto."], "A 3D escape adventure · {t} rooms · play alone or with friends": ["Une aventure d'évasion en 3D · {t} salles · en solo ou entre amis", "Uma aventura de fuga em 3D · {t} salas · solo ou com amigos"], "Professor Marmalade is a very clever cat who invents all sorts of things. You came to visit, but the door locked behind you! Walk around her house, find clues, crack codes and open {t} locked rooms in four worlds. Bring your friends and solve it together.": ["La professeure Marmelade est une chatte très maligne qui invente plein de choses. Pendant ta visite, la porte s'est fermée derrière toi ! Promène-toi dans sa maison, trouve des indices, déchiffre des codes et ouvre {t} salles fermées à clé dans quatre mondes. Invite tes amis pour jouer ensemble.", "A Professora Marmelada é uma gata muito esperta que inventa todo tipo de coisa. Durante a sua visita, a porta se trancou atrás de você! Ande pela casa, encontre pistas, decifre códigos e abra {t} salas trancadas em quatro mundos. Chame seus amigos para jogar junto."], "\"Eight arms, great memory! The trident key is yours.\"": ["« Huit bras, et une super mémoire ! La clé trident est à toi. »", "“Oito braços e uma memória incrível! A chave-tridente é sua.”"], "\"Grrumph! I'm hungry. Every day I eat half of 10 melons. That number opens the fruit basket!\"": ["« Grrumph ! J'ai faim. Chaque jour, je mange la moitié de 10 melons. Ce nombre ouvre le panier de fruits ! »", "“Grrumf! Estou com fome. Todo dia eu como metade de 10 melões. Esse número abre o cesto de frutas!”"], "\"Grrumph! I'm hungry. Every day I eat three quarters of 12 melons. That number opens the fruit basket!\"": ["« Grrumph ! J'ai faim. Chaque jour, je mange les trois quarts de 12 melons. Ce nombre ouvre le panier de fruits ! »", "“Grrumf! Estou com fome. Todo dia eu como três quartos de 12 melões. Esse número abre o cesto de frutas!”"], "\"Hello! I found that bottle floating by. Messages in bottles are often written in a secret code!\"": ["« Bonjour ! J'ai trouvé cette bouteille qui flottait. Les messages dans les bouteilles sont souvent écrits en code secret ! »", "“Olá! Achei essa garrafa boiando. Mensagens em garrafas costumam ser escritas em código secreto!”"], "\"Let's play a memory game! Watch the pictures, then copy them in the same order.\"": ["« Jouons à un jeu de mémoire ! Regarde les images, puis refais-les dans le même ordre. »", "“Vamos jogar um jogo da memória! Olhe as figuras e depois repita na mesma ordem.”"], "\"Patterns are everywhere in the jungle: stripes, spots and songs! Look for what repeats.\"": ["« Il y a des motifs partout dans la jungle : rayures, taches et chansons ! Cherche ce qui se répète. »", "“Tem padrões em todo lugar na selva: listras, pintas e cantos! Procure o que se repete.”"], "\"Squawk! Animals walked through the mud by the gate. Count all their legs! Squawk!\"": ["« Croâ ! Des animaux ont marché dans la boue près du portail. Compte toutes leurs pattes ! Croâ ! »", "“Cuá! Uns bichos andaram na lama perto do portão. Conte todas as patas! Cuá!”"], "3 × 4 is the same as 4 + 4 + 4.": ["3 × 4, c'est pareil que 4 + 4 + 4.", "3 × 4 é o mesmo que 4 + 4 + 4."], "4 + 2 + 8 + 6 + 4 = 24. The gate code is 2 4.": ["4 + 2 + 8 + 6 + 4 = 24. Le code du portail est 2 4.", "4 + 2 + 8 + 6 + 4 = 24. O código do portão é 2 4."], "4 starfish with 5 arms each: 5 + 5 + 5 + 5.": ["4 étoiles de mer avec 5 bras chacune : 5 + 5 + 5 + 5.", "4 estrelas-do-mar com 5 braços cada: 5 + 5 + 5 + 5."], "6 × 5 = 30, plus 8.": ["6 × 5 = 30, plus 8.", "6 × 5 = 30, mais 8."], "A big bag of peanuts. Elephants love them!": ["Un gros sac de cacahuètes. Les éléphants adorent ça !", "Um saco grande de amendoim. Elefantes adoram!"], "A bucket of water, good for softening mud.": ["Un seau d'eau, parfait pour ramollir la boue.", "Um balde de água, ótimo para amolecer a lama."], "A fruit basket with a lock of <b>1 number</b>. Ask Hoppy how many melons he eats!": ["Un panier de fruits avec un cadenas à <b>1 chiffre</b>. Demande à Hoppy combien de melons il mange !", "Um cesto de frutas com um cadeado de <b>1 número</b>. Pergunte ao Hoppy quantos melões ele come!"], "A gate covered in vines, with a lock of <b>{n} numbers</b>.": ["Un portail couvert de lianes, avec un cadenas à <b>{n} chiffres</b>.", "Um portão coberto de cipós, com um cadeado de <b>{n} números</b>."], "A golden key shaped like a trident.": ["Une clé dorée en forme de trident.", "Uma chave dourada em forma de tridente."], "A huge treasure chest with a trident-shaped keyhole. Maybe Ollie can help?": ["Un énorme coffre au trésor avec une serrure en forme de trident. Ollie peut peut-être t'aider ?", "Um baú do tesouro enorme com uma fechadura em forma de tridente. Talvez o Ollie possa ajudar?"], "A key shaped like a seashell.": ["Une clé en forme de coquillage.", "Uma chave em forma de concha."], "A long, strong rope.": ["Une longue corde solide.", "Uma corda comprida e forte."], "A mouse is the lightest. A lion is the heaviest here.": ["La souris est la plus légère. Ici, le lion est le plus lourd.", "O rato é o mais leve. Aqui, o leão é o mais pesado."], "A mouse is the lightest. An elephant is the heaviest.": ["La souris est la plus légère. L'éléphant est le plus lourd.", "O rato é o mais leve. O elefante é o mais pesado."], "A newborn baby elephant weighs about 100 kg, as much as a grown-up person!": ["Un bébé éléphant pèse environ 100 kg à la naissance, autant qu'un adulte !", "Um filhote de elefante pesa uns 100 kg quando nasce, tanto quanto um adulto!"], "A secret message! Every letter moved one step forward in the alphabet. Move each one back to read it.": ["Un message secret ! Chaque lettre a avancé d'un pas dans l'alphabet. Recule chacune d'un pas pour le lire.", "Uma mensagem secreta! Cada letra andou um passo para a frente no alfabeto. Volte cada uma um passo para ler."], "A snorkel costs <b>{n} shells</b>. Pick shells that add up to exactly that!": ["Un tuba coûte <b>{n} coquillages</b>. Choisis des coquillages qui font exactement ce prix !", "Um snorkel custa <b>{n} conchas</b>. Escolha conchas que somem exatamente isso!"], "A spider has 8 legs, an ant has 6, a bird has 2.": ["Une araignée a 8 pattes, une fourmi 6, un oiseau 2.", "Uma aranha tem 8 patas, uma formiga tem 6, um pássaro tem 2."], "A strong branch over the river. You need a rope to swing across!": ["Une branche solide au-dessus de la rivière. Il te faut une corde pour te balancer de l'autre côté !", "Um galho forte sobre o rio. Você precisa de uma corda para se balançar até o outro lado!"], "A toucan's huge beak is very light, because it's full of tiny air pockets.": ["L'énorme bec du toucan est très léger, car il est plein de petites bulles d'air.", "O bico enorme do tucano é bem leve, porque é cheio de bolsinhas de ar."], "A treehouse high in the trees, with a zipline leading far away. Tito the toucan loves patterns.": ["Une cabane perchée dans les arbres, avec une tyrolienne qui part au loin. Tito le toucan adore les motifs.", "Uma casa na árvore lá no alto, com uma tirolesa que vai bem longe. O Tito, o tucano, adora padrões."], "A wide river blocks the way. Hoppy the hippo is floating in it, and his tummy is rumbling.": ["Une large rivière bloque le chemin. Hoppy l'hippopotame y flotte, et son ventre gargouille.", "Um rio largo bloqueia o caminho. O Hoppy, o hipopótamo, está boiando nele, e a barriga dele está roncando."], "A zipline over the jungle! You need a handle to hold on to.": ["Une tyrolienne au-dessus de la jungle ! Il te faut une poignée pour t'accrocher.", "Uma tirolesa sobre a selva! Você precisa de uma alça para se segurar."], "Add an octopus's arms and a starfish's arms.": ["Additionne les bras d'une pieuvre et les bras d'une étoile de mer.", "Some os braços de um polvo e os braços de uma estrela-do-mar."], "After the big show, a secret door behind the stage leads into a steamy jungle. Welcome to World 3!": ["Après le grand spectacle, une porte secrète derrière la scène mène à une jungle humide. Bienvenue dans le Monde 3 !", "Depois do grande show, uma porta secreta atrás do palco leva a uma selva úmida. Bem-vindo ao Mundo 3!"], "An elephant and a giraffe have 4 legs each. A parrot has 2.": ["Un éléphant et une girafe ont 4 pattes chacun. Un perroquet en a 2.", "Um elefante e uma girafa têm 4 patas cada. Um papagaio tem 2."], "An octopus has three hearts and blue blood!": ["Une pieuvre a trois cœurs et du sang bleu !", "O polvo tem três corações e sangue azul!"], "Animal scale": ["Balance des animaux", "Balança dos bichos"], "Animal science": ["Sciences des animaux", "Ciência dos animais"], "Baby elephant": ["Bébé éléphant", "Filhote de elefante"], "Beach Hut": ["La cabane de plage", "A cabana da praia"], "Beach shop": ["Boutique de plage", "Lojinha da praia"], "Binoculars": ["Jumelles", "Binóculo"], "Bring the water bucket and the peanuts to the baby elephant!": ["Apporte le seau d'eau et les cacahuètes au bébé éléphant !", "Leve o balde de água e o amendoim para o filhote de elefante!"], "Buy the snorkel at the beach shop. Pick shells that add up to exactly 17.": ["Achète le tuba à la boutique de plage. Choisis des coquillages qui font exactement 17.", "Compre o snorkel na lojinha da praia. Escolha conchas que somem exatamente 17."], "Buy the snorkel at the beach shop. Pick shells that add up to exactly 85.": ["Achète le tuba à la boutique de plage. Choisis des coquillages qui font exactement 85.", "Compre o snorkel na lojinha da praia. Escolha conchas que somem exatamente 85."], "Cartwheel move": ["Roue", "Estrela (ginástica)"], "Cat": ["Chat", "Gato"], "Check": ["Vérifier", "Conferir"], "Clownfish": ["Poisson-clown", "Peixe-palhaço"], "Colorful corals and fish all around you. A giant clam is keeping something shut tight.": ["Des coraux et des poissons de toutes les couleurs t'entourent. Une palourde géante garde quelque chose bien fermé.", "Corais e peixes coloridos por todo lado. Uma concha gigante está guardando algo bem fechado."], "Comparing weights": ["Comparer des poids", "Comparar pesos"], "Coral Reef": ["Le récif de corail", "O recife de coral"], "Count all the starfish arms. That's the clam's code.": ["Compte tous les bras des étoiles de mer. C'est le code de la palourde.", "Conte todos os braços das estrelas-do-mar. É o código da concha."], "Count the peanuts: 3 bags with 4 in each.": ["Compte les cacahuètes : 3 sacs avec 4 dans chacun.", "Conte os amendoins: 3 sacos com 4 em cada."], "Count the peanuts: 7 bags with 8 in each.": ["Compte les cacahuètes : 7 sacs avec 8 dans chacun.", "Conte os amendoins: 7 sacos com 8 em cada."], "Count the starfish arms, then add the octopus's arms.": ["Compte les bras des étoiles de mer, puis ajoute les bras de la pieuvre.", "Conte os braços das estrelas-do-mar e depois some os braços do polvo."], "Depth panel": ["Panneau de profondeur", "Painel de profundidade"], "Depth set! The submarine is ready to dive.": ["Profondeur réglée ! Le sous-marin est prêt à plonger.", "Profundidade ajustada! O submarino está pronto para mergulhar."], "Dock gate": ["Portail du ponton", "Portão do píer"], "Dog": ["Chien", "Cachorro"], "Dolphin": ["Dauphin", "Golfinho"], "Dolphins and whales are mammals. Sharks and clownfish are fish.": ["Les dauphins et les baleines sont des mammifères. Les requins et les poissons-clowns sont des poissons.", "Golfinhos e baleias são mamíferos. Tubarões e peixes-palhaço são peixes."], "Dolphins and whales are mammals: they breathe air and feed their babies milk.": ["Les dauphins et les baleines sont des mammifères : ils respirent de l'air et nourrissent leurs bébés avec du lait.", "Golfinhos e baleias são mamíferos: respiram ar e alimentam os filhotes com leite."], "Dolphins, whales and seals are mammals. The others are fish.": ["Les dauphins, les baleines et les phoques sont des mammifères. Les autres sont des poissons.", "Golfinhos, baleias e focas são mamíferos. Os outros são peixes."], "Drop": ["Goutte", "Gota"], "Each number is 5 more than the one before.": ["Chaque nombre vaut 5 de plus que le précédent.", "Cada número é 5 a mais que o anterior."], "Each number is double the one before.": ["Chaque nombre est le double du précédent.", "Cada número é o dobro do anterior."], "Elephant": ["Éléphant", "Elefante"], "Elephant Mud Pit": ["La mare de boue de l'éléphant", "O lamaçal do elefante"], "Empty now. The binoculars are in your backpack.": ["Vide maintenant. Les jumelles sont dans ton sac.", "Vazio agora. O binóculo está na sua mochila."], "Empty now. The peanuts are in your backpack.": ["Vide maintenant. Les cacahuètes sont dans ton sac.", "Vazia agora. Os amendoins estão na sua mochila."], "Everything is ready. Open the hatch!": ["Tout est prêt. Ouvre l'écoutille !", "Está tudo pronto. Abra a escotilha!"], "Explorer's crate": ["Caisse de l'explorateur", "Caixa do explorador"], "Find D4 first, then B2.": ["Trouve d'abord D4, puis B2.", "Ache primeiro D4, depois B2."], "Find square C3 on the map: column C, row 3.": ["Trouve la case C3 sur la carte : colonne C, ligne 3.", "Ache o quadrado C3 no mapa: coluna C, linha 3."], "Find square {a}: the column letter, then the row number. Which picture is there?": ["Trouve la case {a} : la lettre de la colonne, puis le numéro de la ligne. Quelle image s'y trouve ?", "Ache o quadrado {a}: a letra da coluna e depois o número da linha. Qual figura está lá?"], "Find {a}, then {b}. Tap their pictures in that order.": ["Trouve {a}, puis {b}. Touche leurs images dans cet ordre.", "Ache {a} e depois {b}. Toque nas figuras nessa ordem."], "First find the safe stepping stones.": ["Trouve d'abord les pierres sûres.", "Primeiro ache as pedras seguras."], "Fish": ["Poisson", "Peixe"], "Footprints": ["Empreintes", "Pegadas"], "For breathing while you look underwater.": ["Pour respirer en regardant sous l'eau.", "Para respirar enquanto olha debaixo d'água."], "For looking at things far away.": ["Pour regarder les choses au loin.", "Para olhar coisas bem longe."], "Fractions": ["Fractions", "Frações"], "From 10 to 30 is 30 − 10.": ["De 10 à 30, c'est 30 − 10.", "De 10 até 30 é 30 − 10."], "From 35 to 120 is 120 − 35.": ["De 35 à 120, c'est 120 − 35.", "De 35 até 120 é 120 − 35."], "From lightest to heaviest:": ["Du plus léger au plus lourd :", "Do mais leve ao mais pesado:"], "Fruit basket": ["Panier de fruits", "Cesto de frutas"], "Giant clam": ["Palourde géante", "Concha gigante"], "Giraffe": ["Girafe", "Girafa"], "Go across to column C, then down to row 3.": ["Va jusqu'à la colonne C, puis descends à la ligne 3.", "Vá até a coluna C e depois desça até a linha 3."], "Great science! The board gave you a shell key.": ["Bravo, scientifique ! Le tableau t'a donné une clé coquillage.", "Que cientista! O quadro te deu uma chave-concha."], "Half of 10 means 10 split into 2 equal parts.": ["La moitié de 10, c'est 10 partagé en 2 parts égales.", "Metade de 10 é 10 dividido em 2 partes iguais."], "Hatch": ["Écoutille", "Escotilha"], "Hippo River": ["La rivière de l'hippo", "O rio do hipopótamo"], "Hippos can't really swim! They walk or bounce along the bottom of rivers.": ["Les hippopotames ne savent pas vraiment nager ! Ils marchent ou rebondissent au fond des rivières.", "Hipopótamos não sabem nadar de verdade! Eles andam ou quicam no fundo dos rios."], "Hmm, that one is heavier. Start again from the lightest!": ["Hum, celui-là est plus lourd. Recommence par le plus léger !", "Hum, esse é mais pesado. Comece de novo pelo mais leve!"], "Hold on tight!": ["Accroche-toi bien !", "Segure firme!"], "Hoppy is munching happily. You found a rope under the fruit!": ["Hoppy mâchonne tout content. Tu as trouvé une corde sous les fruits !", "O Hoppy está mastigando feliz. Você achou uma corda embaixo das frutas!"], "Hoppy the hippo": ["Hoppy l'hippo", "Hoppy, o hipopótamo"], "How many legs do they have in all? That's the gate code.": ["Combien de pattes ont-ils en tout ? C'est le code du portail.", "Quantas patas eles têm no total? É o código do portão."], "Inside a cozy submarine. Set the depth and the route to dive down to the sunken ship.": ["Dans un petit sous-marin douillet. Règle la profondeur et la route pour plonger jusqu'à l'épave.", "Dentro de um submarino aconchegante. Ajuste a profundidade e a rota para mergulhar até o navio afundado."], "Is each animal a fish or a mammal? Mammals breathe air and feed their babies milk.": ["Chaque animal est-il un poisson ou un mammifère ? Les mammifères respirent de l'air et nourrissent leurs bébés avec du lait.", "Cada animal é peixe ou mamífero? Mamíferos respiram ar e alimentam os filhotes com leite."], "It's a big spotted cat that climbs trees.": ["C'est un grand félin tacheté qui grimpe aux arbres.", "É um felino grande e pintado que sobe em árvores."], "It's a big striped cat.": ["C'est un grand félin rayé.", "É um felino grande e listrado."], "It's the diamond.": ["C'est le diamant.", "É o diamante."], "Jungle Gate": ["Le portail de la jungle", "O portão da selva"], "Kiki the parrot": ["Kiki le perroquet", "Kiki, o papagaio"], "Letters go across, numbers go down.": ["Les lettres vont de gauche à droite, les nombres de haut en bas.", "As letras vão para os lados, os números vão para baixo."], "Lion": ["Lion", "Leão"], "Look at the totem pole's pattern. What comes next?": ["Regarde le motif du totem. Qu'est-ce qui vient ensuite ?", "Olhe o padrão do totem. O que vem depois?"], "Lots of tiny footprints in the mud, too far away to see clearly. If only you had binoculars...": ["Plein de petites empreintes dans la boue, trop loin pour bien les voir. Si seulement tu avais des jumelles...", "Um monte de pegadas na lama, longe demais para ver direito. Se você tivesse um binóculo..."], "Mammal": ["Mammifère", "Mamífero"], "Mammals breathe air and feed their babies milk.": ["Les mammifères respirent de l'air et nourrissent leurs bébés avec du lait.", "Mamíferos respiram ar e alimentam os filhotes com leite."], "Map coordinates": ["Coordonnées sur une carte", "Coordenadas no mapa"], "Message in a bottle": ["Message dans une bouteille", "Mensagem na garrafa"], "Money and adding": ["L'argent et les additions", "Dinheiro e somas"], "Mouse": ["Souris", "Rato"], "Mouse, cat, dog, lion.": ["Souris, chat, chien, lion.", "Rato, gato, cachorro, leão."], "Mouse, rabbit, dog, lion, giraffe, elephant.": ["Souris, lapin, chien, lion, girafe, éléphant.", "Rato, coelho, cachorro, leão, girafa, elefante."], "Move every letter one step back: D becomes C.": ["Recule chaque lettre d'un pas : D devient C.", "Volte cada letra um passo: T vira S."], "Move every letter one step back: P becomes O.": ["Recule chaque lettre d'un pas : Q devient P.", "Volte cada letra um passo: Q vira P."], "Multiply an octopus's arms by a starfish's arms.": ["Multiplie les bras d'une pieuvre par les bras d'une étoile de mer.", "Multiplique os braços de um polvo pelos braços de uma estrela-do-mar."], "Navigation map": ["Carte de navigation", "Mapa de navegação"], "Not quite! Say the pattern out loud and try again.": ["Presque ! Dis le motif à voix haute et réessaie.", "Quase! Fale o padrão em voz alta e tente de novo."], "Not that square. Letters go across, numbers go down.": ["Pas cette case. Les lettres vont de gauche à droite, les nombres de haut en bas.", "Não é esse quadrado. As letras vão para os lados, os números vão para baixo."], "Not yet! {n} still in the wrong group.": ["Pas encore ! Il en reste {n} dans le mauvais groupe.", "Ainda não! {n} ainda no grupo errado."], "Number sequences": ["Suites de nombres", "Sequências de números"], "Oh no! A baby elephant is stuck in thick mud. Can you help her get out?": ["Oh non ! Un bébé éléphant est coincé dans la boue épaisse. Peux-tu l'aider à sortir ?", "Ah, não! Um filhote de elefante está preso na lama grossa. Você consegue ajudar a tirá-lo?"], "Ollie the octopus": ["Ollie la pieuvre", "Ollie, o polvo"], "One quarter of 12 is 3, so three quarters is 3 × 3.": ["Un quart de 12, c'est 3, donc trois quarts, c'est 3 × 3.", "Um quarto de 12 é 3, então três quartos é 3 × 3."], "Only some stones are safe. Hop across counting by {n}s. Tap the stones in order, starting with {n}!": ["Seules certaines pierres sont sûres. Traverse en comptant de {n} en {n}. Touche les pierres dans l'ordre, en commençant par {n} !", "Só algumas pedras são seguras. Atravesse contando de {n} em {n}. Toque nas pedras em ordem, começando pelo {n}!"], "Oops, wrong one! Watch again and try once more.": ["Oups, ce n'est pas ça ! Regarde encore et réessaie.", "Ops, não é esse! Olhe de novo e tente outra vez."], "Parrots can live for more than 50 years, and some learn hundreds of words!": ["Les perroquets peuvent vivre plus de 50 ans, et certains apprennent des centaines de mots !", "Papagaios podem viver mais de 50 anos, e alguns aprendem centenas de palavras!"], "Patterns": ["Motifs", "Padrões"], "Pay": ["Payer", "Pagar"], "Peanut box": ["Boîte à cacahuètes", "Caixa de amendoim"], "Peanuts": ["Cacahuètes", "Amendoins"], "Pet parrot": ["Perroquet compagnon", "Papagaio de estimação"], "Pick 10, 5 and 2.": ["Choisis 10, 5 et 2.", "Escolha 10, 5 e 2."], "Pick 50, 25 and 10.": ["Choisis 50, 25 et 10.", "Escolha 50, 25 e 10."], "Play Ollie's memory game: watch, then copy the pictures in the same order.": ["Joue au jeu de mémoire d'Ollie : regarde, puis refais les images dans le même ordre.", "Jogue o jogo da memória do Ollie: olhe e depois repita as figuras na mesma ordem."], "Pufferfish": ["Poisson-globe", "Baiacu"], "Put the animals in order on the scale, from lightest to heaviest.": ["Range les animaux sur la balance, du plus léger au plus lourd.", "Coloque os bichos em ordem na balança, do mais leve ao mais pesado."], "Put the animals in order, from the lightest to the heaviest. Then the supply box opens!": ["Range les animaux du plus léger au plus lourd. Ensuite, la caisse de matériel s'ouvre !", "Coloque os bichos em ordem, do mais leve ao mais pesado. Aí a caixa de materiais abre!"], "Rabbit": ["Lapin", "Coelho"], "Read the depth panel. How many more meters down?": ["Lis le panneau de profondeur. Combien de mètres encore pour descendre ?", "Leia o painel de profundidade. Quantos metros ainda faltam para descer?"], "Read the message in the bottle. Each letter moved one step forward in the alphabet.": ["Lis le message dans la bouteille. Chaque lettre a avancé d'un pas dans l'alphabet.", "Leia a mensagem na garrafa. Cada letra andou um passo para a frente no alfabeto."], "Rope": ["Corde", "Corda"], "Rope swing": ["Liane-balançoire", "Balanço de corda"], "Route set! Next stop: the sunken ship.": ["Route réglée ! Prochain arrêt : l'épave.", "Rota definida! Próxima parada: o navio afundado."], "Sand, waves and a little beach shop. Tula the turtle found a message in a bottle!": ["Du sable, des vagues et une petite boutique de plage. Tula la tortue a trouvé un message dans une bouteille !", "Areia, ondas e uma lojinha de praia. A Tula, a tartaruga, achou uma mensagem numa garrafa!"], "Say the pattern out loud and listen for what repeats.": ["Dis le motif à voix haute et écoute ce qui se répète.", "Fale o padrão em voz alta e escute o que se repete."], "Say the pictures out loud while you watch.": ["Dis les images à voix haute en regardant.", "Fale as figuras em voz alta enquanto olha."], "Science board": ["Tableau des sciences", "Quadro de ciências"], "Sea turtles have lived in the oceans since the time of the dinosaurs.": ["Les tortues de mer vivent dans les océans depuis l'époque des dinosaures.", "As tartarugas-marinhas vivem nos oceanos desde o tempo dos dinossauros."], "Seal": ["Phoque", "Foca"], "Secret codes": ["Codes secrets", "Códigos secretos"], "Set the depth on the panel first.": ["Règle d'abord la profondeur sur le panneau.", "Primeiro ajuste a profundidade no painel."], "Set the route on the navigation map first.": ["Règle d'abord la route sur la carte de navigation.", "Primeiro defina a rota no mapa de navegação."], "Shark": ["Requin", "Tubarão"], "She needs some energy. Elephants love peanuts!": ["Elle a besoin d'énergie. Les éléphants adorent les cacahuètes !", "Ele precisa de energia. Elefantes adoram amendoim!"], "Shell": ["Coquillage", "Concha"], "Shell key": ["Clé coquillage", "Chave-concha"], "Skip counting": ["Compter de 2 en 2, de 7 en 7…", "Contar pulando números"], "Snorkel": ["Tuba", "Snorkel"], "Sort the sea animals into fish and mammals on the science board.": ["Classe les animaux marins en poissons et mammifères sur le tableau des sciences.", "Separe os animais do mar em peixes e mamíferos no quadro de ciências."], "Spelling": ["Orthographe", "Ortografia"], "Splash! That stone wobbles. Start again.": ["Plouf ! Cette pierre bouge. Recommence.", "Tchibum! Essa pedra balança. Comece de novo."], "Star": ["Étoile", "Estrela"], "Starfish": ["Étoiles de mer", "Estrelas-do-mar"], "Start with 50. Then you need 35 more.": ["Commence par 50. Il te faut encore 35.", "Comece com 50. Aí faltam 35."], "Start with the biggest shell: 10. Then you need 7 more.": ["Commence par le plus gros coquillage : 10. Il te faut encore 7.", "Comece pela maior concha: 10. Aí faltam 7."], "Stepping stones": ["Pierres de gué", "Pedras do rio"], "Submarine": ["Le sous-marin", "O submarino"], "Subtraction": ["Soustractions", "Subtração"], "Sunken Ship": ["L'épave", "O navio afundado"], "Talk to Hoppy. How many melons does he eat?": ["Parle à Hoppy. Combien de melons mange-t-il ?", "Fale com o Hoppy. Quantos melões ele come?"], "Tap 2, 4, 6, 8, then 10.": ["Touche 2, 4, 6, 8, puis 10.", "Toque 2, 4, 6, 8 e depois 10."], "Tap 7, 14, 21, 28, then 35.": ["Touche 7, 14, 21, 28, puis 35.", "Toque 7, 14, 21, 28 e depois 35."], "Tap the compass, then the anchor.": ["Touche la boussole, puis l'ancre.", "Toque na bússola e depois na âncora."], "Tap the stepping stones counting by 2s.": ["Touche les pierres en comptant de 2 en 2.", "Toque nas pedras contando de 2 em 2."], "Tap the stepping stones counting by 7s.": ["Touche les pierres en comptant de 7 en 7.", "Toque nas pedras contando de 7 em 7."], "Thanks for shopping! Your snorkel is in your backpack.": ["Merci pour tes achats ! Ton tuba est dans ton sac.", "Obrigado pela compra! Seu snorkel está na mochila."], "That's not the exact price. Try other shells!": ["Ce n'est pas le prix exact. Essaie d'autres coquillages !", "Esse não é o preço exato. Tente outras conchas!"], "The baby elephant splashes free and lifts you up toward a treehouse!": ["Le bébé éléphant se libère dans une gerbe de boue et te soulève vers une cabane dans les arbres !", "O filhote de elefante sai da lama e te levanta até uma casa na árvore!"], "The basket code is 5.": ["Le code du panier est 5.", "O código do cesto é 5."], "The basket code is 9.": ["Le code du panier est 9.", "O código do cesto é 9."], "The brake lock shows a number pattern. Which number comes next?": ["Le frein a un cadenas avec une suite de nombres. Quel nombre vient ensuite ?", "A trava do freio mostra uma sequência de nú   function clockFace(g, w, hh, mm) {

    for (let i = 1; i <= 12; i++) { const a = i / 12 * Math.PI * 2; g.fillText(String(i), c + Math.sin(a) * r * 0.8, c - Math.cos(a) * r * 0.8); }
    const hand = (a, len, wd, col) => { g.strokeStyle = col; g.lineWidth = wd; g.lineCap = "round"; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.sin(a) * len, c - Math.cos(a) * len); g.stroke(); };
    hand(((hh % 12) + mm / 60) / 12 * Math.PI * 2, r * 0.45, w * 0.045, "#2b2140");
    hand(mm / 60 * Math.PI * 2, r * 0.68, w * 0.025, "#e2536b");
    g.fillStyle = "#2b2140"; g.beginPath(); g.arc(c, c, w * 0.03, 0, 7); g.fill();
  }

    add(pn, new T.BoxGeometry(1.7, 0.04, 0.3), M("#fbfaf5", { roughness: 0.3 }), 0, 0.86, 0.47);
    for (let i = 0; i < 12; i++) if (![2, 6, 9].includes(i % 7)) add(pn, new T.BoxGeometry(0.06, 0.04, 0.17), lac, -0.71 + i * 0.14, 0.89, 0.4);
    NOTE_COLS.forEach((c, i) => add(pn, new T.BoxGeometry(0.12, 0.02, 0.06), M(c, { emissive: c, emissiveIntensity: 0.3 }), -0.32 + i * 0.16, 0.885, 0.6));
    [-0.6, 0.6].forEach(x => add(pn, new T.CylinderGeometry(0.05, 0.05, 0.12, 12), brass, x, 1.41, 0.1));
    add(grp, new T.BoxGeometry(1.0, 0.08, 0.4), lac, -1.7, 0.5, -2.75);
    [[-0.45, -0.15], [0.45, -0.15], [-0.45, 0.15], [0.45, 0.15]].forEach(([x, z]) => add(grp, new T.BoxGeometry(0.05, 0.5, 0.05), lac, -1.7 + x, 0.25, -2.75 + z));

    add(mb, new T.CylinderGeometry(0.04, 0.05, 0.75, 10), tw, 0, 0.375, 0);
    add(mb, new T.CylinderGeometry(0.22, 0.25, 0.03, 16), tw, 0, 0.02, 0);
    add(mb, new T.BoxGeometry(0.36, 0.2, 0.26), M("#b03a5b", { roughness: 0.4 }), 0, 0.88, 0);

    const keyGlint = add(wd, new T.TorusGeometry(0.06, 0.015, 6, 12), M("#ffd75e", { metalness: 0.9, roughness: 0.2, emissive: "#ffb800", emissiveIntensity: 0.6 }), 0.3, 2.47, 0.1);

    bookshelf(bsPivot, 0.8, 0, 0, 13);
    spots.push({ id: "bookcase", label: L("Bookshelf"), root: bsPivot, stand: [3.6, -2.6], tag: [3.6, 2.75, -3.7], done: () => state.f.piano, open: openBookcase });
    obstacles.push([3.6, -3.6, 0.85]);

    // drum, with a golden fish hiding behind it
    const drum = new T.Group(); drum.position.set(-3.3, 0, 1.6); grp.add(drum);
    add(drum, new T.CylinderGeometry(0.4, 0.4, 0.5, 24), M("#c0392b", { roughness: 0.4 }), 0, 0.25, 0);
    add(drum, new T.CylinderGeometry(0.41, 0.41, 0.02, 24), M("#f4f1de"), 0, 0.51, 0);
    [0.05, 0.45].forEach(y => add(drum, new T.TorusGeometry(0.405, 0.02, 6, 24), brass, 0, y, 0).rotation.x = Math.PI / 2);
    obstacles.push([-3.3, 1.6, 0.45]);
    const fish = makeFish(); fish.position.set(-3.55, 0.2, 1.0); grp.add(fish);

  function buildRoof() {
    const grp = new T.Group(), floors = [], spots = [], obstacles = [];
    shell(grp, M("#ffffff", { map: woodTex(28, 34), roughness: 0.7 }), null, floors);
    lights(grp, { sky: "#c9b6ff", ground: "#3b2a50", hemi: 0.55, sun: "#ffc59a", sunI: 0.9, sunPos: [-6, 7, 4] });
    const rail = M("#f4ead8", { roughness: 0.6 });
    for (let x = -4.9; x <= 4.95; x += 0.7) add(grp, new T.CylinderGeometry(0.04, 0.04, 1.0, 8), rail, x, 0.5, -3.95);
    for (let z = -3.95; z <= 3.95; z += 0.7) { add(grp, new T.CylinderGeometry(0.04, 0.04, 1.0, 8), rail, -4.95, 0.5, z); add(grp, new T.CylinderGeometry(0.04, 0.04, 1.0, 8), rail, 4.95, 0.5, z); }
    add(grp, new T.BoxGeometry(10, 0.06, 0.08), rail, 0, 1.0, -3.95);
    [-4.95, 4.95].forEach(x => add(grp, new T.BoxGeometry(0.08, 0.06, 8), rail, x, 1.0, 0));
    add(grp, new T.BoxGeometry(10.4, 0.3, 8.4), M("#7a3b2e", { roughness: 0.8 }), 0, -0.16, 0);
    // the town at dusk
    const winTex = cached("windows", () => tex(128, 256, (g, w, h) => { g.fillStyle = "#2a2342"; g.fillRect(0, 0, w, h); const r = mulberry(31); for (let y = 10; y < h; y += 28) for (let x = 10; x < w; x += 28) { g.fillStyle = r() < 0.55 ? "#ffd27a" : "#3b3156"; g.fillRect(x, y, 14, 16); } }));
    const townM = new T.MeshStandardMaterial({ map: winTex, emissiveMap: winTex, emissive: "#ffffff", emissiveIntensity: 0.55, roughness: 0.9 });
    const r = mulberry(17);
    for (let i = 0; i < 26; i++) { const x = -22 + r() * 44, z = -10 - r() * 18, hgt = 3 + r() * 9, w = 1.5 + r() * 2.5; add(grp, new T.BoxGeometry(w, hgt, w), townM, x, -6 + hgt / 2, z).castShadow = false; }
    const pts = [];
    for (let i = 0; i < 300; i++) { const a = -Math.PI + r() * Math.PI, e = 0.12 + r() * 0.9; pts.push(Math.cos(a) * Math.cos(e) * 60, Math.sin(e) * 60, Math.sin(a) * Math.cos(e) * 60); }
    const sg = new T.BufferGeometry(); sg.setAttribute("position", new T.Float32BufferAttribute(pts, 3));
    grp.add(new T.Points(sg, new T.PointsMaterial({ color: "#ffffff", size: 0.35, fog: false })));
    add(grp, new T.SphereGeometry(2.2, 24, 18), new T.MeshBasicMaterial({ color: "#fff3c4", fog: false }), 14, 16, -45).castShadow = false;
    // string lights along the back railing
    const bulbs = [];
    [-4.95, 4.95].forEach(x => add(grp, new T.CylinderGeometry(0.04, 0.04, 2.2, 8), rail, x, 1.1, -3.95));
    for (let i = 0; i <= 20; i++) { const b = add(grp, new T.SphereGeometry(0.05, 8, 6), new T.MeshBasicMaterial({ color: "#ffd27a" }), -4.9 + i * 0.49, 2.1 - Math.sin(i / 20 * Math.PI) * 0.35, -3.95); b.castShadow = false; bulbs.push(b); }
    // chimney + hidden golden fish, potted plants
    add(grp, new T.BoxGeometry(0.8, 1.6, 0.8), M("#9a4a3a", { roughness: 0.9 }), -4.1, 0.8, -2.9);
    add(grp, new T.BoxGeometry(0.95, 0.15, 0.95), M("#6b3326"), -4.1, 1.65, -2.9);
    obstacles.push([-4.1, -2.9, 0.6]);
    const fish = makeFish(); fish.position.set(-4.5, 0.2, -3.55); grp.add(fish);
    spots.push({ id: "fish5", fish: true, root: fish, stand: [-3.2, -3.4], open: () => grabFish("fish5") });
    [[-4.3, 3.3], [4.3, 3.3]].forEach(([x, z]) => { add(grp, new T.CylinderGeometry(0.25, 0.2, 0.4, 14), M("#c4683b"), x, 0.2, z); add(grp, new T.SphereGeometry(0.35, 14, 12), M("#3f8f45", { roughness: 0.9 }), x, 0.6, z); });

    // the hot-air balloon

    const wick = cached("wicker", () => tex(256, 128, (g, w, h) => { g.fillStyle = "#a8743f"; g.fillRect(0, 0, w, h); g.strokeStyle = "#6e4426"; g.lineWidth = 3; for (let y = 0; y < h; y += 12) { g.beginPath(); for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x * 0.4) * 3); g.stroke(); } for (let x = 0; x < w; x += 16) { g.fillStyle = "rgba(60,30,10,.35)"; g.fillRect(x, 0, 3, h); } }, [3, 1]));
    add(bal, new T.CylinderGeometry(0.75, 0.65, 0.85, 24), M("#ffffff", { map: wick, roughness: 0.9 }), 0, 0.425, 0);
    add(bal, new T.TorusGeometry(0.75, 0.06, 8, 24), M("#6e4426"), 0, 0.86, 0).rotation.x = Math.PI / 2;
    const stripes = cached("stripes", () => tex(512, 256, (g, w, h) => { const cs = ["#e2536b", "#f7d23e", "#4fc59a", "#3f8ef0", "#f39a2b", "#9a5ae0"]; for (let i = 0; i < 12; i++) { g.fillStyle = cs[i % cs.length]; g.fillRect(i * w / 12, 0, w / 12 + 1, h); } }));
    const env = add(bal, new T.SphereGeometry(1.5, 32, 24), M("#ffffff", { map: stripes, roughness: 0.6 }), 0, 3.6, 0); env.scale.y = 1.12;
    add(bal, new T.CylinderGeometry(0.85, 0.35, 0.7, 24, 1, true), M("#ffffff", { map: stripes, roughness: 0.6, side: T.DoubleSide }), 0, 2.2, 0);

    const fireLight = point(bal, "#ff9a3c", 0, 6, 0, 2.3, 0);
    const hung = new T.Group(); bal.add(hung);
    [0.8, -0.8].forEach(x => add(hung, new T.SphereGeometry(0.16, 12, 10), M("#c9b48a", { roughness: 1 }), x, 0.6, 0).scale.set(0.8, 1.1, 0.8));
    spots.push({ id: "balloon", label: L("Hot-air balloon"), root: bal, stand: [0.6, -1.15], tag: [0.6, 1.25, -2.3], open: openBalloon });
    obstacles.push([0.6, -2.3, 0.8]);

    // map table
    const mt = table(grp, -3.0, 0.9, 1.2, 0.9, 0.85, M("#7a4a2c", { map: woodTex(22, 34) }));
    const mapTex = tex(512, 384, (g, w, h) => { g.fillStyle = "#f4e2b8"; g.fillRect(0, 0, w, h); const cell = 64, ox = (w - cell * 5) / 2, oy = (h - cell * 5) / 2; g.font = "40px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.strokeStyle = "#a8743f"; g.lineWidth = 2; MAP.forEach((row, rr) => row.forEach((ic, c) => { g.strokeRect(ox + c * cell, oy + rr * cell, cell, cell); g.fillText(ic, ox + c * cell + cell / 2, oy + rr * cell + cell / 2 + 2); })); });
    const mp = add(grp, new T.PlaneGeometry(1.0, 0.75), M("#fff", { map: mapTex, roughness: 0.9 }), -3.0, 0.9, 0.9); mp.rotation.x = -Math.PI / 2; mp.castShadow = false;
    spots.push({ id: "map", label: L("Map table"), root: mt, extra: [mp], stand: [-1.95, 0.9], tag: [-3.0, 1.35, 0.9], open: openBalloonMap });
    obstacles.push([-3.0, 0.9, 0.7]);

    // fuel tank with a picture lock
    const tk = new T.Group(); tk.position.set(3.7, 0, -1.3); grp.add(tk);
    const red = M("#e2536b", { metalness: 0.4, roughness: 0.4 });
    add(tk, new T.CylinderGeometry(0.35, 0.35, 1.1, 20), red, 0, 0.55, 0);
    add(tk, new T.SphereGeometry(0.35, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), red, 0, 1.1, 0);
    add(tk, new T.CylinderGeometry(0.06, 0.06, 0.15, 10), M("#9aa3b8", { metalness: 0.8 }), 0, 1.5, 0);
    add(tk, new T.CircleGeometry(0.12, 20), M("#fffaf0"), 0, 0.8, 0.355);

    spots.push({ id: "tank", label: L("Fuel tank"), root: tk, stand: [3.4, -0.2], tag: [3.7, 1.95, -1.3], done: () => state.f.tank, open: openTank });
    obstacles.push([3.7, -1.3, 0.45]);

    // sandbags
    const pile = new T.Group(); pile.position.set(2.5, 0, 1.9); grp.add(pile);
    BAGS.forEach((kg, i) => add(pile, new T.SphereGeometry(0.2, 14, 10), M("#c9b48a", { roughness: 1 }), (i % 3 - 1) * 0.38, 0.16 + Math.floor(i / 3) * 0.26, (i % 2) * 0.05).scale.set(1, 0.75, 0.9));
    spots.push({ id: "bags", label: L("Sandbags"), root: pile, stand: [2.5, 2.9], tag: [2.5, 1.0, 1.9], done: () => state.f.bags, open: openBags });
    obstacles.push([2.5, 1.9, 0.5]);

    let lift = null;
    return {
      group: grp, spots, floors, obstacles, spawn: [0.5, 3.0], bg: "#2b2560", fog: ["#3a2f66", 25, 80], lookY: 1.7,
      tick(t) {
        bulbs.forEach((b, i) => b.material.color.setHSL((i * 0.13 + t * 0.05) % 1, 0.8, 0.7));

    };

  function makePenguin() {

    add(body, new T.SphereGeometry(0.26, 20, 16), white, 0, 0.42, 0.07).scale.set(0.78, 1.15, 0.7);
    add(body, new T.SphereGeometry(0.2, 20, 16), black, 0, 0.9, 0);
    add(body, new T.SphereGeometry(0.15, 16, 12), white, 0, 0.88, 0.08).scale.set(1, 0.9, 0.8);
    const beak = add(body, new T.ConeGeometry(0.05, 0.14, 10), orange, 0, 0.88, 0.24); beak.rotation.x = Math.PI / 2;
    [0.07, -0.07].forEach(x => add(body, new T.SphereGeometry(0.03, 8, 8), M("#111"), x, 0.95, 0.17));
    const flips = [1, -1].map(s => { const f = add(body, new T.SphereGeometry(0.12, 12, 10), black, s * 0.27, 0.5, 0); f.scale.set(0.3, 1.1, 0.6); return f; });
    [0.1, -0.1].forEach(x => add(body, new T.BoxGeometry(0.12, 0.03, 0.16), orange, x, 0.02, 0.06));
    add(body, new T.SphereGeometry(0.205, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.45), M("#e2536b"), 0, 0.92, 0);
    add(body, new T.SphereGeometry(0.04, 8, 8), M("#fff"), 0, 1.12, 0);
    g.userData = { body, flips };
    return g;
  }
  function makeDolphin() {
    const g = new T.Group(), grey = M("#6f8fb3", { roughness: 0.3 }), light = M("#d7e6f2", { roughness: 0.35 });
    add(g, new T.CapsuleGeometry(0.22, 0.9, 8, 16), grey).rotation.x = Math.PI / 2;

  // ---------- Worlds 3 and 4: animals ----------
  function makeParrot(body = "#e2536b", wing = "#3f8ef0") {

    [0.05, -0.05].forEach(x => add(g, new T.SphereGeometry(0.022, 8, 8), M("#111"), x, 0.58, 0.1));

    add(g, new T.BoxGeometry(0.08, 0.3, 0.04), wm, 0, 0.12, -0.12).rotation.x = 0.5;

    const curve = new T.CatmullRomCurve3([new T.Vector3(0, -0.05, 0.28), new T.Vector3(0, -0.3, 0.42), new T.Vector3(0, -0.5, 0.4), new T.Vector3(0, -0.6, 0.5)]);

  function makeTurtle() {

  function makeOctopus() {
    const g = new T.Group(), skin = M("#b05ad0", { roughness: 0.5 });
    const head = add(g, new T.SphereGeometry(0.35, 20, 16), skin, 0, 0.75, 0); head.scale.set(1, 1.15, 1);
    [0.12, -0.12].forEach(x => { add(g, new T.SphereGeometry(0.08, 10, 8), M("#fff"), x, 0.75, 0.3); add(g, new T.SphereGeometry(0.04, 8, 8), M("#111"), x, 0.75, 0.37); });
    const legs = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2, p = new T.Group(); p.position.set(Math.cos(a) * 0.2, 0.45, Math.sin(a) * 0.2); p.rotation.y = -a; g.add(p);
      const c = new T.CatmullRomCurve3([new T.Vector3(0, 0, 0), new T.Vector3(0.25, -0.25, 0), new T.Vector3(0.45, -0.38, 0), new T.Vector3(0.6, -0.3, 0)]);
      add(p, new T.TubeGeometry(c, 12, 0.05, 6), skin); legs.push(p);
    }
    g.userData = { legs, head };
    return g;
  }
  const foliage = (grp, pts, dark = "#2f7a3a", light = "#4fa04a") => pts.forEach(([x, z, r], i) => { add(grp, new T.SphereGeometry(r, 14, 12), M(i % 2 ? dark : light, { roughness: 0.95 }), x, r * 0.7, z); });
  function palm(grp, x, z, h = 2.6) {

    add(grp, new T.CylinderGeometry(0.1, 0.16, h, 10), trunkM, x, h / 2, z);
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2, l = add(grp, new T.SphereGeometry(0.6, 12, 6), leafM, x + Math.cos(a) * 0.45, h + 0.05, z + Math.sin(a) * 0.45); l.scale.set(1, 0.12, 0.35); l.rotation.y = -a; l.rotation.z = 0.35; }

  const jungleFloor = () => cached("junglefloor", () => tex(512, 512, (g, w, h) => { const r = mulberry(61); g.fillStyle = "#4e7d32"; g.fillRect(0, 0, w, h); for (let i = 0; i < 7000; i++) { g.strokeStyle = `hsl(${85 + r() * 40},${40 + r() * 20}%,${20 + r() * 20}%)`; g.lineWidth = 2; const x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 6, y - 5 - r() * 7); g.stroke(); } for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(90,60,30,${0.15 + r() * 0.2})`; g.beginPath(); g.ellipse(r() * w, r() * h, 10 + r() * 30, 6 + r() * 14, r() * 3, 0, 7); g.fill(); } }, [3, 3]));
  const sandTex = () => cached("sand", () => tex(512, 512, (g, w, h) => { const r = mulberry(71); g.fillStyle = "#ecd6a2"; g.fillRect(0, 0, w, h); for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${150 + r() * 80},${120 + r() * 60},${70 + r() * 40},${r() * 0.25})`; g.fillRect(r() * w, r() * h, 2, 2); } }, [3, 3]));
  function jungleShell(grp, floors, o = {}) {
    shell(grp, M("#ffffff", { map: jungleFloor(), roughness: 1 }), null, floors);

    [[-4.3, -3.2], [3.6, -3.8], [-4.5, 1.9], [4.4, 0.6]].forEach(([x, z], i) => i % 2 ? palm(grp, x, z, 2.8) : palm(grp, x, z, 2.4));

      const odx = o.tx - o.x, odz = o.tz - o.z, od = Math.hypot(odx, odz);

      o.g.position.set(o.x, 0, o.z);
      animatePerson(o.g, moving, t, o.emote);

  const NET = { listTeams: true, gap: 110, lobby: null, team: null, teamName: "", lastSend: 0, sendTimer: 0, mates: [], lobbyTeams: [] };
  const EMOTE_ICON = { wave: "👋", dance: "💃", jump: "⭐", spin: "🌀", kick: "🥋", party: "🪩", cartwheel: "🤸" };

  // Mimics the parts of the claude.ai room API this game uses (join, presence, onPeers, leave).
  function supaRoom(client) {
    const myKey = Math.random().toString(36).slice(2, 10);
    return {
      presence: () => Promise.resolve(),
      onPeers: () => () => {},
      join(name) {
        return new Promise((resolve, reject) => {
          const ch = client.channel("escape-quest:" + name, { config: { presence: { key: myKey } } });
          let mine = {}, listeners = [], prev = new Map();
          const snapshot = () => Object.entries(ch.presenceState()).map(([key, metas]) => {
            const m = metas[metas.length - 1] || {};
            return { peer: key, sameTab: key === myKey, isMe: key === myKey, presence: m.p || {} };
          });
          const fire = () => {
            const peers = snapshot(), now = new Map(peers.map(p => [p.peer, p]));
            const left = [...prev.keys()].filter(k => !now.has(k)).map(k => prev.get(k));
            prev = now; listeners.forEach(fn => fn({ peers, left, joined: [], updated: [] }));
          };
          const api = {
            presence(patch) { Object.assign(mine, patch); return ch.track({ p: mine }).catch(() => {}); },
            onPeers(fn) { listeners.push(fn); setTimeout(fire, 0); return () => { listeners = listeners.filter(f => f !== fn); }; },
            leave() { return client.removeChannel(ch); },
          };
          ch.on("presence", { event: "sync" }, fire);
          ch.subscribe(status => {
            if (status === "SUBSCRIBED") resolve(api);
            else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") reject(new Error(status));
          });
        });
      },
    };
  }
  async function initNet() {
    try {
      let room = null;
      const online = window.ESCAPE_ONLINE;
      if (online && window.supabase) {
        // Website build: code-only teams over Supabase Realtime presence, no public list of teams.
        room = supaRoom(window.supabase.createClient(online.url, online.key, { auth: { persistSession: false } }));
        NET.listTeams = false; NET.gap = 250;
      } else room = await window.claude?.use?.("room");
      if (!room) { NET.unavailable = true; refreshStartTeams(); return; }
      NET.lobby = room;
      room.onPeers(ch => {
        const teams = new Map();
        ch.peers.forEach(p => {
          if (p.sameTab) return;
          const code = typeof p.presence.team === "string" && /^[A-Z0-9-]{3,12}$/.test(p.presence.team) ? p.presence.team : null;
          if (!code || p.presence.done) return;
          if (!teams.has(code)) teams.set(code, []);
          teams.get(code).push(cleanName(p.presence.name));
        });
        NET.lobbyTeams = [...teams].map(([code, names]) => ({ code, names }));
        refreshStartTeams();
      }, () => { NET.unavailable = true; refreshStartTeams(); });
      refreshStartTeams();
      if (state && state.team && screen === "game") joinTeam(state.team);
    } catch (e) { NET.unavailable = true; refreshStartTeams(); }
  }
  async function joinTeam(code) {
    if (!NET.lobby) { if (NET.unavailable) toast(window.ESCAPE_ONLINE ? L("Team play isn't available right now. You can still play alone.") : L("Team play only works when the game is open on claude.ai. You can still play alone!")); return; }
    if (NET.team && NET.teamName === code) return;
    try {
      if (NET.team) { NET.team.leave(); NET.team = null; }
      const tr = await NET.lobby.join(teamRoomName(code));
      NET.team = tr; NET.teamName = code;
      tr.onPeers(onTeamPeers, () => { NET.team = null; renderMates(); });
      sendPresence(true);
      lobbyPresence();
    } catch (e) { toast(L("Couldn't reach your team right now. Keep playing, it will catch up.")); }
  }
  function lobbyPresence() {
    if (!NET.lobby) return;
    NET.lobby.presence({ name: state ? state.name : "", team: state && state.team ? state.team : null, done: state ? !!state.f.done : false }).catch(() => {});
  }
  function myPresence() {
    const f = {}; FLAGS.forEach(k => { if (state.f[k]) f[k] = true; });
    return { name: state.name, look: state.look, room: curRoom(), x: +W.me.x.toFixed(2), z: +W.me.z.toFixed(2), f, emote: W.me.emote ? { k: W.me.emote.k, n: W.me.emote.n } : null };
  }
  function sendPresence(force) {
    if (!NET.team || !state) return;
    const now = performance.now();
    if (!force && now - NET.lastSend < NET.gap) { clearTimeout(NET.sendTimer); NET.sendTimer = setTimeout(() => sendPresence(true), NET.gap + 10); return; }
    NET.lastSend = now;
    NET.team.presence(myPresence()).catch(() => {});
  }
  function onTeamPeers(ch) {
    if (!state) return;
    const t = W.clock.elapsedTime;
    let gained = [], who = "";
    ch.left.forEach(p => { const o = W.others.get(p.peer); if (o) { W.scene && W.scene.remove(o.g); o.tag.remove(); o.bubble.remove(); W.others.delete(p.peer); } });
    ch.peers.forEach(p => {
      if (p.sameTab) return;
      const pr = p.presence || {};
      if (!pr.name) return;
      // puzzle progress only ever moves forward, so union every teammate's flags
      if (pr.f && typeof pr.f === "object") FLAGS.forEach(k => { if (pr.f[k] === true && !state.f[k] && !gained.includes(k)) { gained.push(k); who = cleanName(pr.name); } });
      let o = W.others.get(p.peer);
      const lookKey = cleanLook(pr.look).join(",");
      if (!o) {
        const tag = document.createElement("div"); tag.className = "tag person";
        const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.hidden = true;
        o = { g: makePerson(pr.look), lookKey, tag, bubble, x: 0, z: 3, tx: 0, tz: 3, room: -1, emote: null, en: null, fresh: true };
        W.others.set(p.peer, o);

      } else if (o.lookKey !== lookKey) {

      }
      o.tag.textContent = cleanName(pr.name);

      o.room = Number.isInteger(pr.room) ? pr.room : -1;
      const x = Number(pr.x), z = Number(pr.z);
      if (Number.isFinite(x) && Number.isFinite(z)) { o.tx = clampX(x); o.tz = clampZ(z); if (o.fresh) { o.x = o.tx; o.z = o.tz; o.fresh = false; } }
      const em = pr.emote && EMOTE_ICON[pr.emote.k] ? pr.emote : null;
      if (em && em.n !== o.en) { o.en = em.n; o.emote = { k: em.k, at: t }; }
      o.shirt = PAL.shirt[cleanLook(pr.look)[3]];
    });
    NET.mates = ch.peers.filter(p => !p.sameTab && p.presence && p.presence.name).map(p => ({ name: cleanName(p.presence.name), shirt: PAL.shirt[cleanLook(p.presence.look)[3]] }));
    renderMates();

  }

        <div class="kicker">${L("A 3D escape adventure · {t} rooms · play alone or with friends", { t: ROOMS.length })}</div>
        <h1>Escape <span>Quest</span></h1>
        <p>${L("Professor Marmalade is a very clever cat who invents all sorts of things. You came to visit, but the door locked behind you! Walk around her house, find clues, crack codes and open {t} locked rooms in four worlds. Bring your friends and solve it together.", { t: ROOMS.length })}</p>
      </section>
      <div class="panels">
        <section class="panel">
          <h2><small>${L("Step 1")}</small>${L("Make your detective")}</h2>
          <div class="maker">
            <canvas class="preview" id="preview" width="340" height="440"></canvas>
            <div class="opts">
              <div class="field"><label for="player-name">${L("Your name")}</label><input id="player-name" maxlength="16" placeholder="${L("Type your name")}" value="${esc(draft.name)}"></div>
              ${chipRow(L("Character"), KINDS, 6)}
              ${swatchRow(L("Skin"), "skin", 0)}${swatchRow(L("Hair"), "hair", 1)}
              ${chipRow(L("Hairstyle"), STYLES, 2)}
              ${swatchRow(L("Shirt"), "shirt", 3)}${swatchRow(draft.look[6] ? L("Skirt") : L("Pants"), "pants", 4)}
              ${chipRow(L("Extra"), EXTRAS, 5)}
              <div><button class="chip-btn" id="surprise">🎲 ${L("Surprise me")}</button></div>
            </div>
          </div>
        </section>
        <section class="panel">
          <h2><small>${L("Step 2")}</small>${L("Detective level")}</h2>
          <div class="levels">${[["junior", "🔍", "Junior", "Ages 6 to 10"], ["expert", "🕵️", "Expert", "Ages 11 and up: harder math and memory"]].map(([k, i, n, d]) => `<button class="level-btn${draft.level === k ? " on" : ""}" data-level="${k}"><span>${i}</span><b>${L(n)}</b><small>${L(d)}</small></button>`).join("")}</div>
          <h2><small>${L("Step 3")}</small>${L("Who's playing?")}</h2>
          <div class="btn-row"><button class="btn" id="solo">${L("Play alone")}</button>${canContinue ? `<button class="btn ghost" id="continue">${L("Keep playing ({room})", { room: L(ROOMS[roomOf(saved.f)].name) })}</button>` : ""}</div>
          <div class="or">${L("or play as a team")}</div>
          <div class="btn-row"><button class="btn mint" id="make-team">${L("Make a team")}</button></div>
          <div class="field"><label for="team-code">${L("Join a friend's team")}</label>
            <div class="btn-row"><input id="team-code" maxlength="12" placeholder="${L("e.g. FROG-27")}" style="flex:1;min-width:0;text-transform:uppercase"><button class="btn mint" id="join-team">${L("Join")}</button></div>
          </div>
          <div class="teams" id="teams"></div>
          <p class="note-line" id="net-note"></p>
          <p class="note-line">⭐ ${L("You have {n} ⭐", { n: totalStars() })} · <button class="linkish" id="prizes">${L("See prizes")}</button></p>
        </section>
      </div>`;
    wireStart(saved);
    $("#back").onclick = renderKind;
    $("#prizes").onclick = openMapCard;
    app.querySelectorAll("[data-level]").forEach(b => b.onclick = () => { draft.level = b.dataset.level; sfx.tap(); app.querySelectorAll("[data-level]").forEach(x => x.classList.toggle("on", x === b)); });
    refreshStartTeams();
    startPreview();
  }
  function openGrownups() {
    openCard(L("For grown-ups"), `<p>${L("Escape Quest is a puzzle adventure for ages 6 to 14. Every room practices real skills:")}</p>
      <table class="results skills">${ROOMS.map((r, i) => `<tr><td>${ROOM_INFO[i].icon}</td><td><b>${L(r.name)}</b><br><small>${ROOM_INFO[i].skills.map(x => L(x)).join(" · ")}</small></td></tr>`).join("")}</table>
      <p>${L("Junior level is for ages 6 to 10. Expert level has harder math, decimals and longer memory puzzles, for ages 11 and up.")}</p>
      <p>${L("Between rooms, the coaches suggest a quick movement break, like jumping jacks or balancing on one foot.")}</p>
      <p>${L("Privacy: there are no ads, no accounts and no chat. Progress is saved only on this device. In team play, teammates see only the name and character each player chooses.")}</p>`);
  }
  function swatchRow(label, key, idx) {
    return `<div class="opt-row"><span>${label}</span><div class="swatches">${PAL[key].map((c, i) => `<button class="sw${draft.look[idx] === i ? " on" : ""}" style="--c:${c}" data-idx="${idx}" data-v="${i}" aria-label="${label} ${i + 1}"></button>`).join("")}</div></div>`;
  }
  function chipRow(label, arr, idx) {
    return `<div class="opt-row"><span>${label}</span><div class="swatches">${arr.map((n, i) => idx === 5 && i === 4 && !hasPrize("crown") ? "" : `<button class="chip-btn${draft.look[idx] === i ? " on" : ""}" data-idx="${idx}" data-v="${i}">${L(n)}</button>`).join("")}</div></div>`;
  }
  function wireStart(saved) {
    const nameIn = $("#player-name");
    nameIn.oninput = () => { draft.name = nameIn.value; };
    app.querySelectorAll("[data-idx]").forEach(b => b.onclick = () => {
      const idx = +b.dataset.idx; draft.look[idx] = +b.dataset.v; sfx.tap();
      if (idx === 6) { draft.name = nameIn.value; return renderStart(); }
      app.querySelectorAll(`[data-idx="${idx}"]`).forEach(x => x.classList.toggle("on", x === b));
      updatePreview();
    });
    app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
      LANG = b.dataset.lang; document.documentElement.lang = LANG; draft.name = nameIn.value; sfx.tap();
      try { localStorage.setItem("escape-quest-lang", LANG); } catch (e) {}
      renderStart();
    });
    $("#surprise").onclick = () => { const kd = draft.look[6]; draft.look = randomLook(); draft.look[6] = kd; draft.name = $("#player-name").value; renderStart(); };
    const begin = team => {
      const name = cleanName($("#player-name").value || "Detective");
      stopPreview();
      state = fresh(name, draft.look.slice(), team); state.level = draft.level || "junior"; state.stars = {}; state.rh = {}; tickStart = Date.now(); save();
      enterGame(true);
    };
    $("#solo").onclick = () => begin(null);
    $("#make-team").onclick = () => begin(`${TEAM_WORDS[Math.floor(Math.random() * TEAM_WORDS.length)]}-${100 + Math.floor(Math.random() * 900)}`);
    const join = code => {
      code = (code || "").toUpperCase().replace(/\s+/g, "").replace(/[^A-Z0-9-]/g, "");
      if (!/^[A-Z0-9-]{3,12}$/.test(code)) { toast(L("Type the team name your friend sees, like FROG-27.")); return; }
      begin(code);
    };
    $("#join-team").onclick = () => join($("#team-code").value);
    $("#team-code").onkeydown = e => { if (e.key === "Enter") join(e.target.value); };
    app.querySelector("#teams").onclick = e => { const b = e.target.closest("[data-join]"); if (b) join(b.dataset.join); };
    const c = $("#continue");
    if (c) c.onclick = () => { stopPreview(); state = saved; state.name = cleanName($("#player-name").value || saved.name); state.look = draft.look.slice(); tickStart = Date.now(); save(); enterGame(false); };
  }
  function refreshStartTeams() {
    if (screen !== "start") return;
    const box = $("#teams"), note = $("#net-note"); if (!box) return;
    box.innerHTML = NET.lobbyTeams.slice(0, 6).map(t => `<div class="team-row"><div><b>${esc(t.code)}</b><small>${t.names.map(esc).join(", ")}</small></div><button class="btn mint" data-join="${esc(t.code)}" style="font-size:16px;padding:6px 14px">${L("Join")}</button></div>`).join("");
    const teamBtns = ["#make-team", "#join-team"].map(s => $(s));
    if (NET.unavailable) { note.textContent = window.ESCAPE_ONLINE ? L("Team play isn't available right now. You can still play alone.") : L("Team play works when the game is open on claude.ai with friends it's shared with. You can still play alone here."); teamBtns.forEach(b => b && (b.disabled = true)); }
    else if (!NET.listTeams) note.textContent = L("Make a team, then tell your friends the team name so they can join.");
    else if (!NET.lobby) note.textContent = L("Looking for friends who are playing…");
    else note.textContent = NET.lobbyTeams.length ? L("Teams playing right now:") : L("No teams playing right now. Make one and share the link with a friend!");
  }

  // Character preview (its own tiny renderer, released when the game starts)
  let previewChar = null, previewScene = null, previewCam = null;
  function startPreview() {
    const cv = $("#preview"); if (!cv) return;
    try {
      ensurePreview();
      previewR.setSize(170, 220, false);
      const el = previewR.domElement; el.className = "preview"; el.id = "preview"; el.setAttribute("aria-label", "Your character");
      cv.replaceWith(el);
      updatePreview();
      cancelAnimationFrame(previewRaf);
      const tick = () => {
        previewRaf = requestAnimationFrame(tick);
        if (!previewChar || !el.isConnected) return;
        const t = performance.now() / 1000; previewChar.rotation.y = Math.sin(t * 0.8) * 0.7;
        animatePerson(previewChar, false, t, { k: "wave", at: Math.floor(t / 5) * 5 });
        previewR.render(previewScene, previewCam);
      };
      tick();
    } catch (e) { cv.hidden = true; }
  }
  function updatePreview() {
    if (!previewScene) return;
    if (previewChar) previewScene.remove(previewChar);
    previewChar = makePerson(draft.look); previewScene.add(previewChar);
  }
  function stopPreview() { cancelAnimationFrame(previewRaf); previewRaf = 0; }

  function enterGame(isNew) {
    screen = "game";
    W.roomIdx = -1; // rebuild the room so its signs use the chosen language
    W.lifting = false;
    app.innerHTML = `
      <div class="bar" id="bar"></div>
      <div class="stage" id="stage">
        <div class="tags"></div>
        <div class="stage-help" id="help">${L("Tap the floor to walk. Tap things to look closer. Tap Marmalade the cat for a clue!")}</div>
        <button class="fishes" id="fishes" type="button"></button>
        <div class="emotes" id="emotes"></div>
      </div>
      <div class="lower">
        <div class="tray" id="tray"></div>
        <div class="tray" id="mates"></div>
      </div>`;
    renderBar(); renderTray(); renderFishes(); renderMates();
    W.help = $("#help");
    $("#fishes").onclick = openFishHelp;
    try { W.petKind = localStorage.getItem(SAVE_KEY + "-pet") || null; } catch (e) {}
    touchStreak();
    try { setupWorld($("#stage")); refreshPlayerLook(); renderEmotes(); }
    catch (e) { $("#stage").innerHTML = `<p class="stage-help">${L("This device couldn't start the 3D view. Try another browser.")}</p>`; }
    if (state.team) { joinTeam(state.team); lobbyPresence(); }
    if (isNew) {
      const teamLine = state.team ? `<p class="say">${L("You're on team <b>{code}</b>. Friends can join from the start screen, or by typing that name. Whatever anyone on your team solves, everyone gets!", { code: esc(state.team) })}</p>` : "";
      openCard(L(ROOMS[curRoom()].name), `<p>${L(ROOMS[curRoom()].intro)}</p>${teamLine}<button class="btn" id="go">${L("Let's go!")}</button>`, b => b.querySelector("#go").onclick = closeCard);
    }
    clearInterval(timerInt);
    timerInt = setInterval(() => { const t = $("#timer"); if (t && state && !state.f.done) t.textContent = `⏱ ${fmt(elapsed())}`; }, 1000);
  }
  function renderBar() {
    const bar = $("#bar"); if (!bar) return;
    const r = curRoom();
    bar.innerHTML = `
      <div class="room-name"><small>${L("World {w}", { w: worldOf(r) + 1 })} · ${L("Room {n} of {t}", { n: r + 1, t: ROOMS.length })} · ${esc(state.name)}</small><h2>${L(ROOMS[r].name)}</h2></div>
      ${X() ? `<span class="pill" id="timer">⏱ ${fmt(elapsed())}</span>` : ""}
      <button class="icon-btn" id="map-btn" aria-label="${L("Journey map")}">🗺️ ${totalStars()}⭐</button>
      <button class="icon-btn${musicOn ? "" : " off"}" id="music" aria-pressed="${musicOn}" aria-label="${L("Music")}">🎵</button>
      <button class="icon-btn${muted ? " off" : ""}" id="mute" aria-pressed="${!muted}" aria-label="${L("Sounds")}">🔊</button>
      ${navigator.vibrate ? `<button class="icon-btn${vibeOn ? "" : " off"}" id="vibe" aria-pressed="${vibeOn}" aria-label="${L("Vibration")}">📳</button>` : ""}
      <button class="icon-btn hint" id="hint">💡 ${L("Hint")}</button>`;
    $("#hint").onclick = showHint;
    $("#map-btn").onclick = openMapCard;
    $("#mute").onclick = () => { muted = !muted; store("-muted", muted ? "1" : "0"); renderBar(); };
    $("#music").onclick = () => { musicOn = !musicOn; store("-music", musicOn ? "1" : "0"); if (musicOn) Music.play(curRoom()); else Music.stop(); renderBar(); };
    const vb = $("#vibe"); if (vb) vb.onclick = () => { vibeOn = !vibeOn; store("-vibe", vibeOn ? "1" : "0"); buzz(60); renderBar(); };
  }
  function renderTray(newKeys = []) {
    const el = $("#tray"); if (!el) return;
    const items = Object.entries(ITEMS).filter(([id, it]) => has(id) && !state.f[it.used]);
    el.innerHTML = `<strong>${L("Backpack")}</strong>` + (items.length ? items.map(([id, it]) => `<button class="item${newKeys.includes(it.flag) ? " new" : ""}" data-item="${id}"><span>${it.icon}</span>${L(it.name)}</button>`).join("") : `<span class="empty">${L("Empty for now. Things you find go here.")}</span>`);
    el.querySelectorAll(".item").forEach(b => b.onclick = () => { const it = ITEMS[b.dataset.item]; openCard(L(it.name), `<div class="big-emoji">${it.icon}</div>${b.dataset.item === "note" ? `<div class="note">${L(it.text)}</div>` : `<p class="say">${L(it.text)}</p>`}`); });
  }
  function renderFishes() { const el = $("#fishes"); if (el) el.textContent = `🐟 ${L("Golden fish {n}/{t}", { n: fishCount(), t: FISH.length })}`; }
  function leaveTeam() {
    if (NET.team) { NET.team.leave().catch(() => {}); NET.team = null; NET.teamName = ""; }
    W.others.forEach(o => { W.scene && W.scene.remove(o.g); o.tag.remove(); o.bubble.remove(); }); W.others.clear(); NET.mates = [];
    if (NET.lobby) NET.lobby.presence({ team: null, name: "" }).catch(() => {});
  }

  function finish(who) {
    closeCard(); Music.stop(); state.elapsed = elapsed(); save(); sfx.win();
    sendPresence(true); lobbyPresence();
    renderWin(who); confetti();
  }
  function renderWin(who) {
    screen = "win";
    clearInterval(timerInt); Music.stop();
    const run = Object.values(state.stars || {}).reduce((a, b) => a + b, 0), max = ROOMS.length * 3;
    const stars = run >= max * 0.8 ? 3 : run >= max * 0.55 ? 2 : 1;
    const praise = ["", L("You never gave up, and that's what real detectives do!"), L("Sharp thinking! You barely needed any help."), L("Wow! A master detective. Professor Marmalade is very impressed.")][stars];
    const names = [state.name, ...NET.mates.map(m => m.name)], fish = fishCount(), allFish = fish === FISH.length;
    const ending = names.length > 1
      ? L("The whole team found Captain Marmalade's treasure at the bottom of the sea! Professor Marmalade named everyone an Official Puzzle Detective.")
      : L("You found Captain Marmalade's treasure at the bottom of the sea! Professor Marmalade named you an Official Puzzle Detective.");
    app.innerHTML = `
      <section class="cert">
        <div style="font-size:64px" aria-hidden="true">${allFish ? "🐱👑" : "🐱🎉"}</div>
        <h1>${L("You escaped!")}</h1>
        <div class="who">${names.map(esc).join(" & ")}</div>
        <div class="stars" aria-label="${stars}/3">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
        <p>${praise} ${ending}</p>
        ${allFish ? `<p class="secret">${L("<b>Secret ending!</b> You found all {t} golden fish. Marmalade was so happy she made you a golden crown and threw a fish party. 👑🐟🎶", { t: FISH.length })}</p>` : `<p>${L("You found {n} of Marmalade's {t} golden fish. Play again to find them all and unlock the secret ending!", { n: fish, t: FISH.length })}</p>`}
        <div class="stats"><span>⭐ ${run}/${max}</span><span>⏱ ${fmt(state.elapsed)}</span><span>💡 ${state.hints}</span><span>🐟 ${fish}/${FISH.length}</span></div>
        <p>${L("Play again to earn more stars and unlock prizes. Try Expert level for a bigger challenge!")}</p>
        <div class="btn-row" style="justify-content:center"><button class="btn" id="again">${L("Play again")}</button><button class="btn ghost-ink" id="prizes2">🗺️ ${L("Prizes")}</button></div>
      </section>`;
    $("#again").onclick = () => { leaveTeam(); clearSave(); draft = { name: state.name, look: state.look.slice(), level: state.level }; state = null; W.roomIdx = -1; renderStart(); };
    $("#prizes2").onclick = openMapCard;
  }

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"); c.className = "confetti"; document.body.append(c);
    const ctx = c.getContext("2d"), Wd = c.width = innerWidth, H = c.height = innerHeight;
    const cols = ["#f39a2b", "#4fc59a", "#e2536b", "#f7d23e", "#9a5ae0", "#3f8ef0"];
    const bits = Array.from({ length: 160 }, () => ({ x: Math.random() * Wd, y: -Math.random() * H, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, s: 6 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
    let frames = 0;
    (function step() {
      ctx.clearRect(0, 0, Wd, H);
      bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.r += 0.1; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
      if (++frames < 280) requestAnimationFrame(step); else c.remove();
    })();
  }

  // ---------- boot ----------
  window.claude?.hot?.snapshot?.(() => { if (state) state.elapsed = elapsed(); return { state, screen }; });
  const boot = async data => {
    if (!T) { app.innerHTML = `<p>${L("The 3D engine didn't load. Check your connection and reload the page.")}</p>`; return; }
    try { await Promise.race([document.fonts.load('800 40px "Grandstander"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
    if (data && data.state && data.screen === "game") { state = data.state; tickStart = Date.now(); enterGame(false); }
    else render();
    initNet();
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
