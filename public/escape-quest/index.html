<title>Escape Quest</title>

<style>
/* Layout: a lit 3D diorama of each room (the "stage") under a slim top bar, with the team and backpack below; puzzles open as close-up cards. */
/* Single deliberate look: a night-time storybook, marmalade orange as the one bold accent. */
:root {
  color-scheme: dark;
  --night: #1d1934;
  --night-2: #2a2450;
  --paper: #fff4e0;
  --ink: #2b2140;
  --ink-soft: #6a5c80;
  --marmalade: #f39a2b;
  --marmalade-deep: #c96a0c;
  --mint: #4fc59a;
  --berry: #e2536b;
  --muted: #b9b0d6;
  --display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, var(--night-2), var(--night));
  background-color: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--marmalade); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }

/* ---------- start screen ---------- */
.hero { display: grid; gap: 14px; padding-block: 8px; }
.hero .kicker { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--marmalade); }
.hero h1 { font-size: clamp(40px, 9vw, 72px); font-weight: 800; }
.hero h1 span { color: var(--marmalade); }
.hero p { margin: 0; color: var(--muted); font-size: 17px; max-width: 60ch; }
.panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 720px) { .panels { grid-template-columns: minmax(0, 1fr); } }
.panel { background: rgba(255,255,255,.06); border-radius: 22px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-size: 24px; }
.panel h2 small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--marmalade); font-weight: 800; margin-bottom: 4px; }
.maker { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 420px) { .maker { grid-template-columns: minmax(0, 1fr); } }
.preview { width: 170px; height: 220px; max-width: 100%; border-radius: 18px; background: radial-gradient(circle at 50% 35%, #3d356b, #1d1934 75%); justify-self: center; display: block; }
.opts { display: grid; gap: 10px; min-width: 0; }
.opt-row { display: grid; gap: 4px; }
.opt-row > span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); padding: 0; }
.sw.on { border-color: var(--paper); }
.chip-btn { border: 0; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; background: rgba(255,255,255,.1); }
.chip-btn.on { background: var(--paper); color: var(--ink); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 800; font-size: 14px; }
.field input { font: inherit; font-size: 19px; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--marmalade); background: var(--paper); color: var(--ink); width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font-family: var(--display); font-weight: 800; font-size: 19px;
  padding: 11px 20px; border-radius: 16px; border: 0;
  background: var(--marmalade); color: var(--ink);
  box-shadow: 0 5px 0 var(--marmalade-deep);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--marmalade-deep); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 3px rgba(255,255,255,.3); }
.btn.mint { background: var(--mint); box-shadow: 0 5px 0 #2f8f6b; }
.teams { display: grid; gap: 8px; }
.team-row { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 8px 10px; }
.team-row div { flex: 1; min-width: 0; }
.team-row b { font-family: var(--display); font-size: 17px; }
.team-row small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-line { font-size: 14px; color: var(--muted); margin: 0; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; font-weight: 800; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.15); }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.bar .room-name { flex: 1 1 200px; min-width: 0; }
.bar .room-name small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--marmalade); font-weight: 800; }
.bar .room-name h2 { font-size: 26px; }
.pill { background: rgba(255,255,255,.08); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.icon-btn { background: rgba(255,255,255,.08); border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 15px; }
.icon-btn.hint { background: var(--mint); color: var(--ink); }

/* ---------- the 3D stage ---------- */
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.35); touch-action: manipulation; }
@media (max-width: 600px) { .stage { aspect-ratio: 4 / 5; } }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; font-size: 12px; font-weight: 800; background: rgba(29,25,52,.82); color: var(--paper); padding: 2px 9px; border-radius: 999px; white-space: nowrap; will-change: transform; }
.tag.done::after { content: " ✓"; color: var(--mint); }
.tag.person { pointer-events: none; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 13px; }
.tag.person.me { background: var(--marmalade); }
.bubble { position: absolute; left: 0; top: 0; pointer-events: none; font-size: 30px; will-change: transform; }
.stage-help { position: absolute; left: 12px; top: 12px; background: rgba(29,25,52,.82); padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; max-width: calc(100% - 24px); pointer-events: none; }
.emotes { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.emotes button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(29,25,52,.82); font-size: 22px; }
.fishes { position: absolute; left: 10px; bottom: 10px; background: rgba(29,25,52,.82); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 800; }

/* ---------- team + backpack ---------- */
.lower { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 720px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.tray { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: rgba(255,255,255,.06); border-radius: 18px; padding: 10px 14px; min-height: 60px; min-width: 0; }
.tray > strong { font-family: var(--display); font-size: 15px; color: var(--muted); margin-right: 4px; }
.tray .empty { color: var(--muted); font-size: 14px; }
.item { display: flex; align-items: center; gap: 6px; background: var(--paper); color: var(--ink); border: 0; border-radius: 12px; padding: 5px 12px 5px 8px; font-weight: 800; font-size: 14px; }
.item span { font-size: 22px; line-height: 1; }
.item.new { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.mate { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px 10px 3px 4px; font-weight: 800; font-size: 14px; }
.mate i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }

/* ---------- close-up card ---------- */
.overlay { position: fixed; inset: 0; background: rgba(12,10,26,.72); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--paper); color: var(--ink); width: 100%; max-width: 540px; max-height: 100%; overflow: auto; border-radius: 24px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 10px 0 rgba(0,0,0,.25); }
.card-head { display: flex; align-items: start; gap: 10px; }
.card-head h3 { flex: 1; font-size: 26px; color: var(--ink); }
.close { border: 0; background: #f0e2c6; color: var(--ink); border-radius: 999px; width: 40px; height: 40px; font-size: 20px; font-weight: 800; flex: none; }
.card p { margin: 0; }
.card .say { background: #f6e6c6; border-radius: 14px; padding: 10px 14px; color: var(--ink); }
.card .btn { justify-self: start; }
.big-emoji { font-size: 84px; text-align: center; line-height: 1.1; }
.note { background: #fffdf6; border: 2px dashed #d7bf8f; border-radius: 6px; padding: 14px; font-family: var(--display); font-size: 19px; color: var(--ink); transform: rotate(-1deg); }
.board { background: #2f5d46; border: 10px solid #a8743f; border-radius: 8px; padding: 16px; color: #f4f1de; font-family: var(--display); font-size: 26px; display: grid; gap: 6px; text-align: center; }
.board .code { margin-top: 8px; font-size: 18px; color: #ffe08a; }
.board .code b { font-size: 30px; }
.shake { animation: shake .35s ease; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.lock { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: #3b3156; padding: 14px; border-radius: 18px; }
.wheel { display: grid; gap: 4px; justify-items: center; }
.wheel button { width: 48px; height: 34px; border: 0; border-radius: 10px; background: #5b4f80; color: var(--paper); font-size: 16px; font-weight: 800; }
.wheel output { width: 48px; height: 56px; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 32px; font-weight: 800; border-radius: 10px; font-variant-numeric: tabular-nums; }
.letters input { width: min(48px, 10.5vw); height: 58px; text-align: center; font-family: var(--display); font-size: 30px; font-weight: 800; text-transform: uppercase; border: 0; border-radius: 10px; background: var(--paper); color: var(--ink); }
.shelf { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 16px 8px 10px; background: linear-gradient(to bottom, transparent 82%, #a8743f 82%); border-radius: 12px; }
.bottle { width: 48px; height: 90px; border: 0; padding: 0; background: none; position: relative; }
.bottle::before { content: ""; position: absolute; left: 34%; top: 0; width: 32%; height: 24%; background: #e8e0f0; border-radius: 4px 4px 0 0; box-shadow: inset 0 3px 0 #8b6a4a; }
.bottle i { position: absolute; left: 0; right: 0; bottom: 0; height: 78%; border-radius: 20px 20px 14px 14px; background: var(--c); box-shadow: inset -6px -6px 0 rgba(0,0,0,.15), inset 6px 6px 0 rgba(255,255,255,.35); }
.bottle.poured i { opacity: .25; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: #e6d6b6; }
.dots i.on { background: var(--mint); }
.flowers svg { width: 100%; height: auto; background: linear-gradient(#d9f2ff, #eefaff); border-radius: 14px; }
.sign { background: #a8743f; color: #fff4e0; font-family: var(--display); font-size: 18px; padding: 10px 14px; border-radius: 8px; text-align: center; }
.birds { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 12px 6px 18px; background: linear-gradient(to bottom, transparent 70%, #8b5a2b 70% 74%, transparent 74%); border-radius: 12px; }
.bird { display: grid; justify-items: center; width: 60px; }
.bird .b { font-size: 40px; line-height: 1; }
.bird .letter { font-family: var(--display); font-size: 26px; font-weight: 800; background: #fff; border: 3px solid var(--ink); border-radius: 10px; width: 40px; text-align: center; margin-top: -4px; }
.bird .feet { font-size: 7px; color: #b9ad98; margin-top: 6px; letter-spacing: .1em; font-weight: 800; }
.bird .feet.big { font-size: 22px; color: var(--berry); font-family: var(--display); }
.scope { width: min(300px, 100%); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: 12px solid #3b3156; background:
  radial-gradient(2px 2px at 20% 30%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 70% 20%, #fff 50%, transparent 52%),
  radial-gradient(2px 2px at 80% 75%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 35% 80%, #fff 50%, transparent 52%),
  radial-gradient(circle, #1a1f5a, #070921);
  display: flex; justify-content: space-around; align-items: center; font-size: 46px; padding: 0 10px; }
.dials { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.dial { width: 82px; height: 82px; border-radius: 50%; border: 6px solid #5d6788; background: #1d1934; font-size: 40px; display: grid; place-items: center; }
.dial-lbl { display: flex; justify-content: center; gap: 12px; font-size: 12px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .1em; }
.dial-lbl span { width: 82px; text-align: center; }

.map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #f4e2b8; border: 4px solid #a8743f; border-radius: 10px; padding: 8px; width: 100%; max-width: 320px; margin: 0 auto; }
.map span { aspect-ratio: 1; display: grid; place-items: center; font-size: clamp(22px, 7vw, 34px); background: rgba(168,116,63,.12); border-radius: 6px; }
.pics, .bags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pics button { width: 60px; height: 60px; border: 0; border-radius: 14px; background: #f0e2c6; font-size: 32px; }
.bag { width: 72px; height: 72px; border: 3px solid transparent; border-radius: 40% 40% 30% 30%; background: #d9c49a; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 18px; transition: transform .1s; }
.bag.on { border-color: var(--mint); background: #bfe8d4; transform: translateY(-4px); }
.total { text-align: center; font-family: var(--display); font-size: 22px; font-weight: 800; }
.lamps { display: flex; justify-content: center; gap: 14px; font-size: 44px; }
.lamp { filter: grayscale(1) brightness(.45); transition: filter .2s; }
.lamp.on { filter: drop-shadow(0 0 10px #ffd27a); }
.keys { display: flex; gap: 6px; justify-content: center; }
.pkey { width: 52px; height: 130px; border: 0; border-radius: 0 0 12px 12px; background: var(--c); box-shadow: inset 0 -10px 0 rgba(0,0,0,.2); }
.pkey.hit { transform: translateY(4px); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.notes { display: flex; gap: 10px; justify-content: center; }
.notes i { width: 34px; height: 34px; border-radius: 50%; background: #e6d6b6; }
.notes i.on { animation: pop .3s ease; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); font-weight: 800; padding: 10px 18px; border-radius: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.25); z-index: 30; max-width: calc(100% - 32px); text-align: center; }

.cert { background: var(--paper); color: var(--ink); border-radius: 26px; padding: 26px 22px; display: grid; gap: 14px; text-align: center; justify-items: center; border: 6px double var(--marmalade); }
.cert h1 { font-size: clamp(32px, 7vw, 54px); color: var(--ink); }
.cert .who { font-family: var(--display); font-size: clamp(26px, 6vw, 40px); color: var(--marmalade-deep); }
.cert .stars { font-size: 44px; letter-spacing: 6px; }
.cert .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cert .stats span { background: #f6e6c6; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cert p { margin: 0; max-width: 48ch; color: var(--ink-soft); }
.cert .secret { background: #fff0c2; border: 3px dashed #e0b23a; border-radius: 16px; padding: 12px 16px; color: var(--ink); max-width: 48ch; }
canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

</head>

ème de maths. Si deux poissons font 6, combien vaut un poisson ?", "A lousa tem um desafio de matemática. Se dois peixes dão 6, quanto vale um peixe?"], "One fish is 3 and one cheese is 4. The code reads fish, cheese, fish.": ["Un poisson vaut 3 et un fromage vaut 4. Le code se lit poisson, fromage, poisson.", "Um peixe vale 3 e um queijo vale 4. O código é peixe, queijo, peixe."], "The drawer code is 3 4 3.": ["Le code du tiroir est 3 4 3.", "O código da gaveta é 3 4 3."], "The note from the drawer tells you how to pour the potions. What are the colors of a rainbow?": ["La note du tiroir explique comment verser les potions. Quelles sont les couleurs de l'arc-en-ciel ?", "O bilhete da gaveta explica como despejar as poções. Quais são as cores do arco-íris?"], "Rainbow order is red, orange, yellow, green, blue, purple. But one of those was spilled on the floor!": ["L'ordre de l'arc-en-ciel : rouge, orange, jaune, vert, bleu, violet. Mais l'une d'elles a été renversée par terre !", "A ordem do arco-íris é vermelho, laranja, amarelo, verde, azul, roxo. Mas uma delas foi derramada no chão!"], "Tap red, orange, yellow, blue, then purple.": ["Touche rouge, orange, jaune, bleu, puis violet.", "Toque vermelho, laranja, amarelo, azul e depois roxo."], "You have the brass key! Walk to the door.": ["Tu as la clé en laiton ! Va jusqu'à la porte.", "Você tem a chave de latão! Vá até a porta."], "Count the petals on each flower. The wooden sign tells you which flower comes first.": ["Compte les pétales de chaque fleur. Le panneau en bois dit quelle fleur vient en premier.", "Conte as pétalas de cada flor. A placa de madeira diz qual flor vem primeiro."], "Start with the shortest flower and finish with the tallest one.": ["Commence par la fleur la plus petite et termine par la plus grande.", "Comece pela flor mais baixa e termine na mais alta."], "The shed code is 3 5 6 8.": ["Le code de la cabane est 3 5 6 8.", "O código do galpão é 3 5 6 8."], "The birds are holding letters. Is something written on their feet?": ["Les oiseaux tiennent des lettres. Y a-t-il quelque chose d'écrit sur leurs pattes ?", "Os passarinhos seguram letras. Tem algo escrito nos pezinhos deles?"], "With the magnifying glass you can read numbers. Put the letters in number order, starting with 1.": ["Avec la loupe, tu peux lire des numéros. Range les lettres dans l'ordre des numéros, en commençant par 1.", "Com a lupa dá para ler números. Coloque as letras na ordem dos números, começando pelo 1."], "The gate word is TULIP.": ["Le mot du portail est TULIPE.", "A palavra do portão é TULIPA."], "Read the scroll on the desk, then type the answer into the chest.": ["Lis le parchemin sur le bureau, puis écris la réponse sur le coffre.", "Leia o pergaminho na mesa e escreva a resposta no baú."], "It hangs on the wall and tells you what time it is.": ["Elle est accrochée au mur et elle donne l'heure.", "Ele fica pendurado na parede e mostra as horas."], "The answer is CLOCK.": ["La réponse est HORLOGE.", "A resposta é RELÓGIO."], "Put the lens in the telescope and look at the sky.": ["Mets la lentille dans le télescope et regarde le ciel.", "Coloque a lente no telescópio e olhe o céu."], "Set the machine's dials to match the telescope: left, middle, right.": ["Règle les cadrans de la machine comme dans le télescope : gauche, milieu, droite.", "Gire os botões da máquina igual ao telescópio: esquerda, meio, direita."], "Planet, moon, comet.": ["Planète, lune, comète.", "Planeta, lua, cometa."], "Use your star key on the big round door!": ["Utilise ta clé étoile sur la grande porte ronde !", "Use sua chave-estrela na grande porta redonda!"], "Open the lock": ["Ouvrir le cadenas", "Abrir o cadeado"], "Not quite. Try another code!": ["Pas tout à fait. Essaie un autre code !", "Quase! Tente outro código!"], "Hmm, that word doesn't open it.": ["Hum, ce mot ne l'ouvre pas.", "Hum, essa palavra não abre."], "Yuck! Green makes everything sticky. Start again.": ["Beurk ! Le vert colle partout. Recommence.", "Eca! O verde deixa tudo grudento. Comece de novo."], "Fizzle! Wrong order. The potions bubbled back up.": ["Pschitt ! Mauvais ordre. Les potions sont remontées.", "Pssst! Ordem errada. As poções borbulharam de volta."], "Clunk. The machine shakes its gears. That's not tonight's sky.": ["Clonk. La machine secoue ses engrenages. Ce n'est pas le ciel de ce soir.", "Clonc. A máquina sacode as engrenagens. Esse não é o céu de hoje."], "Team play only works when the game is open on claude.ai. You can still play alone!": ["Le jeu en équipe marche seulement quand le jeu est ouvert sur claude.ai. Tu peux quand même jouer en solo !", "Jogar em equipe só funciona com o jogo aberto no claude.ai. Você ainda pode jogar solo!"], "Couldn't reach your team right now. Keep playing, it will catch up.": ["Impossible de joindre ton équipe pour l'instant. Continue, ça va se rattraper.", "Não deu para falar com sua equipe agora. Continue jogando, já já sincroniza."], "You found: {item}!": ["Tu as trouvé : {item} !", "Você encontrou: {item}!"], "{who} found: {item}!": ["{who} a trouvé : {item} !", "{who} encontrou: {item}!"], "{who} solved a puzzle!": ["{who} a résolu une énigme !", "{who} resolveu um enigma!"], "{who} opened the way! Everyone hurries through.": ["{who} a ouvert le passage ! Tout le monde se dépêche de passer.", "{who} abriu a passagem! Todo mundo corre para passar."], "The brass key turns with a click. The door swings open!": ["La clé en laiton tourne, clic ! La porte s'ouvre.", "A chave de latão gira com um clique. A porta se abre!"], "The lock pops open and the gate creaks wide!": ["Le cadenas s'ouvre et le portail grince en s'ouvrant !", "O cadeado abre e o portão range ao se abrir!"], "Look around": ["Regarder autour", "Olhar em volta"], "Chalkboard": ["Tableau noir", "Lousa"], "Painting": ["Portrait", "Retrato"], "Potion machine": ["Machine à potions", "Máquina de poções"], "Door": ["Porte", "Porta"], "Desk drawer": ["Tiroir du bureau", "Gaveta da mesa"], "Puddle": ["Flaque", "Poça"], "Garden shed": ["Cabane de jardin", "Galpão"], "Birds on a wire": ["Oiseaux sur un fil", "Passarinhos no fio"], "Flower bed": ["Parterre de fleurs", "Canteiro de flores"], "Frog": ["Grenouille", "Sapo"], "Gate": ["Portail", "Portão"], "Scroll": ["Parchemin", "Pergaminho"], "Treasure chest": ["Coffre au trésor", "Baú do tesouro"], "Telescope": ["Télescope", "Telescópio"], "Star machine": ["Machine à étoiles", "Máquina de estrelas"], "Round door": ["Porte ronde", "Porta redonda"], "Professor Marmalade": ["Professeure Marmelade", "Professora Marmelada"], "\"Mrrrow! Hello, {name}! Here's a little clue: <b>{clue}</b>\"": ["« Miaaou ! Bonjour, {name} ! Voici un petit indice : <b>{clue}</b> »", "“Miaau! Olá, {name}! Aqui vai uma pistinha: <b>{clue}</b>”"], "Need a bigger clue? Press the Hint button at the top.": ["Besoin d'un plus gros indice ? Appuie sur le bouton Indice en haut.", "Precisa de uma pista maior? Aperte o botão Dica lá em cima."], "The chalkboard": ["Le tableau noir", "A lousa"], "Drawer code:": ["Code du tiroir :", "Código da gaveta:"], "Drawer:": ["Tiroir :", "Gaveta:"], "Professor Marmalade's handwriting! Each picture stands for a number.": ["L'écriture de la professeure Marmelade ! Chaque dessin vaut un nombre.", "A letra da Professora Marmelada! Cada desenho vale um número."], "A painting": ["Un portrait", "Um retrato"], "\"Professor Marmalade, Inventor.\" A tiny tag on the frame says: <b>Green potions make everything sticky. Never use them!</b>": ["« Professeure Marmelade, inventrice. » Une petite étiquette sur le cadre dit : <b>Les potions vertes collent partout. Ne jamais les utiliser !</b>", "“Professora Marmelada, inventora.” Uma etiquetinha na moldura diz: <b>Poções verdes deixam tudo grudento. Nunca use!</b>"], "A sticky puddle": ["Une flaque collante", "Uma poça grudenta"], "A bright <b>green</b> puddle and a broken bottle. Marmalade must have knocked over a potion. Sticky paw prints lead under the desk...": ["Une flaque <b>verte</b> toute brillante et une bouteille cassée. Marmelade a dû renverser une potion. Des traces de pattes collantes mènent sous le bureau...", "Uma poça <b>verde</b> brilhante e um frasco quebrado. A Marmelada deve ter derrubado uma poção. Pegadas grudentas levam para debaixo da mesa..."], "A chatty frog": ["Une grenouille bavarde", "Um sapo tagarela"], "\"Ribbit! Little things need big eyes. Ribbit! And I always count my flowers from the <b>smallest</b> to the <b>biggest</b>.\"": ["« Croâ ! Les petites choses demandent de grands yeux. Croâ ! Et je compte toujours mes fleurs de la plus <b>petite</b> à la plus <b>grande</b>. »", "“Croac! Coisas pequenas pedem olhos grandes. Croac! E eu sempre conto minhas flores da <b>menor</b> para a <b>maior</b>.”"], "A rolled-up scroll": ["Un parchemin roulé", "Um pergaminho enrolado"], "I have a face and two hands,<br>but no arms and no legs.<br>I tick all day and tock all night.<br><br>What am I?": ["J'ai un visage et deux aiguilles,<br>mais ni bras ni jambes.<br>Je fais tic le jour et tac la nuit.<br><br>Qui suis-je ?", "Tenho um rosto e dois ponteiros,<br>mas nem braços nem pernas.<br>Faço tique o dia todo e taque a noite toda.<br><br>Quem sou eu?"], "What am I?": ["Qui suis-je ?", "Quem sou eu?"], "At the bottom: <b>\"Say the answer to my treasure chest.\"</b>": ["En bas : <b>« Dis la réponse à mon coffre au trésor. »</b>", "Lá embaixo: <b>“Diga a resposta para o meu baú do tesouro.”</b>"], "The desk drawer": ["Le tiroir du bureau", "A gaveta da mesa"], "The note is in your backpack now.": ["La note est dans ton sac à dos maintenant.", "O bilhete está na sua mochila agora."], "The drawer has a lock with <b>3 numbers</b>.": ["Le tiroir a un cadenas à <b>3 chiffres</b>.", "A gaveta tem um cadeado de <b>3 números</b>."], "The potion machine": ["La machine à potions", "A máquina de poções"], "The machine is snoozing. It already gave out the brass key.": ["La machine fait la sieste. Elle a déjà donné la clé en laiton.", "A máquina está cochilando. Ela já deu a chave de latão."], "Six potions sit above a funnel. A label says: <b>Pour 5 potions in the right order and I'll give you a prize.</b>": ["Six potions attendent au-dessus d'un entonnoir. Une étiquette dit : <b>Verse 5 potions dans le bon ordre et je te donnerai un cadeau.</b>", "Seis poções estão em cima de um funil. Uma etiqueta diz: <b>Despeje 5 poções na ordem certa e eu te dou um prêmio.</b>"], "The door": ["La porte", "A porta"], "Locked tight! There's a tiny keyhole, just right for a little <b>brass key</b>.": ["Fermée à double tour ! Il y a une toute petite serrure, juste pour une petite <b>clé en laiton</b>.", "Bem trancada! Tem uma fechadurinha, do tamanho certo para uma pequena <b>chave de latão</b>."], "The flower bed": ["Le parterre de fleurs", "O canteiro de flores"], "Count my petals!<br>Shortest flower first, tallest flower last.": ["Compte mes pétales !<br>La plus petite fleur d'abord, la plus grande à la fin.", "Conte minhas pétalas!<br>A flor mais baixa primeiro, a mais alta por último."], "The garden shed": ["La cabane de jardin", "O galpão do jardim"], "Just some garden gloves and an empty pot now.": ["Il ne reste que des gants de jardin et un pot vide.", "Agora só sobraram luvas de jardim e um vaso vazio."], "A padlock with <b>4 numbers</b>. Someone scratched a flower 🌸 on it.": ["Un cadenas à <b>4 chiffres</b>. Quelqu'un a gravé une fleur 🌸 dessus.", "Um cadeado de <b>4 números</b>. Alguém riscou uma flor 🌸 nele."], "You look through the magnifying glass. There are <b>numbers</b> on their feet!": ["Tu regardes avec la loupe. Il y a des <b>numéros</b> sur leurs pattes !", "Você olha com a lupa. Tem <b>números</b> nos pezinhos deles!"], "Each bird is holding a letter. Something tiny is written on their feet, but it's way too small to read.": ["Chaque oiseau tient une lettre. Quelque chose de minuscule est écrit sur leurs pattes, mais c'est bien trop petit pour être lu.", "Cada passarinho segura uma letra. Tem algo minúsculo escrito nos pezinhos, mas é pequeno demais para ler."], "The garden gate": ["Le portail du jardin", "O portão do jardim"], "The gate's lock wants a <b>{n}-letter word</b>.": ["Le cadenas du portail veut un <b>mot de {n} lettres</b>.", "O cadeado do portão pede uma <b>palavra de {n} letras</b>."], "The treasure chest": ["Le coffre au trésor", "O baú do tesouro"], "Empty now. The lens is already out.": ["Vide maintenant. La lentille a déjà été prise.", "Vazio agora. A lente já foi pega."], "The chest has a lock with <b>{n} letters</b>.": ["Le coffre a un cadenas à <b>{n} lettres</b>.", "O baú tem um cadeado de <b>{n} letras</b>."], "The telescope": ["Le télescope", "O telescópio"], "You peek in... everything is blurry! The <b>lens</b> is missing.": ["Tu regardes dedans... tout est flou ! Il manque la <b>lentille</b>.", "Você espia... está tudo borrado! Falta a <b>lente</b>."], "Through the telescope": ["Dans le télescope", "Pelo telescópio"], "You click the lens into place. Three things shine in the sky, from <b>left</b> to <b>right</b>.": ["Tu mets la lentille en place. Trois choses brillent dans le ciel, de <b>gauche</b> à <b>droite</b>.", "Você encaixa a lente. Três coisas brilham no céu, da <b>esquerda</b> para a <b>direita</b>."], "The star machine": ["La machine à étoiles", "A máquina de estrelas"], "The machine is resting. It already made the star key.": ["La machine se repose. Elle a déjà fabriqué la clé étoile.", "A máquina está descansando. Ela já fez a chave-estrela."], "Three dials and a big lever. A label says: <b>Show me tonight's sky.</b> Tap a dial to turn it.": ["Trois cadrans et un gros levier. Une étiquette dit : <b>Montre-moi le ciel de ce soir.</b> Touche un cadran pour le tourner.", "Três botões giratórios e uma alavanca grande. Uma etiqueta diz: <b>Mostre o céu desta noite.</b> Toque num botão para girar."], "Left": ["Gauche", "Esquerda"], "Middle": ["Milieu", "Meio"], "Right": ["Droite", "Direita"], "Pull the lever": ["Tirer le levier", "Puxar a alavanca"], "The round door": ["La porte ronde", "A porta redonda"], "A big round door with a <b>star-shaped</b> keyhole in the middle.": ["Une grande porte ronde avec une serrure en forme d'<b>étoile</b> au milieu.", "Uma grande porta redonda com uma fechadura em forma de <b>estrela</b> no meio."], "Hint {i} of {n}": ["Indice {i} sur {n}", "Dica {i} de {n}"], "Professor Marmalade's voice echoes from somewhere: <b>\"{hint}\"</b>": ["La voix de la professeure Marmelade résonne quelque part : <b>« {hint} »</b>", "A voz da Professora Marmelada ecoa de algum lugar: <b>“{hint}”</b>"], "Still stuck? Ask again for a bigger hint.": ["Besoin de plus d'aide ? Redemande pour un plus gros indice.", "Ainda com dúvida? Peça de novo para uma dica maior."], "Step 1": ["Étape 1", "Passo 1"], "Make your detective": ["Crée ton détective", "Crie seu detetive"], "Your name": ["Ton prénom", "Seu nome"], "Type your name": ["Écris ton prénom", "Digite seu nome"], "Skin": ["Peau", "Pele"], "Hair": ["Cheveux", "Cabelo"], "Hairstyle": ["Coiffure", "Penteado"], "Shirt": ["T-shirt", "Camiseta"], "Pants": ["Pantalon", "Calça"], "Extra": ["Accessoire", "Acessório"], "Short": ["Courts", "Curto"], "Long": ["Longs", "Comprido"], "Ponytail": ["Queue de cheval", "Rabo de cavalo"], "Buns": ["Chignons", "Coques"], "None": ["Aucun", "Nenhum"], "Glasses": ["Lunettes", "Óculos"], "Bow": ["Nœud", "Laço"], "Cap": ["Casquette", "Boné"], "Surprise me": ["Surprends-moi", "Me surpreenda"], "Step 2": ["Étape 2", "Passo 2"], "Who's playing?": ["Qui joue ?", "Quem vai jogar?"], "Play alone": ["Jouer en solo", "Jogar solo"], "Keep playing ({room})": ["Continuer ({room})", "Continuar ({room})"], "or play as a team": ["ou joue en équipe", "ou jogue em equipe"], "Make a team": ["Créer une équipe", "Criar uma equipe"], "Join a friend's team": ["Rejoindre l'équipe d'un ami", "Entrar na equipe de um amigo"], "e.g. FROG-27": ["ex. FROG-27", "ex. FROG-27"], "Join": ["Rejoindre", "Entrar"], "Type the team name your friend sees, like FROG-27.": ["Écris le nom d'équipe que voit ton ami, comme FROG-27.", "Digite o nome da equipe que seu amigo vê, tipo FROG-27."], "Team play works when the game is open on claude.ai with friends it's shared with. You can still play alone here.": ["Le jeu en équipe marche quand le jeu est ouvert sur claude.ai et partagé avec tes amis. Ici, tu peux jouer en solo.", "Jogar em equipe funciona quando o jogo está aberto no claude.ai e compartilhado com seus amigos. Aqui você pode jogar solo."], "Looking for friends who are playing…": ["Recherche d'amis en train de jouer…", "Procurando amigos jogando…"], "Teams playing right now:": ["Équipes en train de jouer :", "Equipes jogando agora:"], "No teams playing right now. Make one and share the link with a friend!": ["Aucune équipe ne joue en ce moment. Crée-en une et partage le lien avec un ami !", "Nenhuma equipe jogando agora. Crie uma e mande o link para um amigo!"], "Tap the floor to walk. Tap things to look closer. Tap Marmalade the cat for a clue!": ["Touche le sol pour marcher. Touche les objets pour les voir de près. Touche Marmelade la chatte pour un indice !", "Toque no chão para andar. Toque nas coisas para ver de perto. Toque na gata Marmelada para ganhar uma pista!"], "Exit": ["Quitter", "Sair"], "Hint": ["Indice", "Dica"], "Backpack": ["Sac à dos", "Mochila"], "Empty for now. Things you find go here.": ["Vide pour l'instant. Ce que tu trouves arrive ici.", "Vazia por enquanto. O que você achar aparece aqui."], "Team": ["Équipe", "Equipe"], "Playing alone. Start a new game to make a team.": ["Tu joues en solo. Lance une nouvelle partie pour créer une équipe.", "Jogando solo. Comece um jogo novo para criar uma equipe."], "Team {code}": ["Équipe {code}", "Equipe {code}"], "(you)": ["(toi)", "(você)"], "Tell friends the team name {code} so they can join.": ["Donne le nom d'équipe {code} à tes amis pour qu'ils te rejoignent.", "Conte o nome da equipe {code} para seus amigos entrarem."], "Team play works on claude.ai.": ["Le jeu en équipe marche sur claude.ai.", "Jogar em equipe funciona no claude.ai."], "Connecting…": ["Connexion…", "Conectando…"], "You're on team <b>{code}</b>. Friends can join from the start screen, or by typing that name. Whatever anyone on your team solves, everyone gets!": ["Tu es dans l'équipe <b>{code}</b>. Tes amis peuvent la rejoindre depuis l'écran d'accueil ou en tapant ce nom. Tout ce qu'un membre de l'équipe résout compte pour tout le monde !", "Você está na equipe <b>{code}</b>. Seus amigos podem entrar pela tela inicial ou digitando esse nome. Tudo o que alguém da equipe resolver vale para todos!"], "Let's go!": ["C'est parti !", "Vamos lá!"], "This device couldn't start the 3D view. Try another browser.": ["Cet appareil n'a pas pu lancer la 3D. Essaie un autre navigateur.", "Este aparelho não conseguiu abrir o 3D. Tente outro navegador."], "You escaped!": ["Évasion réussie !", "Você escapou!"], "You never gave up, and that's what real detectives do!": ["Tu n'as jamais abandonné, et c'est ce que font les vrais détectives !", "Você nunca desistiu, e é isso que os detetives de verdade fazem!"], "Sharp thinking! You barely needed any help.": ["Bien réfléchi ! Tu n'as presque pas eu besoin d'aide.", "Que raciocínio! Você quase não precisou de ajuda."], "Wow! A master detective. Professor Marmalade is very impressed.": ["Waouh ! Un vrai pro de l'enquête. La professeure Marmelade est très impressionnée.", "Uau! Nível mestre de detetive. A Professora Marmelada ficou muito impressionada."], "Play again": ["Rejouer", "Jogar de novo"], "The 3D engine didn't load. Check your connection and reload the page.": ["Le moteur 3D n'a pas chargé. Vérifie ta connexion et recharge la page.", "O motor 3D não carregou. Confira sua conexão e recarregue a página."], "Professor Marmalade's house": ["La maison de la professeure Marmelade", "A casa da Professora Marmelada"], "Choose your language": ["Choisis ta langue", "Escolha seu idioma"], "Professor Marmalade is a very clever cat. She invited you to see her inventions, then the door clicked shut behind you! Tap the floor to walk. Tap anything that looks interesting. Psst: Marmalade also lost six golden fish somewhere in her house.": ["La professeure Marmelade est une chatte très maligne. Elle t'a montré ses inventions, puis clic ! la porte s'est fermée derrière toi. Touche le sol pour marcher. Touche tout ce qui a l'air intéressant. Psst : Marmelade a aussi perdu six poissons dorés quelque part dans sa maison.", "A Professora Marmelada é uma gata muito esperta. Ela te mostrou suas invenções e, clique! a porta se fechou atrás de você. Toque no chão para andar. Toque em tudo que parecer interessante. Psiu: a Marmelada também perdeu seis peixinhos dourados em algum lugar da casa."], "You found a golden fish! ({n} of 6)": ["Tu as trouvé un poisson doré ! ({n} sur 6)", "Você achou um peixinho dourado! ({n} de 6)"], "{who} found a golden fish! ({n} of 6)": ["{who} a trouvé un poisson doré ! ({n} sur 6)", "{who} achou um peixinho dourado! ({n} de 6)"], "Golden fish {n}/6": ["Poissons dorés {n}/6", "Peixinhos dourados {n}/6"], "Room {n} of 6": ["Salle {n} sur 6", "Sala {n} de 6"], "A 3D escape room · 6 rooms · play alone or with friends": ["Un escape game en 3D · 6 salles · en solo ou entre amis", "Um escape room em 3D · 6 salas · solo ou com amigos"], "Professor Marmalade is a very clever cat who invents all sorts of things. You came to visit, but the door locked behind you! Walk around her house, find clues, crack codes and open six locked rooms. Bring your friends and solve it together.": ["La professeure Marmelade est une chatte très maligne qui invente plein de choses. Pendant ta visite, la porte s'est fermée derrière toi ! Promène-toi dans sa maison, trouve des indices, déchiffre des codes et ouvre six salles fermées à clé. Invite tes amis pour jouer ensemble.", "A Professora Marmelada é uma gata muito esperta que inventa todo tipo de coisa. Durante a sua visita, a porta se trancou atrás de você! Ande pela casa, encontre pistas, decifre códigos e abra seis salas trancadas. Chame seus amigos para jogar junto."], "<b>Secret ending!</b> You found all 6 golden fish. Marmalade was so happy she made you a golden crown and threw a fish party. 👑🐟🎶": ["<b>Fin secrète !</b> Tu as trouvé les 6 poissons dorés. Marmelade était si contente qu'elle t'a fabriqué une couronne dorée et a organisé une fête des poissons. 👑🐟🎶", "<b>Final secreto!</b> Você achou os 6 peixinhos dourados. A Marmelada ficou tão feliz que fez uma coroa dourada para você e deu uma festa dos peixes. 👑🐟🎶"], "You found {n} of Marmalade's 6 golden fish. Play again to find them all and unlock the secret ending!": ["Tu as trouvé {n} des 6 poissons dorés de Marmelade. Rejoue pour tous les trouver et débloquer la fin secrète !", "Você achou {n} dos 6 peixinhos dourados da Marmelada. Jogue de novo para achar todos e liberar o final secreto!"], "You floated home in Marmalade's hot-air balloon. When she came back with her butterfly, she named you an Official Puzzle Detective.": ["Tu as survolé la ville dans la montgolfière de Marmelade jusqu'à chez toi. À son retour avec son papillon, elle t'a donné le titre de Détective Officiel des Énigmes.", "Você voou para casa no balão da Marmelada. Quando ela voltou com sua borboleta, te deu o título de Detetive Oficial de Enigmas."], "The whole team floated home in Marmalade's hot-air balloon. When she came back with her butterfly, she named everyone an Official Puzzle Detective.": ["Toute l'équipe a survolé la ville dans la montgolfière de Marmelade jusqu'à la maison. À son retour avec son papillon, elle a donné à chacun le titre de Détective Officiel des Énigmes.", "A equipe toda voou para casa no balão da Marmelada. Quando ela voltou com sua borboleta, deu a todos o título de Detetive Oficial de Enigmas."], "Oven mitt": ["Gant de cuisine", "Luva de cozinha"], "A thick, fluffy mitt. Perfect for hot things.": ["Un gros gant tout doux. Parfait pour les choses chaudes.", "Uma luva grossa e fofinha. Perfeita para coisas quentes."], "Fish cookies": ["Biscuits poisson", "Biscoitos de peixe"], "Warm cookies shaped like little fish. They smell amazing!": ["Des biscuits tout chauds en forme de petits poissons. Ils sentent trop bon !", "Biscoitos quentinhos em forma de peixinho. Que cheiro bom!"], "Winding key": ["Clé de remontage", "Chave de corda"], "A little key for winding up a music box.": ["Une petite clé pour remonter une boîte à musique.", "Uma chavinha para dar corda numa caixinha de música."], "Balloon fuel": ["Carburant du ballon", "Combustível do balão"], "A can of fuel for the hot-air balloon's burner.": ["Un bidon de carburant pour le brûleur de la montgolfière.", "Uma lata de combustível para o queimador do balão."], "Marmalade's Kitchen": ["La cuisine de Marmelade", "A cozinha da Marmelada"], "Down a slide and into the kitchen! Something smells like cookies. A big sleepy dog named Biscuit is snoring right in front of the pantry door.": ["Un toboggan, et te voilà dans la cuisine ! Ça sent les biscuits. Un gros chien endormi qui s'appelle Biscuit ronfle juste devant la porte du garde-manger.", "Um escorregador e pronto, você está na cozinha! Tem cheiro de biscoito. Um cachorrão sonolento chamado Biscoito está roncando bem na frente da porta da despensa."], "The Music Room": ["La salle de musique", "A sala de música"], "The pantry led to a dim room full of instruments. Everything is very quiet. Maybe music is the key?": ["Le garde-manger mène à une salle sombre pleine d'instruments. Tout est très calme. Et si la musique était la clé ?", "A despensa dá numa sala escura cheia de instrumentos. Está tudo muito quieto. Será que a música é a chave?"], "The Rooftop": ["Le toit", "O telhado"], "A secret staircase leads up to the roof. Marmalade's hot-air balloon is waiting! Get it ready to fly and you're free.": ["Un escalier secret mène au toit. La montgolfière de Marmelade t'attend ! Prépare-la pour décoller et tu seras libre.", "Uma escada secreta leva ao telhado. O balão da Marmelada está esperando! Prepare-o para voar e você estará livre."], "The star key clicks and the round door spins open!": ["La clé étoile fait clic et la porte ronde tourne pour s'ouvrir !", "A chave-estrela faz clique e a porta redonda gira e se abre!"], "Biscuit gobbles the cookies and rolls out of the way. The pantry door is free!": ["Biscuit avale les biscuits et roule sur le côté. La porte du garde-manger est libre !", "Biscoito devora os biscoitos e rola para o lado. A porta da despensa está livre!"], "The last note rings out and a bookshelf swings open like a door!": ["La dernière note résonne et une bibliothèque s'ouvre comme une porte !", "A última nota ecoa e uma estante se abre como uma porta!"], "Liftoff! The balloon floats up over the rooftops...": ["Décollage ! La montgolfière s'élève au-dessus des toits...", "Decolar! O balão sobe por cima dos telhados..."], "The cupboard lock shows a plate, a cup and a spoon. Look at the shelf on the wall.": ["Le cadenas du placard montre une assiette, une tasse et une cuillère. Regarde l'étagère au mur.", "O cadeado do armário mostra um prato, uma xícara e uma colher. Olhe a prateleira na parede."], "Count the plates, then the cups, then the spoons on the shelf.": ["Compte les assiettes, puis les tasses, puis les cuillères sur l'étagère.", "Conte os pratos, depois as xícaras, depois as colheres na prateleira."], "The cupboard code is 4 3 6.": ["Le code du placard est 4 3 6.", "O código do armário é 4 3 6."], "Read the note on the fridge. What time does the kitchen clock show?": ["Lis la note sur le frigo. Quelle heure indique l'horloge de la cuisine ?", "Leia o bilhete na geladeira. Que horas o relógio da cozinha mostra?"], "The short hand points between 4 and 5. The long hand points at the 6.": ["La petite aiguille est entre le 4 et le 5. La grande aiguille montre le 6.", "O ponteiro pequeno está entre o 4 e o 5. O ponteiro grande aponta para o 6."], "Set the oven to 4:30.": ["Règle le four sur 4:30.", "Ajuste o forno para 4:30."], "Biscuit loves cookies! Walk over to him.": ["Biscuit adore les biscuits ! Va le voir.", "Biscoito adora biscoitos! Vá até ele."], "The room is too dark. Find the light switches on the wall.": ["La pièce est trop sombre. Trouve les interrupteurs au mur.", "A sala está escura demais. Ache os interruptores na parede."], "Each switch changes two lamps. Try different switches until all four lamps are on.": ["Chaque interrupteur change deux lampes. Essaie jusqu'à ce que les quatre lampes soient allumées.", "Cada interruptor muda duas lâmpadas. Tente até as quatro lâmpadas ficarem acesas."], "From the start, press switch 2, then switch 3.": ["Au début, appuie sur l'interrupteur 2, puis sur le 3.", "No começo, aperte o interruptor 2 e depois o 3."], "Wind up the music box and listen to its song. Then play the same song on the piano.": ["Remonte la boîte à musique et écoute sa chanson. Puis joue la même chanson au piano.", "Dê corda na caixinha de música e ouça a música. Depois toque a mesma música no piano."], "The music box plays five colored notes. Copy the colors in the same order.": ["La boîte à musique joue cinq notes de couleur. Recopie les couleurs dans le même ordre.", "A caixinha toca cinco notas coloridas. Copie as cores na mesma ordem."], "Play yellow, orange, red, orange, yellow.": ["Joue jaune, orange, rouge, orange, jaune.", "Toque amarelo, laranja, vermelho, laranja, amarelo."], "The fuel tank lock needs a picture. Look at the map on the table.": ["Le cadenas du réservoir veut une image. Regarde la carte sur la table.", "O cadeado do tanque pede uma figura. Olhe o mapa na mesa."], "Start at the house. Move 2 squares up, then 3 squares right.": ["Pars de la maison. Monte de 2 cases, puis va de 3 cases à droite.", "Comece na casa. Suba 2 quadrados e depois vá 3 para a direita."], "Pick the rainbow.": ["Choisis l'arc-en-ciel.", "Escolha o arco-íris."], "The balloon basket needs exactly 10 kg of sandbags.": ["La nacelle a besoin d'exactement 10 kg de sacs de sable.", "O cesto do balão precisa de exatamente 10 kg de sacos de areia."], "Add up the numbers on the bags. Which ones make 10?": ["Additionne les nombres sur les sacs. Lesquels font 10 ?", "Some os números dos sacos. Quais dão 10?"], "Try the 3 kg bag and the 7 kg bag.": ["Essaie le sac de 3 kg et celui de 7 kg.", "Tente o saco de 3 kg e o de 7 kg."], "Everything is ready! Light the burner on the balloon.": ["Tout est prêt ! Allume le brûleur de la montgolfière.", "Está tudo pronto! Acenda o queimador do balão."], "Shelf": ["Étagère", "Prateleira"], "Cupboard": ["Placard", "Armário"], "Clock": ["Horloge", "Relógio"], "Fridge": ["Frigo", "Geladeira"], "Oven": ["Four", "Forno"], "Sleeping dog": ["Chien endormi", "Cachorro dormindo"], "Light switches": ["Interrupteurs", "Interruptores"], "Music box": ["Boîte à musique", "Caixinha de música"], "Piano": ["Piano", "Piano"], "Wardrobe": ["Armoire", "Guarda-roupa"], "Bookshelf": ["Bibliothèque", "Estante"], "Map table": ["Table de la carte", "Mesa do mapa"], "Fuel tank": ["Réservoir", "Tanque"], "Sandbags": ["Sacs de sable", "Sacos de areia"], "Hot-air balloon": ["Montgolfière", "Balão"], "The kitchen shelf": ["L'étagère de la cuisine", "A prateleira da cozinha"], "Marmalade's dishes, all lined up neatly.": ["La vaisselle de Marmelade, bien rangée.", "A louça da Marmelada, toda arrumadinha."], "The cupboard": ["Le placard", "O armário"], "Just pots and pans now.": ["Il ne reste que des casseroles.", "Agora só tem panelas."], "A lock with three wheels. Above them are pictures: 🍽️ ☕ 🥄": ["Un cadenas à trois roues. Au-dessus, des dessins : 🍽️ ☕ 🥄", "Um cadeado com três rodinhas. Em cima, desenhos: 🍽️ ☕ 🥄"], "The kitchen clock": ["L'horloge de la cuisine", "O relógio da cozinha"], "Tick, tock. What time is it?": ["Tic, tac. Quelle heure est-il ?", "Tique, taque. Que horas são?"], "The fridge": ["Le frigo", "A geladeira"], "Cookie recipe: bake at the time on the kitchen clock. Careful, the oven is HOT! Use a mitt.": ["Recette des biscuits : cuire à l'heure de l'horloge de la cuisine. Attention, le four est CHAUD ! Utilise un gant.", "Receita de biscoito: asse na hora do relógio da cozinha. Cuidado, o forno está QUENTE! Use uma luva."], "The oven": ["Le four", "O forno"], "The oven is cooling down. The cookies are in your backpack.": ["Le four refroidit. Les biscuits sont dans ton sac.", "O forno está esfriando. Os biscoitos estão na sua mochila."], "Ouch! The oven door is too hot to touch. You need something to protect your hand.": ["Aïe ! La porte du four est trop chaude. Il te faut quelque chose pour protéger ta main.", "Ai! A porta do forno está quente demais. Você precisa de algo para proteger a mão."], "Set the oven timer and press Bake.": ["Règle la minuterie du four et appuie sur Cuire.", "Ajuste o timer do forno e aperte Assar."], "Bake": ["Cuire", "Assar"], "Hmm, the cookies aren't ready at that time. Check the recipe!": ["Hum, les biscuits ne sont pas prêts à cette heure-là. Relis la recette !", "Hum, os biscoitos não ficam prontos nessa hora. Confira a receita!"], "Biscuit the dog": ["Biscuit le chien", "O cachorro Biscoito"], "Zzzz... Biscuit is snoring and won't budge. Maybe something yummy would wake him up?": ["Zzzz... Biscuit ronfle et ne bouge pas. Peut-être que quelque chose de bon le réveillerait ?", "Zzzz... Biscoito está roncando e não se mexe. Será que algo gostoso acorda ele?"], "All the lamps are on. With the lights on, you spotted a key on top of the wardrobe!": ["Toutes les lampes sont allumées. Avec la lumière, tu as repéré une clé sur l'armoire !", "Todas as lâmpadas estão acesas. Com a luz acesa, você viu uma chave em cima do guarda-roupa!"], "Three switches and four lamps. Can you turn on all the lamps?": ["Trois interrupteurs et quatre lampes. Arrives-tu à allumer toutes les lampes ?", "Três interruptores e quatro lâmpadas. Você consegue acender todas?"], "The wardrobe": ["L'armoire", "O guarda-roupa"], "A tall wardrobe full of fancy costumes: top hats, capes and a feather boa.": ["Une grande armoire pleine de beaux costumes : chapeaux haut-de-forme, capes et un boa à plumes.", "Um guarda-roupa alto cheio de fantasias chiques: cartolas, capas e um boá de penas."], "The music box": ["La boîte à musique", "A caixinha de música"], "A little music box with a keyhole on the side. It needs to be wound up.": ["Une petite boîte à musique avec un trou de serrure sur le côté. Il faut la remonter.", "Uma caixinha de música com um buraquinho de chave do lado. Precisa de corda."], "You wind it up and it plays a little song. Watch the colors!": ["Tu la remontes et elle joue une petite chanson. Regarde bien les couleurs !", "Você dá corda e ela toca uma musiquinha. Preste atenção nas cores!"], "Play it again": ["Rejouer la chanson", "Tocar de novo"], "The piano": ["Le piano", "O piano"], "Five colored keys. Play a song!": ["Cinq touches de couleur. Joue une chanson !", "Cinco teclas coloridas. Toque uma música!"], "Hmm, that's not the music box's song. Try again!": ["Hum, ce n'est pas la chanson de la boîte à musique. Réessaie !", "Hum, essa não é a música da caixinha. Tente de novo!"], "The bookshelf": ["La bibliothèque", "A estante"], "A tall bookshelf. One book sticks out a little, but it won't move. Maybe something else opens it.": ["Une grande bibliothèque. Un livre dépasse un peu, mais il ne bouge pas. Peut-être que quelque chose d'autre l'ouvre ?", "Uma estante alta. Um livro está um pouco para fora, mas não mexe. Talvez outra coisa abra a estante."], "Marmalade's map": ["La carte de Marmelade", "O mapa da Marmelada"], "Where should the balloon land? Start at the 🏠. Go <b>2 squares up</b>, then <b>3 squares right</b>.": ["Où la montgolfière doit-elle atterrir ? Pars de la 🏠. Monte de <b>2 cases</b>, puis va de <b>3 cases à droite</b>.", "Onde o balão deve pousar? Comece na 🏠. Suba <b>2 quadrados</b> e depois vá <b>3 quadrados para a direita</b>."], "The fuel tank": ["Le réservoir", "O tanque de combustível"], "The tank is empty now. The fuel is in your backpack.": ["Le réservoir est vide. Le carburant est dans ton sac.", "O tanque está vazio. O combustível está na sua mochila."], "The fuel tank has a picture lock. Which picture opens it?": ["Le réservoir a un cadenas à images. Quelle image l'ouvre ?", "O tanque tem um cadeado de figuras. Qual figura abre?"], "Clank! That's not the right picture.": ["Clonk ! Ce n'est pas la bonne image.", "Clanc! Essa não é a figura certa."], "The basket is loaded with exactly 10 kg. Perfect balance!": ["La nacelle a exactement 10 kg. Équilibre parfait !", "O cesto está com exatamente 10 kg. Equilíbrio perfeito!"], "The balloon basket needs exactly <b>10 kg</b> to fly straight. Tap bags to put them in the basket.": ["La nacelle a besoin d'exactement <b>10 kg</b> pour voler droit. Touche les sacs pour les mettre dans la nacelle.", "O cesto precisa de exatamente <b>10 kg</b> para voar reto. Toque nos sacos para colocá-los no cesto."], "In the basket: {n} kg": ["Dans la nacelle : {n} kg", "No cesto: {n} kg"], "Load the basket": ["Charger la nacelle", "Carregar o cesto"], "The balloon tips over! It needs exactly 10 kg.": ["La montgolfière penche ! Il faut exactement 10 kg.", "O balão tombou! Precisa de exatamente 10 kg."], "The burner needs fuel.": ["Le brûleur a besoin de carburant.", "O queimador precisa de combustível."], "The basket isn't balanced yet.": ["La nacelle n'est pas encore équilibrée.", "O cesto ainda não está equilibrado."], "The hot-air balloon": ["La montgolfière", "O balão"], "Everything is ready! Climb in and light the burner.": ["Tout est prêt ! Monte dedans et allume le brûleur.", "Está tudo pronto! Suba e acenda o queimador."], "Light the burner": ["Allumer le brûleur", "Acender o queimador"], "The gate opened onto a winding staircase. At the top is Marmalade's star tower, full of telescopes and machines. Can you open the round door?": ["Le portail s'ouvre sur un escalier en colimaçon. En haut se trouve la tour des étoiles de Marmelade, pleine de télescopes et de machines. Sauras-tu ouvrir la porte ronde ?", "O portão dá numa escada em caracol. Lá em cima fica a torre das estrelas da Marmelada, cheia de telescópios e máquinas. Você consegue abrir a porta redonda?"], "Team play isn't available right now. You can still play alone.": ["Le jeu en équipe n'est pas disponible pour l'instant. Tu peux quand même jouer en solo.", "Jogar em equipe não está disponível agora. Você ainda pode jogar solo."], "Make a team, then tell your friends the team name so they can join.": ["Crée une équipe, puis donne le nom d'équipe à tes amis pour qu'ils te rejoignent.", "Crie uma equipe e conte o nome dela para seus amigos entrarem."]};

  function resize() {

    W.camera.updateProjectionMatrix();

    W.scene.add(W.room.group);
    W.scene.background = new T.Color(W.room.bg);

    W.tagsEl.append(meTag); W.meTag = meTag;
    const bub = document.createElement("div"); bub.className = "bubble"; bub.hidden = true; W.tagsEl.append(bub); W.meBubble = bub;
    W.others.forEach(o => { W.tagsEl.append(o.tag, o.bubble); });
  }

  const ray = new T.Raycaster(), ndc = new T.Vector2();
  function onPointer(e) {
    if (!W.room || !overlay.hidden) return;
    const r = W.canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, W.camera);
    const targets = [W.cat, ...W.room.spots.flatMap(s => [s.root, ...(s.extra || [])]).filter(o => o.visible !== false), ...W.room.floors];
    const hits = ray.intersectObjects(targets, true);
    for (const h of hits) {
      let o = h.object;
      while (o) {
        if (o === W.cat) { walkTo(W.catS.x, W.catS.z + 0.7, { cat: true }); return; }
        const s = W.room.spots.find(sp => sp.root === o || (sp.extra || []).includes(o));
        if (s) { if (s.fish && state.f[s.id]) break; goToSpot(s); return; }
        if (o.userData && o.userData.floor) { walkTo(h.point.x, h.point.z); return; }
        o = o.parent;
      }
    }
  }
  function goToSpot(s) { sfx.tap(); walkTo(s.stand[0], s.stand[1], { spot: s }); }
  function walkTo(x, z, pending) {
    W.me.tx = clampX(x); W.me.tz = clampZ(z); W.me.pending = pending || null;
    if (W.help) { W.help.hidden = true; }
  }
  function pushOut(o) {
    for (const [ox, oz, r] of W.room.obstacles) {
      const dx = o.x - ox, dz = o.z - oz, d = Math.hypot(dx, dz), min = r + 0.22;
      if (d < min && d > 0.0001) { o.x = ox + dx / d * min; o.z = oz + dz / d * min; }
    }
  }
  const tmpV = new T.Vector3();
  function placeTag(el, x, y, z, dy = 0) {
    tmpV.set(x, y, z).project(W.camera);
    const w = W.stage.clientWidth, h = W.stage.clientHeight;
    const sx = (tmpV.x + 1) / 2 * w, sy = (1 - tmpV.y) / 2 * h + dy;
    el.style.transform = `translate(${Math.round(sx)}px, ${Math.round(sy)}px) translate(-50%, -50%)`;
    el.style.visibility = tmpV.z < 1 ? "visible" : "hidden";
  }

  function loop() {
    W.raf = requestAnimationFrame(loop);
    if (!W.stage || !W.stage.isConnected || !W.room) return;
    const dt = Math.min(W.clock.getDelta(), 0.05), t = W.clock.elapsedTime;
    // me
    const me = W.me, dx = me.tx - me.x, dz = me.tz - me.z, dist = Math.hypot(dx, dz);
    me.moving = dist > 0.05;
    if (me.moving) {
      const step = Math.min(dist, 2.6 * dt), px = me.x, pz = me.z; me.x += dx / dist * step; me.z += dz / dist * step;
      pushOut(me);
      me.stuck = Math.hypot(me.x - px, me.z - pz) < step * 0.3 ? (me.stuck || 0) + 1 : 0;
      if (me.stuck > 8) { me.tx = me.x; me.tz = me.z; me.stuck = 0; }
      const want = Math.atan2(dx, dz); let d = want - W.player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); W.player.rotation.y += d * Math.min(1, dt * 12);
      sendPresence();
    } else if (me.pending) {
      const p = me.pending; me.pending = null; arrive(p);
    }
    W.player.position.set(me.x, me.y || 0, me.z);
    animatePerson(W.player, me.moving, t, me.emote);
    // cat wanders, sits, swishes her tail
    const c = W.catS, cdx = c.tx - c.x, cdz = c.tz - c.z, cd = Math.hypot(cdx, cdz);
    if (cd > 0.05) { const st = Math.min(cd, 1.1 * dt); c.x += cdx / cd * st; c.z += cdz / cd * st; pushOut(c); W.cat.rotation.y = Math.atan2(cdx, cdz); }
    else if ((c.wait -= dt) < 0) {
      c.wait = 3 + Math.random() * 5;
      if (Math.random() < 0.4) { c.tx = clampX(me.x + (Math.random() - 0.5) * 2); c.tz = clampZ(me.z + 0.6 + Math.random()); }
      else { c.tx = clampX(-4 + Math.random() * 8.5); c.tz = clampZ(-2.6 + Math.random() * 6); }
    }
    W.cat.position.set(c.x, 0, c.z);
    const cu = W.cat.userData, catMoving = cd > 0.05;
    cu.tail.rotation.z = Math.sin(t * (catMoving ? 6 : 2)) * 0.35;
    cu.legs.forEach((l, i) => l.rotation.x = catMoving ? Math.sin(t * 10 + (i % 2 ? 0 : Math.PI) + (i > 1 ? Math.PI : 0)) * 0.5 : 0);
    cu.head.rotation.y = catMoving ? 0 : Math.sin(t * 0.7) * 0.4;
    cu.body.position.y = catMoving ? Math.abs(Math.sin(t * 10)) * 0.02 : 0;
    // other players
    W.others.forEach(o => {
      const show = o.room === W.roomIdx;
      o.g.visible = show; o.tag.hidden = !show;
      if (!show) { o.bubble.hidden = true; return; }
      const odx = o.tx - o.x, odz = o.tz - o.z, od = Math.hypot(odx, odz);
      const moving = od > 0.05;
      if (od > 6) { o.x = o.tx; o.z = o.tz; }
      else if (moving) { const st = Math.min(od, 2.8 * dt); o.x += odx / od * st; o.z += odz / od * st; o.g.rotation.y = Math.atan2(odx, odz); }
      o.g.position.set(o.x, 0, o.z);
      animatePerson(o.g, moving, t, o.emote);
      placeTag(o.tag, o.x, 2.05, o.z);
      if (o.emote && t - o.emote.at < 2.2) { o.bubble.hidden = false; o.bubble.textContent = EMOTE_ICON[o.emote.k]; placeTag(o.bubble, o.x, 2.45, o.z); } else o.bubble.hidden = true;
    });
    // camera eases with the player
    const camX = me.x * (W.follow || 0.28), camZ = 9.4 + me.z * 0.15;
    W.camera.position.x += (camX - W.camera.position.x) * Math.min(1, dt * 3);
    W.camera.position.y = 6.4; W.camera.position.z += (camZ - W.camera.position.z) * Math.min(1, dt * 3);
    W.camera.lookAt(me.x * (W.follow || 0.28) * 0.75, W.room.lookY || 0.9, -0.4 + me.z * 0.1);
    W.room.tick(t, dt);
    W.renderer.render(W.scene, W.camera);
    // labels
    W.tags.forEach(tg => { placeTag(tg.el, tg.pos.x, tg.pos.y, tg.pos.z); tg.el.classList.toggle("done", !!(tg.spot.done && tg.spot.done())); });
    if (W.meTag) placeTag(W.meTag, me.x, 2.05, me.z);
    if (W.meBubble) { if (me.emote && t - me.emote.at < 2.2) { W.meBubble.hidden = false; W.meBubble.textContent = EMOTE_ICON[me.emote.k]; placeTag(W.meBubble, me.x, 2.45, me.z); } else W.meBubble.hidden = true; }
  }

  function arrive(p) {
    if (p.cat) {
      sfx.meow(); W.catS.tx = W.catS.x; W.catS.tz = W.catS.z; W.catS.wait = 4;
      const list = HINTS[stepKey()];
      return openCard(L("Professor Marmalade"), `<div class="big-emoji">🐱</div><p class="say">${L("\"Mrrrow! Hello, {name}! Here's a little clue: <b>{clue}</b>\"", { name: esc(state.name), clue: L(list[0]) })}</p><p style="color:var(--ink-soft)">${L("Need a bigger clue? Press the Hint button at the top.")}</p>`);
    }

  // =====================================================================
  //  Team play (room capability): everyone in a team shares puzzle progress
  // =====================================================================
  const NET = { listTeams: true, gap: 110, lobby: null, team: null, teamName: "", lastSend: 0, sendTimer: 0, mates: [], lobbyTeams: [] };
  const EMOTE_ICON = { wave: "👋", dance: "💃", jump: "⭐" };
  const curRoom = () => roomOf(state.f);
  const teamRoomName = code => "team-" + code.toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40);

  // Mimics the parts of the claude.ai room API this game uses (join, presence, onPeers, leave).
  function supaRoom(client) {
    const myKey = Math.random().toString(36).slice(2, 10);
    return {
      presence: () => Promise.resolve(),
      onPeers: () => () => {},
      join(name) {
        return new Promise((resolve, reject) => {
          const ch = client.channel("escape-quest:" + name, { config: { presence: { key: myKey } } });
          let mine = {}, listeners = [], prev = new Map();
          const snapshot = () => Object.entries(ch.presenceState()).map(([key, metas]) => {
            const m = metas[metas.length - 1] || {};
            return { peer: key, sameTab: key === myKey, isMe: key === myKey, presence: m.p || {} };
          });
          const fire = () => {
            const peers = snapshot(), now = new Map(peers.map(p => [p.peer, p]));
            const left = [...prev.keys()].filter(k => !now.has(k)).map(k => prev.get(k));
            prev = now; listeners.forEach(fn => fn({ peers, left, joined: [], updated: [] }));
          };
          const api = {
            presence(patch) { Object.assign(mine, patch); return ch.track({ p: mine }).catch(() => {}); },
            onPeers(fn) { listeners.push(fn); setTimeout(fire, 0); return () => { listeners = listeners.filter(f => f !== fn); }; },
            leave() { return client.removeChannel(ch); },
          };
          ch.on("presence", { event: "sync" }, fire);
          ch.subscribe(status => {
            if (status === "SUBSCRIBED") resolve(api);
            else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") reject(new Error(status));
          });
        });
      },
    };
  }
  async function initNet() {
    try {
      let room = null;
      const online = window.ESCAPE_ONLINE;
      if (online && window.supabase) {
        // Website build: code-only teams over Supabase Realtime presence, no public list of teams.
        room = supaRoom(window.supabase.createClient(online.url, online.key, { auth: { persistSession: false } }));
        NET.listTeams = false; NET.gap = 250;
      } else room = await window.claude?.use?.("room");
      if (!room) { NET.unavailable = true; refreshStartTeams(); return; }
      NET.lobby = room;
      room.onPeers(ch => {
        const teams = new Map();
        ch.peers.forEach(p => {
          if (p.sameTab) return;
          const code = typeof p.presence.team === "string" && /^[A-Z0-9-]{3,12}$/.test(p.presence.team) ? p.presence.team : null;
          if (!code || p.presence.done) return;
          if (!teams.has(code)) teams.set(code, []);
          teams.get(code).push(cleanName(p.presence.name));
        });
        NET.lobbyTeams = [...teams].map(([code, names]) => ({ code, names }));
        refreshStartTeams();
      }, () => { NET.unavailable = true; refreshStartTeams(); });
      refreshStartTeams();
      if (state && state.team && screen === "game") joinTeam(state.team);
    } catch (e) { NET.unavailable = true; refreshStartTeams(); }
  }
  async function joinTeam(code) {
    if (!NET.lobby) { if (NET.unavailable) toast(window.ESCAPE_ONLINE ? L("Team play isn't available right now. You can still play alone.") : L("Team play only works when the game is open on claude.ai. You can still play alone!")); return; }
    if (NET.team && NET.teamName === code) return;
    try {
      if (NET.team) { NET.team.leave(); NET.team = null; }
      const tr = await NET.lobby.join(teamRoomName(code));
      NET.team = tr; NET.teamName = code;
      tr.onPeers(onTeamPeers, () => { NET.team = null; renderMates(); });
      sendPresence(true);
      lobbyPresence();
    } catch (e) { toast(L("Couldn't reach your team right now. Keep playing, it will catch up.")); }
  }
  function lobbyPresence() {
    if (!NET.lobby) return;
    NET.lobby.presence({ name: state ? state.name : "", team: state && state.team ? state.team : null, done: state ? !!state.f.done : false }).catch(() => {});
  }
  function myPresence() {
    const f = {}; FLAGS.forEach(k => { if (state.f[k]) f[k] = true; });
    return { name: state.name, look: state.look, room: curRoom(), x: +W.me.x.toFixed(2), z: +W.me.z.toFixed(2), f, emote: W.me.emote ? { k: W.me.emote.k, n: W.me.emote.n } : null };
  }
  function sendPresence(force) {
    if (!NET.team || !state) return;

    NET.lastSend = now;

  }
  function onTeamPeers(ch) {
    if (!state) return;
    const t = W.clock.elapsedTime;
    let gained = [], who = "";
    ch.left.forEach(p => { const o = W.others.get(p.peer); if (o) { W.scene && W.scene.remove(o.g); o.tag.remove(); o.bubble.remove(); W.others.delete(p.peer); } });
    ch.peers.forEach(p => {
      if (p.sameTab) return;
      const pr = p.presence || {};
      if (!pr.name) return;
      // puzzle progress only ever moves forward, so union every teammate's flags
      if (pr.f && typeof pr.f === "object") FLAGS.forEach(k => { if (pr.f[k] === true && !state.f[k] && !gained.includes(k)) { gained.push(k); who = cleanName(pr.name); } });
      let o = W.others.get(p.peer);
      const lookKey = cleanLook(pr.look).join(",");
      if (!o) {
        const tag = document.createElement("div"); tag.className = "tag person";
        const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.hidden = true;
        o = { g: makePerson(pr.look), lookKey, tag, bubble, x: 0, z: 3, tx: 0, tz: 3, room: -1, emote: null, en: null, fresh: true };
        W.others.set(p.peer, o);

      } else if (o.lookKey !== lookKey) {

      o.name = cleanName(pr.name);
      o.room = Number.isInteger(pr.room) ? pr.room : -1;
      const x = Number(pr.x), z = Number(pr.z);
      if (Number.isFinite(x) && Number.isFinite(z)) { o.tx = clampX(x); o.tz = clampZ(z); if (o.fresh) { o.x = o.tx; o.z = o.tz; o.fresh = false; } }
      const em = pr.emote && EMOTE_ICON[pr.emote.k] ? pr.emote : null;
      if (em && em.n !== o.en) { o.en = em.n; o.emote = { k: em.k, at: t }; }
      o.shirt = PAL.shirt[cleanLook(pr.look)[3]];
    });
    NET.mates = ch.peers.filter(p => !p.sameTab && p.presence && p.presence.name).map(p => ({ name: cleanName(p.presence.name), shirt: PAL.shirt[cleanLook(p.presence.look)[3]] }));

  }
  function renderMates() {

  function stepKey() {
    const f = state.f, r = curRoom();
    if (r === 0) return !f.drawer ? "r1a" : !f.key ? "r1b" : "r1c";
    if (r === 1) return !f.shed ? "r2a" : "r2b";
    if (r === 2) return !f.chest ? "r3a" : !f.star ? "r3b" : "r3c";
    if (r === 3) return !f.cupboard ? "r4a" : !f.oven ? "r4b" : "r4c";
    if (r === 4) return !f.lamps ? "r5a" : "r5b";
    return !f.tank ? "r6a" : !f.bags ? "r6b" : "r6c";
  }
  function showHint() {
    const k = stepKey(), list = HINTS[k], lv = state.lv[k] || 0, i = Math.min(lv, list.length - 1);

  }

  function swatchRow(label, key, idx) {
    return `<div class="opt-row"><span>${label}</span><div class="swatches">${PAL[key].map((c, i) => `<button class="sw${draft.look[idx] === i ? " on" : ""}" style="--c:${c}" data-idx="${idx}" data-v="${i}" aria-label="${label} ${i + 1}"></button>`).join("")}</div></div>`;

  function wireStart(saved) {
    const nameIn = $("#player-name");
    nameIn.oninput = () => { draft.name = nameIn.value; };
    app.querySelectorAll("[data-idx]").forEach(b => b.onclick = () => {
      const idx = +b.dataset.idx; draft.look[idx] = +b.dataset.v; sfx.tap();
      app.querySelectorAll(`[data-idx="${idx}"]`).forEach(x => x.classList.toggle("on", x === b));
      updatePreview();
    });
    app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
      LANG = b.dataset.lang; document.documentElement.lang = LANG; draft.name = nameIn.value; sfx.tap();
      try { localStorage.setItem("escape-quest-lang", LANG); } catch (e) {}
      renderStart();
    });
    $("#surprise").onclick = () => { draft.look = randomLook(); draft.name = $("#player-name").value; renderStart(); };
    const begin = team => {
      const name = cleanName($("#player-name").value || "Detective");
      stopPreview();
      state = fresh(name, draft.look.slice(), team); tickStart = Date.now(); save();
      enterGame(true);
    };
    $("#solo").onclick = () => begin(null);
    $("#make-team").onclick = () => begin(`${TEAM_WORDS[Math.floor(Math.random() * TEAM_WORDS.length)]}-${100 + Math.floor(Math.random() * 900)}`);
    const join = code => {
      code = (code || "").toUpperCase().replace(/\s+/g, "").replace(/[^A-Z0-9-]/g, "");
      if (!/^[A-Z0-9-]{3,12}$/.test(code)) { toast(L("Type the team name your friend sees, like FROG-27.")); return; }
      begin(code);
