    box.innerHTML = NET.lobbyTeams.slice(0, 6).map(t => `<div class="team-row"><div><b>${esc(t.code)}</b><small>${t.names.map(esc).join(", ")}</small></div><button class="btn mint" data-join="${esc(t.code)}" style="font-size:16px;padding:6px 14px">${L("Join")}</button></div>`).join("");
    const teamBtns = ["#make-team", "#join-team"].map(s => $(s));
    if (NET.unavailable) { note.textContent = window.ESCAPE_ONLINE ? L("Team play isn't available right now. You can still play alone.") : L("Team play works when the game is open on claude.ai with friends it's shared with. You can still play alone here."); teamBtns.forEach(b => b && (b.disabled = true)); }
    else if (!NET.listTeams) note.textContent = L("Make a team, then tell your friends the team name so they can join.");
    else if (!NET.lobby) note.textContent = L("Looking for friends who are playing…");
    else note.textContent = NET.lobbyTeams.length ? L("Teams playing right now:") : L("No teams playing right now. Make one and share the link with a friend!");
  }

  // Character preview (its own tiny renderer, released when the game starts)
  let previewChar = null, previewScene = null, previewCam = null;
  function startPreview() {
    const cv = $("#preview"); if (!cv) return;
    try {
      if (!previewR) {
        previewR = new T.WebGLRenderer({ antialias: true, alpha: true });
        previewR.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        previewR.outputEncoding = T.sRGBEncoding; previewR.toneMapping = T.ACESFilmicToneMapping; previewR.toneMappingExposure = 0.9;
        previewScene = new T.Scene();
        previewScene.add(new T.HemisphereLight("#fff4e0", "#3b3156", 0.65));
        const d = new T.DirectionalLight("#ffffff", 0.9); d.position.set(2, 3, 4); previewScene.add(d);
        previewCam = new T.PerspectiveCamera(30, 170 / 220, 0.1, 20); previewCam.position.set(0, 1.1, 4.0); previewCam.lookAt(0, 0.85, 0);
      }
      previewR.setSize(170, 220, false);
      const el = previewR.domElement; el.className = "preview"; el.id = "preview"; el.setAttribute("aria-label", "Your character");
      cv.replaceWith(el);
      updatePreview();
      cancelAnimationFrame(previewRaf);
      const tick = () => {
        previewRaf = requestAnimationFrame(tick);
        if (!previewChar || !el.isConnected) return;
        const t = performance.now() / 1000; previewChar.rotation.y = Math.sin(t * 0.8) * 0.7;
        animatePerson(previewChar, false, t, { k: "wave", at: Math.floor(t / 5) * 5 });
        previewR.render(previewScene, previewCam);
      };
      tick();
    } catch (e) { cv.hidden = true; }
  }
  function updatePreview() {
    if (!previewScene) return;
    if (previewChar) previewScene.remove(previewChar);
    previewChar = makePerson(draft.look); previewScene.add(previewChar);
  }
  function stopPreview() { cancelAnimationFrame(previewRaf); previewRaf = 0; }

  function enterGame(isNew) {
    screen = "game";
    W.roomIdx = -1; // rebuild the room so its signs use the chosen language
    W.lifting = false;
    app.innerHTML = `
      <div class="bar" id="bar"></div>
      <div class="stage" id="stage">
        <div class="tags"></div>
        <div class="stage-help" id="help">${L("Tap the floor to walk. Tap things to look closer. Tap Marmalade the cat for a clue!")}</div>
        <div class="fishes" id="fishes"></div>
        <div class="emotes"><button data-emote="wave" aria-label="👋">👋</button><button data-emote="dance" aria-label="💃">💃</button><button data-emote="jump" aria-label="⭐">⭐</button></div>
      </div>
      <div class="lower">
        <div class="tray" id="tray"></div>
        <div class="tray" id="mates"></div>
      </div>`;
    renderBar(); renderTray(); renderFishes(); renderMates();
    W.help = $("#help");
    app.querySelectorAll("[data-emote]").forEach(b => b.onclick = () => {
      const k = b.dataset.emote; W.me.emote = { k, at: W.clock.elapsedTime, n: Math.floor(Math.random() * 1e6) }; sfx.tap(); sendPresence(true);
    });
    try { setupWorld($("#stage")); refreshPlayerLook(); }
    catch (e) { $("#stage").innerHTML = `<p class="stage-help">${L("This device couldn't start the 3D view. Try another browser.")}</p>`; }
    if (state.team) { joinTeam(state.team); lobbyPresence(); }
    if (isNew) {
      const teamLine = state.team ? `<p class="say">${L("You're on team <b>{code}</b>. Friends can join from the start screen, or by typing that name. Whatever anyone on your team solves, everyone gets!", { code: esc(state.team) })}</p>` : "";
      openCard(L(ROOMS[curRoom()].name), `<p>${L(ROOMS[curRoom()].intro)}</p>${teamLine}<button class="btn" id="go">${L("Let's go!")}</button>`, b => b.querySelector("#go").onclick = closeCard);
    }
    clearInterval(timerInt);
    timerInt = setInterval(() => { const t = $("#timer"); if (t && state && !state.f.done) t.textContent = `⏱ ${fmt(elapsed())}`; }, 1000);
  }
  function renderBar() {
    const bar = $("#bar"); if (!bar) return;
    const r = curRoom();
    bar.innerHTML = `
      <div class="room-name"><small>${L("Room {n} of 6", { n: r + 1 })} · ${esc(state.name)}</small><h2>${L(ROOMS[r].name)}</h2></div>
      <span class="pill" id="timer">⏱ ${fmt(elapsed())}</span>
      <button class="icon-btn" id="mute" aria-label="${muted ? "🔇" : "🔊"}">${muted ? "🔇" : "🔊"}</button>
      <button class="icon-btn" id="quit">${L("Exit")}</button>
      <button class="icon-btn hint" id="hint">💡 ${L("Hint")}</button>`;
    $("#hint").onclick = showHint;
    $("#mute").onclick = () => { muted = !muted; try { localStorage.setItem(SAVE_KEY + "-muted", muted ? "1" : "0"); } catch (e) {} renderBar(); };
    $("#quit").onclick = () => { save(); leaveTeam(); state = null; draft = null; renderStart(); };
  }
  function renderTray(newKeys = []) {
    const el = $("#tray"); if (!el) return;
    const items = Object.entries(ITEMS).filter(([id, it]) => has(id) && !state.f[it.used]);
    el.innerHTML = `<strong>${L("Backpack")}</strong>` + (items.length ? items.map(([id, it]) => `<button class="item${newKeys.includes(it.flag) ? " new" : ""}" data-item="${id}"><span>${it.icon}</span>${L(it.name)}</button>`).join("") : `<span class="empty">${L("Empty for now. Things you find go here.")}</span>`);
    el.querySelectorAll(".item").forEach(b => b.onclick = () => { const it = ITEMS[b.dataset.item]; openCard(L(it.name), `<div class="big-emoji">${it.icon}</div>${b.dataset.item === "note" ? `<div class="note">${L(it.text)}</div>` : `<p class="say">${L(it.text)}</p>`}`); });
  }
  function renderFishes() { const el = $("#fishes"); if (el) el.textContent = `🐟 ${L("Golden fish {n}/6", { n: fishCount() })}`; }
  function leaveTeam() {
    if (NET.team) { NET.team.leave().catch(() => {}); NET.team = null; NET.teamName = ""; }
    W.others.forEach(o => { W.scene && W.scene.remove(o.g); o.tag.remove(); o.bubble.remove(); }); W.others.clear(); NET.mates = [];
    if (NET.lobby) NET.lobby.presence({ team: null, name: "" }).catch(() => {});
  }

  function finish(who) {
    closeCard(); state.elapsed = elapsed(); save(); sfx.win();
    sendPresence(true); lobbyPresence();
    renderWin(who); confetti();
  }
  function renderWin(who) {
    screen = "win";
    clearInterval(timerInt);
    const stars = state.hints <= 4 ? 3 : state.hints <= 10 ? 2 : 1;
    const praise = ["", L("You never gave up, and that's what real detectives do!"), L("Sharp thinking! You barely needed any help."), L("Wow! A master detective. Professor Marmalade is very impressed.")][stars];
    const names = [state.name, ...NET.mates.map(m => m.name)];
    const fish = fishCount();
    const ending = names.length > 1
      ? L("The whole team floated home in Marmalade's hot-air balloon. When she came back with her butterfly, she named everyone an Official Puzzle Detective.")
      : L("You floated home in Marmalade's hot-air balloon. When she came back with her butterfly, she named you an Official Puzzle Detective.");
    app.innerHTML = `
      <section class="cert">
        <div style="font-size:64px" aria-hidden="true">${fish === 6 ? "🐱👑" : "🐱🎉"}</div>
        <h1>${L("You escaped!")}</h1>
        <div class="who">${names.map(esc).join(" & ")}</div>
        <div class="stars" aria-label="${stars}/3">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
        <p>${praise} ${ending}</p>
        ${fish === 6 ? `<p class="secret">${L("<b>Secret ending!</b> You found all 6 golden fish. Marmalade was so happy she made you a golden crown and threw a fish party. 👑🐟🎶")}</p>` : `<p>${L("You found {n} of Marmalade's 6 golden fish. Play again to find them all and unlock the secret ending!", { n: fish })}</p>`}
        <div class="stats"><span>⏱ ${fmt(state.elapsed)}</span><span>💡 ${state.hints}</span><span>🐟 ${fish}/6</span></div>
        <button class="btn" id="again">${L("Play again")}</button>
      </section>`;
    $("#again").onclick = () => { leaveTeam(); clearSave(); draft = { name: state.name, look: state.look.slice() }; state = null; W.roomIdx = -1; renderStart(); };
  }

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = document.createElement("canvas"); c.className = "confetti"; document.body.append(c);
    const ctx = c.getContext("2d"), Wd = c.width = innerWidth, H = c.height = innerHeight;
    const cols = ["#f39a2b", "#4fc59a", "#e2536b", "#f7d23e", "#9a5ae0", "#3f8ef0"];
    const bits = Array.from({ length: 160 }, () => ({ x: Math.random() * Wd, y: -Math.random() * H, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * 6, s: 6 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
    let frames = 0;
    (function step() {
      ctx.clearRect(0, 0, Wd, H);
      bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.r += 0.1; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
      if (++frames < 280) requestAnimationFrame(step); else c.remove();
    })();
  }

  // ---------- boot ----------
  window.claude?.hot?.snapshot?.(() => { if (state) state.elapsed = elapsed(); return { state, screen }; });
  const boot = async data => {
    if (!T) { app.innerHTML = `<p>${L("The 3D engine didn't load. Check your connection and reload the page.")}</p>`; return; }
    try { await Promise.race([document.fonts.load('800 40px "Grandstander"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
    if (data && data.state && data.screen === "game") { state = data.state; tickStart = Date.now(); enterGame(false); }
    else render();
    initNet();
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
